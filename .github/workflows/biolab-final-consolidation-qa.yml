name: BioLab Final Consolidation (No Deployment)
on:
  push:
    branches:
      - feature/biolab-final-consolidation-and-depth-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-student-browser-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate lesson schema, syllabus and rights
        run: |
          node scripts/validate-lessons.mjs
          node scripts/validate-biology.mjs
          node scripts/biology/validate-full-course-depth-audit.mjs
          node scripts/biology/validate-final-consolidation.mjs
      - name: Scientific figures and presentation tests
        run: |
          node --experimental-strip-types --test scripts/biology/figure-layout-refinement/figure-presentation.test.mjs
          node --test scripts/biology/scientific-visual-redesign.test.mjs scripts/biology/scientific-visual-assets-repair/verify.test.mjs
      - name: Site checks
        run: npm run quality
      - name: Production build only (no publish)
        run: npm run build
      - name: Chromium combined-branch student visual test
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/biology/scientific-visual-assets-repair/browser.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biolab-final-consolidation-browser-evidence
          path: |
            qa-artifacts/scientific-visual-assets-repair/
            preview.log
          retention-days: 14
