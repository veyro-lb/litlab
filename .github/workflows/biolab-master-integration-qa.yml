name: BioLab Master Integration QA (no deployment)

on:
  push:
    branches:
      - feature/biolab-all-sprints-integration-20261018

permissions:
  contents: read

jobs:
  integrated-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      CI: 'true'
    steps:
      - name: Checkout exact combined commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm isolated branch and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feature/biolab-all-sprints-integration-20261018
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git log -12 --pretty=format:'%h %s'
          echo
          echo "integration_sha=$GITHUB_SHA" > qa-integration-sha.txt
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci 2>&1 | tee qa-install.log
      - name: Standard site quality
        run: npm run quality 2>&1 | tee qa-quality.log
      - name: Run existing course checks
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/biology/full-course/readiness-audit.mjs
            node scripts/validate-phase9.mjs
            node --test scripts/validate-phase9.test.mjs
            node scripts/validate-phase7-batch3.mjs
            node --test scripts/validate-phase7-batch3.test.mjs
            node scripts/biology/phase8/validate.mjs
            node scripts/biology/phase8/negative.test.mjs
            node scripts/validate-biology.mjs
            node --test scripts/validate-biology.test.mjs
            node scripts/validate-water.mjs
            node scripts/validate-lessons.mjs
            node scripts/validate-batch32.mjs
            node scripts/validate-batch5.mjs
            node --test scripts/validate-batch5.test.mjs
            node scripts/validate-phase5-figures.mjs
            node --test scripts/validate-phase5-figures.test.mjs
            node scripts/validate-phase6-editorial.mjs
            node --test scripts/validate-phase6-editorial.test.mjs
            node scripts/validate-phase4-figures.mjs
            node --test scripts/validate-phase4-figures.test.mjs
            node --test scripts/validate-batch32.test.mjs
            node --test scripts/validate-water.test.mjs scripts/validate-lesson.test.mjs
            node --test scripts/biology/full-course/integration-negative.test.mjs
            for file in scripts/biology/theme-a/*-qa.mjs; do node "$file"; done
            node scripts/biology/theme-b/validate-all.mjs
            node --test scripts/biology/theme-c1/*.test.mjs scripts/biology/theme-c2/*.test.mjs
            node --test src/biology/learning/*/*.test.mjs
          } 2>&1 | tee qa-existing.log
      - name: All imported specialist and negative validation suites
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/biology/themes-ab-final/validate.mjs
            node scripts/biology/themes-ab-final/negative.test.mjs
            node --test scripts/biology/final-a1-a2/verify.test.mjs
            node scripts/biology/final-a3-a4/validate.mjs
            node --test scripts/biology/final-a3-a4/validate.test.mjs
            node scripts/biology/final-b1-b2/verify.mjs
            node scripts/biology/final-b3-b4/validate.mjs
            node scripts/biology/final-b3-b4/negative.test.mjs
            node scripts/biology/final-c1-c2/validate.mjs
            node scripts/biology/final-c3-c4/validate-final-sprint.mjs
            node --test scripts/biology/final-c3-c4/validate-final-sprint.test.mjs
            node scripts/biology/final-d1-d2/verify.mjs
            node scripts/biology/final-d1-d2/negative.test.mjs
            node scripts/biology/final-d3-d4/validate.mjs
            node --test scripts/biology/parallel-student-qa/audit.test.mjs
            node scripts/biology/parallel-student-qa/audit.mjs
          } 2>&1 | tee qa-specialists.log
      - name: Build integrated application
        run: npm run build 2>&1 | tee qa-build.log
      - name: Build original source for visual before comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-baseline
          git archive 2c321ae547baa2a97294728b337a4dfa46e64408 | tar -x -C .qa-baseline
          ln -s ../node_modules .qa-baseline/node_modules
          npm run build --prefix .qa-baseline 2>&1 | tee qa-baseline-build.log
      - name: Run browser suites in a non-networked Chromium container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/premium-interface qa-artifacts/parallel-student-qa docs/biology/parallel-student-qa/evidence node_modules/.vite-temp .qa-baseline/node_modules/.vite-temp
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI=true --env GITHUB_SHA="$GITHUB_SHA" --tmpfs /tmp:rw,nosuid,size=1024m --shm-size=1g --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/qa-artifacts,dst=/work/qa-artifacts" --mount "type=bind,src=$GITHUB_WORKSPACE/docs/biology/parallel-student-qa/evidence,dst=/work/docs/biology/parallel-student-qa/evidence" --mount "type=bind,src=$GITHUB_WORKSPACE/node_modules/.vite-temp,dst=/work/node_modules/.vite-temp" --mount "type=bind,src=$GITHUB_WORKSPACE/.qa-baseline/node_modules/.vite-temp,dst=/work/.qa-baseline/node_modules/.vite-temp" --workdir /work mcr.microsoft.com/playwright:v1.56.1-noble bash -euo pipefail -c '
            test "$(ls -1 /sys/class/net | tr "\n" " ")" = "lo "
            export CHROME_BIN="$(find /ms-playwright -type f -name chrome -perm /111 -print -quit)"
            test -x "$CHROME_BIN"
            npm run preview -- --host 127.0.0.1 --port 4173 > qa-artifacts/preview.log 2>&1 &
            npm run preview --prefix .qa-baseline -- --host 127.0.0.1 --port 4174 > qa-artifacts/baseline-preview.log 2>&1 &
            for attempt in $(seq 1 45); do
              if node -e "Promise.all([fetch(\"http://127.0.0.1:4173/\"),fetch(\"http://127.0.0.1:4174/\")]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"; then break; fi
              sleep 1
            done
            node scripts/biolab-reading-browser.mjs
            node scripts/biology/full-course/full-course-browser.mjs
            node scripts/biology/parallel-student-qa/browser.mjs
            node scripts/biology-premium-interface-smoke.mjs
          ' 2>&1 | tee qa-browser.log
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biolab-master-integration-qa
          path: |
            qa-*.log
            qa-integration-sha.txt
            qa-artifacts/
            docs/biology/parallel-student-qa/evidence/
          if-no-files-found: warn
          retention-days: 21
