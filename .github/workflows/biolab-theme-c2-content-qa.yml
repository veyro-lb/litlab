name: BioLab Theme C2 Independent Content QA
on:
  push:
    branches:
      - feature/biolab-complete-theme-c2-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-check:
    name: Test topic content without deployment
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Assert exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: npm ci
      - name: Run C3.1 contract and negative tests
        run: node --test scripts/biology/theme-c2/c31-checkpoint.test.mjs
      - name: Run repository quality checks
        run: npm run quality
      - name: Build only; no deployment
        run: npm run build
