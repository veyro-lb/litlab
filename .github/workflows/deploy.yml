name: Redirect legacy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - deploy/legacy-pages/**
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package legacy redirects
        run: |
          mkdir -p pages
          cp deploy/legacy-pages/index.html pages/index.html
          cp deploy/legacy-pages/index.html pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: pages
