name: BioLab Scientific Visual Assets Repair QA
on:
  push:
    branches: [feature/biolab-scientific-visual-assets-repair-20261018]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scientific-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lesson, source and scope validation
        run: |
          node scripts/validate-lessons.mjs
          node scripts/validate-biology.mjs
          node --experimental-strip-types --test scripts/biology/figure-layout-refinement/figure-presentation.test.mjs
          node --test scripts/biology/scientific-visual-redesign.test.mjs scripts/biology/scientific-visual-assets-repair/verify.test.mjs
      - run: npm run quality
      - run: npm run build
      - name: Render all scientific assets and embedded visuals on actual pages
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/biology/scientific-visual-assets-repair/browser.mjs before
          node scripts/biology/scientific-visual-assets-repair/browser.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-visual-assets-repair-evidence
          path: qa-artifacts/scientific-visual-assets-repair/
          retention-days: 14
