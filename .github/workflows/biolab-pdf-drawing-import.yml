name: BioLab PDF Drawing Import
on:
  push:
    branches: [feature/biolab-ib-visual-lab-final-20261018]
    paths:
      - scripts/biology/ancient-mariner/import.py
      - .github/workflows/biolab-pdf-drawing-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-pdf-drawings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/biolab-ib-visual-lab-final-20261018
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install --no-cache-dir pymupdf==1.26.4
      - name: Render direct source PDF crops and update exact IB lesson references
        run: python scripts/biology/ancient-mariner/import.py
      - name: Save real screenshot captures for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: biolab-original-pdf-screenshot-qa
          path: |
            public/biology/ancient-mariner/*.png
            docs/biology/ancient-mariner/SCREENSHOT_MANIFEST.json
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate build before committing any image references
        run: |
          npm ci
          node scripts/validate-biology.mjs
          npm run build
      - name: Commit approved PDF screenshots (not a deployment)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/biology/ancient-mariner/ docs/biology/ancient-mariner/ src/biology/learning/
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(biolab): use credited original PDF screenshots in Biology lessons"
          git push origin HEAD:feature/biolab-ib-visual-lab-final-20261018
