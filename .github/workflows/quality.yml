name: Quality Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run static site checks
        run: npm run quality
      - name: Build without CSS syntax warnings
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -Eq 'css-syntax-error|warnings when minifying css' build.log; then
            echo 'Build emitted a CSS syntax warning.'
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Audit desktop and mobile route rendering
        run: node scripts/browser-smoke.mjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-qa
          path: |
            qa-artifacts/
            preview.log
          if-no-files-found: warn
          retention-days: 7
