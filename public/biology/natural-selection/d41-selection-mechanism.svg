<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-label="Natural selection: from variation to evolution"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#317a75"/></marker></defs><rect width="1160" height="500" fill="#fff" rx="20"/><text x="36" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173c3a">Natural selection: from variation to evolution</text><rect x="31" y="145" width="207" height="198" rx="14" fill="#e4f3ed" stroke="#a7c9c2" stroke-width="1.5"/><text x="42" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Heritable variation</text><text x="42" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">already exists</text><path d="M 241 244 L 250 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="255" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="266" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Pressure acts on</text><text x="266" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">different phenotypes</text><path d="M 465 244 L 474 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="479" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="490" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Individuals differ in</text><text x="490" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">reproductive success</text><path d="M 689 244 L 698 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="703" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="714" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Offspring inherit</text><text x="714" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">some variants</text><path d="M 913 244 L 922 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="927" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="938" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Population allele</text><text x="938" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">frequencies change</text><text x="34" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">Selection changes frequencies across generations; it does not create alleles on demand.</text><text x="34" y="461" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#173c3a">Original BioLab explanatory diagram · conceptual, not measured data</text></svg>