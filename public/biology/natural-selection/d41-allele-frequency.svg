<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="410" viewBox="0 0 1050 410" role="img"><rect width="1050" height="410" rx="20" fill="#f5fbfb"/><style>text{font:18px system-ui;fill:#174656}.title{font-size:25px;font-weight:700}.note{font-size:14px;fill:#47727d}</style><text x="24" y="40" class="title">100 diploid individuals: 200 alleles at the locus</text><rect x="30" y="70" width="970" height="70" rx="10" fill="#eaf6f6" stroke="#96c0c4"/><text x="50" y="99">30 × AA</text><text x="465" y="99">60 A</text><rect x="30" y="159" width="970" height="70" rx="10" fill="#def1f2" stroke="#96c0c4"/><text x="50" y="188">50 × Aa</text><text x="465" y="188">50 A + 50 a</text><rect x="30" y="248" width="970" height="70" rx="10" fill="#eaf6f6" stroke="#96c0c4"/><text x="50" y="277">20 × aa</text><text x="465" y="277">40 a</text><text x="34" y="383">p(A) = (2 × 30 + 50) / 200 = 0.55 ; q(a) = 0.45</text></svg>