<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.4: Mitochondria: area, spaces and direction</title><desc id="desc">An outer membrane surrounds a folded, continuous inner membrane. The matrix is enclosed by the inner membrane. Intermembrane space lies between outer and inner membranes and extends into crista spaces. Respiratory H+ pumping proceeds from matrix toward intermembrane space; ATP-producing return through inner-membrane ATP synthase is toward matrix. Matrix contains Krebs-cycle enzymes and substrates. The lower inset describes direction, not actual membrane position or scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Mitochondria: area, spaces and direction</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><ellipse cx="400" cy="226" rx="324" ry="112" fill="#dcecf5" stroke="#246da2" stroke-width="5"/><path d="M125 200 Q146 145 214 148 L236 148 L236 233 Q236 260 254 260 Q272 260 272 233 L272 148 L326 148 L326 233 Q326 260 344 260 Q362 260 362 233 L362 148 L416 148 L416 233 Q416 260 434 260 Q452 260 452 233 L452 148 L506 148 L506 233 Q506 260 524 260 Q542 260 542 233 L542 148 L586 148 Q670 161 676 226 Q670 306 580 309 L214 309 Q127 306 125 240 Z" stroke="#b14e26" stroke-width="5" fill="#fff0dd"/><path d="M83 104 L140 146" stroke="#173d40" stroke-width="2" fill="none"/><path d="M455 104 L595 142" stroke="#173d40" stroke-width="2" fill="none"/><path d="M289 370 L344 260" stroke="#173d40" stroke-width="2" fill="none"/><rect x="60" y="402" width="680" height="110" rx="14" fill="#eff5f2" stroke="#173d40" stroke-width="3"/><text x="80" y="431" font-size="17" fill="#173d40">INNER MEMBRANE: FUNCTIONAL INSET</text></g></svg>