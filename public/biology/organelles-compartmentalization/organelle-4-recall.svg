<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" role="img" aria-labelledby="mitochondrion-title mitochondrion-desc"><title id="mitochondrion-title">Mitochondrion</title><desc id="mitochondrion-desc">Mitochondrion cutaway with two distinct continuous membranes. The inner membrane folds inward to form cristae, and the folds enclose intermembrane space. The matrix is inside the inner membrane. Cristae increase membrane area for aerobic ATP synthesis; Krebs cycle enzymes and substrates occur in the matrix. Not to scale; no membrane transport process arrows are shown.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="1000" height="672" fill="#f8fbfa"/><text x="35" y="54" class="title">Mitochondrion: membranes and compartments</text><text x="35" y="84" class="subtitle">Cristae are folds of one continuous inner membrane.</text><ellipse cx="500" cy="292" rx="297" ry="151" fill="#dbeef4" stroke="#326989" stroke-width="4"/><path d="M229 294 C229 212 285 169 345 169 L345 239 Q345 263 365 263 Q385 263 385 239 L385 169 H445 V239 Q445 263 465 263 Q485 263 485 239 V169 H545 V239 Q545 263 565 263 Q585 263 585 239 V169 H649 C734 174 772 234 772 296 C772 365 725 414 646 414 H352 C270 411 229 361 229 294 Z" fill="#fff3e3" stroke="#ae7252" stroke-width="4" stroke-linejoin="round"/><path class="leader" d="M197 161 L296 175"/><circle cx="296" cy="175" r="4" fill="#294b4b"/><path class="leader" d="M186 308 L229 302"/><circle cx="229" cy="302" r="4" fill="#294b4b"/><path class="leader" d="M114 471 L365 262"/><circle cx="365" cy="262" r="4" fill="#294b4b"/><path class="leader" d="M783 217 L784 292"/><circle cx="783" cy="249" r="4" fill="#294b4b"/><path class="leader" d="M783 354 L660 354"/><circle cx="660" cy="354" r="4" fill="#294b4b"/><path d="M35 526 H965" stroke="#d7e5e3" stroke-width="2"/><text x="37" y="573" class="step">Structure → function</text><text x="37" y="606" class="note">Cristae provide a large surface area for reactions supporting ATP synthesis.</text><text x="37" y="638" class="note">The matrix contains enzymes and substrates for the Krebs cycle.</text></svg>