<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.7: Same ribosome machinery, different protein routes</title><desc id="desc">A free polysome consists of several cytosolic ribosomes translating one mRNA, producing separate polypeptide chains. In the lower panel a translating ribosome sits on the cytosolic face of rough ER and the growing targeted polypeptide enters the lumen through membrane machinery. Ribosomes are not inside the ER. The schematic shows location and destination, not molecular structure, a measured chain length or individual membrane lipids.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Same ribosome machinery, different protein routes</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><text x="55" y="120" font-size="22" fill="#173d40">FREE POLYSOME IN CYTOSOL</text><path d="M70 170 Q140 152 230 170 T390 170" stroke="#246da2" stroke-width="4" fill="none"/><circle cx="130" cy="168" r="22" fill="#eaa862" stroke="#173d40" stroke-width="2"/><path d="M130 190 q10 20 22 12 q8 -4 15 12" stroke="#b14e26" stroke-width="4" fill="none"/><circle cx="245" cy="168" r="22" fill="#eaa862" stroke="#173d40" stroke-width="2"/><path d="M245 190 q10 20 22 12 q8 -4 15 12" stroke="#b14e26" stroke-width="4" fill="none"/><circle cx="350" cy="168" r="22" fill="#eaa862" stroke="#173d40" stroke-width="2"/><path d="M350 190 q10 20 22 12 q8 -4 15 12" stroke="#b14e26" stroke-width="4" fill="none"/><text x="490" y="168" font-size="21" fill="#173d40" data-recall-label="true">mRNA + ribosomes</text><text x="55" y="250" font-size="21" fill="#173d40">Example: a cytosolic enzyme</text><rect x="65" y="355" width="655" height="125" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><text x="95" y="441" font-size="21" fill="#173d40" data-recall-label="true">ER lumen</text><text x="55" y="320" font-size="21" fill="#173d40">CYTOSOL</text><circle cx="380" cy="350" r="28" fill="#eaa862" stroke="#173d40" stroke-width="2"/><path d="M335 316 H425" stroke="#246da2" stroke-width="4" fill="none"/><path d="M380 375 L380 401 q18 12 29 0 q15 -10 24 14" stroke="#b14e26" stroke-width="4" fill="none"/><text x="470" y="338" font-size="21" fill="#173d40" data-recall-label="true">ER-bound ribosome</text><path d="M478 346 L405 350" stroke="#173d40" stroke-width="2" fill="none"/><text x="430" y="448" font-size="21" fill="#173d40" data-recall-label="true">Growing secretory chain</text><path d="M438 456 L420 411" stroke="#173d40" stroke-width="2" fill="none"/><text x="65" y="524" font-size="21" fill="#173d40">Ribosomes stay cytosolic; the targeted chain enters ER.</text></g></svg>