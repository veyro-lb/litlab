<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="phago-title phago-desc"><title id="phago-title">Lysosome fusion and intracellular digestion</title><desc id="phago-desc">Three successive stages are shown, not one organelle. A membrane encloses an engulfed bacterium in a phagosome. A separate lysosome containing hydrolytic enzymes fuses with it. The phagolysosome retains a bounding membrane and digests its cargo in an acidic lumen. The model is not to scale.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="1000" height="655" fill="#f8fbfa"/><text x="36" y="53" class="title">Lysosome fusion and intracellular digestion</text><text x="36" y="84" class="subtitle">The stages are successive; membranes separate the lumen from the cytosol.</text><rect x="28" y="113" width="296" height="417" rx="16" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><rect x="352" y="113" width="296" height="417" rx="16" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><rect x="676" y="113" width="296" height="417" rx="16" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><text x="52" y="154" class="step">1   Form a phagosome</text><text x="376" y="154" class="step">2   Lysosome fusion</text><text x="700" y="154" class="step">3   Digest cargo</text><ellipse cx="176" cy="293" rx="88" ry="88" fill="#e8f4f1" stroke="#245e63" stroke-width="3"/><rect x="146" y="280" width="60" height="26" rx="12" class="bacteria"/><path d="M159 284 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M176 284 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M193 284 l8 18" stroke="#fff9f6" stroke-width="2"/><text x="54" y="444" class="label" data-recall-label="true">Phagosome</text><path class="leader" d="M162 426 L137 370"/><circle cx="137" cy="370" r="4" fill="#294b4b"/><text x="54" y="478" class="small">Engulfed bacterium</text><ellipse cx="486" cy="296" rx="87" ry="87" fill="#e8f4f1" stroke="#245e63" stroke-width="3"/><rect x="456" y="283" width="60" height="26" rx="12" class="bacteria"/><path d="M469 287 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M486 287 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M503 287 l8 18" stroke="#fff9f6" stroke-width="2"/><ellipse cx="578" cy="208" rx="33" ry="33" fill="#fff0dd" stroke="#a76642" stroke-width="3"/><circle cx="567" cy="200" r="4.5" class="enzyme"/><circle cx="587" cy="199" r="4.5" class="enzyme"/><circle cx="575" cy="221" r="4.5" class="enzyme"/><circle cx="592" cy="216" r="4.5" class="enzyme"/><path d="M559 238 Q533 248 524 273" class="flow"/><text x="376" y="447" class="label" data-recall-label="true">Phagosome</text><path class="leader" d="M456 432 L444 370"/><circle cx="444" cy="370" r="4" fill="#294b4b"/><text x="378" y="222" class="label" data-recall-label="true">Lysosome</text><path class="leader" d="M489 216 L546 207"/><circle cx="546" cy="207" r="4" fill="#294b4b"/><ellipse cx="824" cy="293" rx="88" ry="88" fill="#fff0dd" stroke="#236a6c" stroke-width="4"/><path d="M800 285 l17 12 -20 15 M825 277 l17 10 -11 15 M838 311 l14 -12" stroke="#ae6b5a" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="787" cy="281" r="5" class="enzyme"/><circle cx="806" cy="321" r="5" class="enzyme"/><circle cx="841" cy="268" r="5" class="enzyme"/><circle cx="861" cy="307" r="5" class="enzyme"/><circle cx="828" cy="297" r="5" class="enzyme"/><text x="705" y="447" class="label" data-recall-label="true">Phagolysosome</text><path class="leader" d="M819 431 L805 379"/><circle cx="805" cy="379" r="4" fill="#294b4b"/><text x="701" y="479" class="small">Digestion in its lumen</text><path d="M329 295 H349" class="flow"/><path d="M653 295 H673" class="flow"/><text x="39" y="587" class="note">Lysosomal enzymes break down cargo after membrane fusion.</text><text x="39" y="615" class="small">The phagolysosome is enclosed by one limiting membrane.</text></svg>