<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.9: A coat on the cytosolic face</title><desc id="desc">The plasma membrane invaginates inward around external cargo bound to a receptor. Clathrin is shown along the cytosolic convex surface of the pit, outside the future lumen; adaptors connect coat to cargo receptors but are not individually resolved. Scission produces a coated vesicle, then the coat is removed before downstream fusion. The final circle shows an uncoated vesicle with lumenal cargo. Other scission and targeting machinery is omitted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">A coat on the cytosolic face</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><text x="55" y="120" font-size="23" fill="#173d40">OUTSIDE CELL</text><text x="55" y="405" font-size="23" fill="#173d40">CYTOSOL</text><path d="M45 205 H225 Q250 205 250 245 Q250 335 330 335 Q410 335 410 245 Q410 205 435 205 H755" stroke="#246da2" stroke-width="9" fill="none"/><circle cx="330" cy="250" r="17" fill="#ce7570" stroke="#173d40" stroke-width="2"/><text x="302" y="255" font-size="13" fill="#173d40">cargo</text><path d="M330 268 V320" stroke="#b14e26" stroke-width="5" fill="none"/><path d="M227 249 Q220 357 330 360 Q440 357 433 249" stroke="#b14e26" stroke-width="9" fill="none"/><path d="M503 326 L430 334" stroke="#173d40" stroke-width="2" fill="none"/><path d="M88 181 L330 294" stroke="#173d40" stroke-width="2" fill="none"/><path d="M470 433 L560 433" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="635" cy="433" r="55" fill="#e6f1f8" stroke="#173d40" stroke-width="2"/><circle cx="635" cy="433" r="14" fill="#ce7570" stroke="#173d40" stroke-width="2"/><text x="70" y="522" font-size="20" fill="#173d40">External cargo becomes lumenal; the coat never enters the lumen.</text></g></svg>