<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.5: Chloroplasts: a separate thylakoid system</title><desc id="desc">Two envelope membranes enclose stroma. Closed thylakoids, drawn as two simplified grana, are separate from the envelope. Their membranes contain photosystems; their small lumens accumulate H+. Return through thylakoid ATP synthase proceeds from lumen toward stroma. The stroma contains Calvin-cycle enzymes and substrates. Stromal lamellae connecting grana are omitted to keep compartment boundaries clear; no scale is implied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Chloroplasts: a separate thylakoid system</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><ellipse cx="400" cy="260" rx="330" ry="155" fill="#e3eee2" stroke="#147d6f" stroke-width="5"/><ellipse cx="400" cy="260" rx="311" ry="136" fill="#f4f7dd" stroke="#147d6f" stroke-width="4"/><rect x="175" y="212" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><rect x="175" y="244" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><rect x="175" y="276" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><rect x="445" y="212" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><rect x="445" y="244" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><rect x="445" y="276" width="170" height="25" rx="10" fill="#c7e5c5" stroke="#147d6f" stroke-width="3"/><path d="M98 96 L158 159" stroke="#173d40" stroke-width="2" fill="none"/><path d="M468 180 L598 204" stroke="#173d40" stroke-width="2" fill="none"/><path d="M101 368 L212 256" stroke="#173d40" stroke-width="2" fill="none"/><path d="M458 371 L510 301" stroke="#173d40" stroke-width="2" fill="none"/><text x="230" y="432" font-size="19" fill="#173d40">Separate internal membrane system</text><rect x="60" y="440" width="680" height="84" rx="14" fill="#eff5f2" stroke="#173d40" stroke-width="3"/><text x="80" y="505" font-size="21" fill="#173d40">Calvin cycle: enzymes and substrates in stroma</text></g></svg>