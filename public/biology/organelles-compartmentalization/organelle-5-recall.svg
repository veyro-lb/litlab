<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 699" role="img" aria-labelledby="chloroplast-title chloroplast-desc"><title id="chloroplast-title">Chloroplast</title><desc id="chloroplast-desc">Chloroplast cutaway with separate outer and inner envelope membranes. The stroma surrounds a connected thylakoid membrane system consisting of two grana and a stroma lamella. An enlarged single thylakoid shows its membrane enclosing a small lumen. Photosystems are in thylakoid membranes; Calvin cycle enzymes and substrates are in the stroma. The inset and organelle are schematic, not to scale, and no proton direction is shown.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="1000" height="699" fill="#f8fbfa"/><text x="35" y="54" class="title">Chloroplast: envelope and thylakoid system</text><text x="35" y="84" class="subtitle">Grana and stroma lamellae belong to the internal membrane system.</text><ellipse cx="500" cy="313" rx="324" ry="178" fill="#d9ece1" stroke="#276b5c" stroke-width="5"/><ellipse cx="500" cy="313" rx="307" ry="160" fill="#f5f9e8" stroke="#4e8c72" stroke-width="4"/><rect x="425" y="288" width="155" height="13" rx="6" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><rect x="305" y="247" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M318 258 H404" stroke="#a8cea8" stroke-width="3"/><rect x="305" y="276" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M318 287 H404" stroke="#a8cea8" stroke-width="3"/><rect x="305" y="305" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M318 316 H404" stroke="#a8cea8" stroke-width="3"/><rect x="305" y="334" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M318 345 H404" stroke="#a8cea8" stroke-width="3"/><rect x="577" y="247" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M590 258 H676" stroke="#a8cea8" stroke-width="3"/><rect x="577" y="276" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M590 287 H676" stroke="#a8cea8" stroke-width="3"/><rect x="577" y="305" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M590 316 H676" stroke="#a8cea8" stroke-width="3"/><rect x="577" y="334" width="112" height="22" rx="11" fill="#cee8ca" stroke="#2c7160" stroke-width="3"/><path d="M590 345 H676" stroke="#a8cea8" stroke-width="3"/><path class="leader" d="M261 197 L211 242"/><circle cx="211" cy="242" r="4" fill="#294b4b"/><path class="leader" d="M254 305 L194 313"/><circle cx="194" cy="313" r="4" fill="#294b4b"/><path class="leader" d="M121 461 L305 389"/><circle cx="305" cy="389" r="4" fill="#294b4b"/><path class="leader" d="M796 249 L691 270"/><circle cx="691" cy="270" r="4" fill="#294b4b"/><path class="leader" d="M685 456 L503 294"/><circle cx="503" cy="294" r="4" fill="#294b4b"/><path d="M35 506 H965" stroke="#d7e5e3" stroke-width="2"/><text x="35" y="545" class="step">Enlarged single thylakoid</text><rect x="347" y="568" width="303" height="62" rx="30" fill="#d5ebd1" stroke="#2c7160" stroke-width="6"/><rect x="369" y="587" width="259" height="24" rx="12" fill="#f1f8d8" stroke="none"/><path class="leader" d="M227 600 L349 595"/><circle cx="349" cy="595" r="4" fill="#294b4b"/><path class="leader" d="M696 602 L621 601"/><circle cx="621" cy="601" r="4" fill="#294b4b"/><text x="37" y="669" class="note">Photosystems are in thylakoid membranes; Calvin cycle enzymes are in the stroma.</text></svg>