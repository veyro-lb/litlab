<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.6: Selective exchange, then access for division</title><desc id="desc">A local section shows two nuclear-envelope membranes separated by perinuclear space. A nuclear pore complex spans a gap through both and regulates RNA export and protein import. In open mitosis or meiosis, envelope breakdown permits spindle access to chromosomes; membrane fragments and ER-associated material later contribute to reassembly. Membranes are thick strokes, each representing a bilayer; pore size and fragmentation are schematic. ER continuity is explained in text but not drawn here.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Selective exchange, then access for division</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><text x="70" y="115" font-size="23" fill="#173d40">CYTOPLASM</text><text x="70" y="310" font-size="23" fill="#246da2">NUCLEOPLASM</text><path d="M55 165 H340 M420 165 H720" stroke="#246da2" stroke-width="12" fill="none"/><path d="M55 222 H340 M420 222 H720" stroke="#246da2" stroke-width="12" fill="none"/><rect x="332" y="152" width="16" height="83" rx="2" fill="#f3b977" stroke="#b14e26" stroke-width="3"/><rect x="412" y="152" width="16" height="83" rx="2" fill="#f3b977" stroke="#b14e26" stroke-width="3"/><path d="M380 130 V274" stroke="#173d40" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="465" y="119" font-size="21" fill="#173d40" data-recall-label="true">Nuclear pore spans both</text><path d="M473 127 L420 160" stroke="#173d40" stroke-width="2" fill="none"/><text x="65" y="204" font-size="21" fill="#173d40" data-recall-label="true">Perinuclear space</text><text x="470" y="272" font-size="20" fill="#173d40">RNA out / proteins in</text><text x="60" y="376" font-size="23" fill="#173d40">Open division: envelope disassembles</text><path d="M370 391 L370 428" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="125" y="445" width="56" height="36" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><rect x="240" y="445" width="56" height="36" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><rect x="355" y="445" width="56" height="36" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><rect x="470" y="445" width="56" height="36" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><rect x="585" y="445" width="56" height="36" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><text x="80" y="520" font-size="20" fill="#173d40">Membrane fragments / ER-associated material; later reassembly</text></g></svg>