<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 954" role="img" aria-labelledby="chloroplast-mobile-title chloroplast-mobile-desc"><title id="chloroplast-mobile-title">Chloroplast</title><desc id="chloroplast-mobile-desc">Chloroplast cutaway with separate outer and inner envelope membranes. The stroma surrounds a connected thylakoid membrane system consisting of two grana and a stroma lamella. An enlarged single thylakoid shows its membrane enclosing a small lumen. Photosystems are in thylakoid membranes; Calvin cycle enzymes and substrates are in the stroma. The inset and organelle are schematic, not to scale, and no proton direction is shown.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="560" height="954" fill="#f8fbfa"/><text x="24" y="50" class="title">Chloroplast</text><text x="24" y="80" class="subtitle">Separate membrane systems</text><ellipse cx="281" cy="328" rx="240" ry="132" fill="#d9ece1" stroke="#276b5c" stroke-width="4"/><ellipse cx="281" cy="328" rx="226" ry="120" fill="#f5f9e8" stroke="#4e8c72" stroke-width="3"/><rect x="250" y="315" width="70" height="10" rx="5" fill="#cee8ca" stroke="#2c7160" stroke-width="2"/><rect x="172" y="283" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><rect x="172" y="307" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><rect x="172" y="331" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><rect x="318" y="283" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><rect x="318" y="307" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><rect x="318" y="331" width="80" height="17" rx="9" fill="#cee8ca" stroke="#2c7160" stroke-width="2.5"/><text x="25" y="148" class="label" data-recall-label="true">Outer envelope</text><text x="25" y="171" class="label" data-recall-label="true">membrane</text><path class="leader" d="M173 175 L133 218"/><circle cx="133" cy="218" r="4" fill="#294b4b"/><text x="319" y="148" class="label" data-recall-label="true">Inner envelope</text><text x="319" y="171" class="label" data-recall-label="true">membrane</text><path class="leader" d="M396 176 L415 219"/><circle cx="415" cy="219" r="4" fill="#294b4b"/><text x="25" y="526" class="label" data-recall-label="true">Stroma</text><path class="leader" d="M107 517 L197 423"/><circle cx="197" cy="423" r="4" fill="#294b4b"/><text x="368" y="520" class="label" data-recall-label="true">Granum</text><path class="leader" d="M361 508 L361 348"/><circle cx="361" cy="348" r="4" fill="#294b4b"/><text x="25" y="588" class="label" data-recall-label="true">Stroma lamella</text><path class="leader" d="M186 581 L282 319"/><circle cx="282" cy="319" r="4" fill="#294b4b"/><path d="M25 619 H535" stroke="#d7e5e3" stroke-width="2"/><text x="25" y="660" class="step">Enlarged thylakoid</text><rect x="115" y="697" width="325" height="71" rx="32" fill="#cee8ca" stroke="#2c7160" stroke-width="6"/><rect x="137" y="717" width="282" height="30" rx="15" fill="#f1f8d8"/><text x="20" y="813" class="label" data-recall-label="true">Thylakoid membrane</text><path class="leader" d="M221 803 L206 767"/><circle cx="206" cy="767" r="4" fill="#294b4b"/><text x="286" y="849" class="label" data-recall-label="true">Thylakoid lumen</text><path class="leader" d="M357 833 L354 734"/><circle cx="354" cy="734" r="4" fill="#294b4b"/><text x="25" y="898" class="small">Photosystems: thylakoid membrane</text><text x="25" y="928" class="small">Calvin cycle enzymes: stroma</text></svg>