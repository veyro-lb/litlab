<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1140" role="img" aria-labelledby="phago-mobile-title phago-mobile-desc"><title id="phago-mobile-title">Lysosome fusion</title><desc id="phago-mobile-desc">Three successive stages are shown, not one organelle. A membrane encloses an engulfed bacterium in a phagosome. A separate lysosome containing hydrolytic enzymes fuses with it. The phagolysosome retains a bounding membrane and digests its cargo in an acidic lumen. The model is not to scale.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="560" height="1140" fill="#f8fbfa"/><text x="26" y="53" class="title">Lysosome fusion</text><text x="26" y="82" class="subtitle">Three stages of intracellular digestion</text><rect x="18" y="112" width="524" height="280" rx="14" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><rect x="18" y="410" width="524" height="323" rx="14" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><rect x="18" y="751" width="524" height="295" rx="14" fill="#fff" stroke="#d7e5e3" stroke-width="2"/><text x="35" y="148" class="step">1   Form a phagosome</text><ellipse cx="155" cy="264" rx="76" ry="76" fill="#e8f4f1" stroke="#245e63" stroke-width="3"/><rect x="125" y="251" width="60" height="26" rx="12" class="bacteria"/><path d="M138 255 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M155 255 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M172 255 l8 18" stroke="#fff9f6" stroke-width="2"/><path class="leader" d="M285 265 L231 265"/><circle cx="231" cy="265" r="4" fill="#294b4b"/><text x="292" y="295" class="small">Enclosed bacterium</text><path d="M270 397 V425" class="flow"/><text x="35" y="447" class="step">2   Lysosome fusion</text><ellipse cx="155" cy="599" rx="76" ry="76" fill="#e8f4f1" stroke="#245e63" stroke-width="3"/><rect x="125" y="586" width="60" height="26" rx="12" class="bacteria"/><path d="M138 590 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M155 590 l8 18" stroke="#fff9f6" stroke-width="2"/><path d="M172 590 l8 18" stroke="#fff9f6" stroke-width="2"/><ellipse cx="247" cy="505" rx="29" ry="29" fill="#fff0dd" stroke="#a76642" stroke-width="3"/><circle cx="238" cy="505" r="4" class="enzyme"/><circle cx="251" cy="495" r="4" class="enzyme"/><circle cx="254" cy="515" r="4" class="enzyme"/><path d="M232 533 Q209 546 203 562" class="flow"/><path class="leader" d="M289 504 L277 505"/><circle cx="277" cy="505" r="4" fill="#294b4b"/><path class="leader" d="M289 613 L232 613"/><circle cx="232" cy="613" r="4" fill="#294b4b"/><path d="M270 736 V766" class="flow"/><text x="35" y="786" class="step">3   Digest cargo</text><ellipse cx="155" cy="930" rx="77" ry="77" fill="#fff0dd" stroke="#245e63" stroke-width="3"/><path d="M135 922 l18 13 -12 11 M164 911 l14 9 -9 16" stroke="#ae6b5a" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="130" cy="913" r="5" class="enzyme"/><circle cx="180" cy="948" r="5" class="enzyme"/><circle cx="171" cy="905" r="5" class="enzyme"/><circle cx="146" cy="953" r="5" class="enzyme"/><path class="leader" d="M285 933 L231 933"/><circle cx="231" cy="933" r="4" fill="#294b4b"/><text x="290" y="968" class="small">Acidic digestion</text><text x="24" y="1084" class="small">All compartments have a surrounding</text><text x="24" y="1108" class="small">membrane; the cytosol is outside.</text></svg>