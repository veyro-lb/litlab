<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.2: Separate the message from its translation</title><desc id="desc">Two nuclear-envelope membranes separate nuclear transcription and RNA processing from cytoplasmic translation. A transcript with exons A and B and intron X is spliced to mature A–B mRNA. The mRNA exits through a pore spanning both membranes and is translated by a cytoplasmic ribosome. The pore and ribosome are greatly enlarged; RNA letters denote segments, not individual bases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Separate the message from its translation</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><rect x="40" y="105" width="370" height="345" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><text x="66" y="145" font-size="24" fill="#246da2">NUCLEUS</text><rect x="55" y="120" width="340" height="315" rx="14" fill="none" stroke="#246da2" stroke-width="3"/><text x="75" y="202" font-size="23" fill="#173d40">DNA → primary RNA</text><text x="75" y="251" font-size="20" fill="#173d40">exon A | intron X | exon B</text><path d="M232 268 L232 305" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="120" y="397" font-size="23" fill="#173d40">mature mRNA: A–B</text><rect x="389" y="352" width="36" height="62" rx="0" fill="#f7faf6" stroke="#f7faf6" stroke-width="3"/><path d="M325 382 L480 382" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M426 338 L409 357" stroke="#173d40" stroke-width="2" fill="none"/><text x="482" y="145" font-size="24" fill="#173d40">CYTOPLASM</text><circle cx="570" cy="382" r="36" fill="#eaa862" stroke="#173d40" stroke-width="2"/><text x="535" y="389" font-size="14" fill="#173d40">ribosome</text><path d="M616 382 L697 382" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="570" y="451" font-size="20" fill="#173d40">polypeptide</text><text x="45" y="510" font-size="21" fill="#173d40">RNA is processed before cytoplasmic ribosomes read it.</text></g></svg>