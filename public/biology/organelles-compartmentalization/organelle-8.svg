<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="golgi-title golgi-desc"><title id="golgi-title">Golgi apparatus and secretion</title><desc id="golgi-desc">Schematic protein secretion route, not to scale. Ribosomes on rough endoplasmic reticulum make cargo proteins that move in membrane-bound carriers to the cis face of the Golgi stack. Golgi cisternae are flattened, curved membrane sacs that modify and sort the cargo. Secretory vesicles leave the trans face for later fusion at the plasma membrane and protein release. Intra-Golgi traffic and its recycling pathways are deliberately not specified.</desc><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#345e60"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#60747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#375c61;stroke-width:2;fill:none;stroke-linecap:round}.arrow{stroke:#345e60;stroke-width:3;fill:none;marker-end:url(#end)}.cisterna{fill:#e2f0ed;stroke:#247a6b;stroke-width:3}</style><rect width="1000" height="565" fill="#f8fbfa"/><text x="35" y="54" class="title">From rough ER to the Golgi and secretion</text><text x="35" y="84" class="subtitle">Processing and sorting occur in stacks of flattened membrane sacs.</text><path d="M86 249 Q170 234 268 249 M86 273 Q170 258 268 273 M86 297 Q170 282 268 297 M86 321 Q170 306 268 321" fill="none" stroke="#36749d" stroke-width="9" stroke-linecap="round"/><circle cx="101" cy="237" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="118" cy="237" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="135" cy="237" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="152" cy="261" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="169" cy="261" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="186" cy="261" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="203" cy="285" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="220" cy="285" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="237" cy="285" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="254" cy="309" r="4.5" fill="#c68d53" stroke="#8e5c38" stroke-width="1"/><circle cx="330" cy="285" r="26" fill="#f5e7c9" stroke="#a46e43" stroke-width="3"/><path class="arrow" d="M273 285 L301 285"/><path class="arrow" d="M359 285 L416 285"/><path class="cisterna" d="M445 216 Q545 202 645 216 Q659 230 645 238 Q545 221 445 238 Q431 227 445 216 Z"/><path class="cisterna" d="M448 249 Q545 235 642 249 Q656 263 642 271 Q545 254 448 271 Q434 260 448 249 Z"/><path class="cisterna" d="M451 282 Q545 268 639 282 Q653 296 639 304 Q545 287 451 304 Q437 293 451 282 Z"/><path class="cisterna" d="M454 315 Q545 301 636 315 Q650 329 636 337 Q545 320 454 337 Q440 326 454 315 Z"/><circle cx="750" cy="295" r="32" fill="#f5e7c9" stroke="#a46e43" stroke-width="3"/><path class="arrow" d="M676 295 L709 295"/><path class="arrow" d="M790 295 L836 295"/><path d="M865 235 V366 M882 235 V366" stroke="#316e86" stroke-width="5" stroke-linecap="round"/><text x="86" y="388" class="label" data-recall-label="true">Rough ER</text><path class="leader" d="M177 377 L165 319"/><circle cx="165" cy="319" r="4" fill="#294b4b"/><text x="287" y="368" class="label" data-recall-label="true">Carrier</text><path class="leader" d="M330 351 L330 312"/><circle cx="330" cy="312" r="4" fill="#294b4b"/><text x="453" y="392" class="label" data-recall-label="true">Golgi cisternae</text><path class="leader" d="M559 376 L565 331"/><circle cx="565" cy="331" r="4" fill="#294b4b"/><text x="688" y="393" class="label" data-recall-label="true">Secretory vesicle</text><path class="leader" d="M772 377 L750 326"/><circle cx="750" cy="326" r="4" fill="#294b4b"/><text x="424" y="178" class="label" data-recall-label="true">Cis face</text><path class="leader" d="M497 186 L457 222"/><circle cx="457" cy="222" r="4" fill="#294b4b"/><text x="598" y="178" class="label" data-recall-label="true">Trans face</text><path class="leader" d="M675 187 L646 328"/><circle cx="646" cy="328" r="4" fill="#294b4b"/><text x="848" y="408" class="label" data-recall-label="true">Plasma membrane</text><path class="leader" d="M912 395 L876 361"/><circle cx="876" cy="361" r="4" fill="#294b4b"/><path d="M35 455 H965" stroke="#d7e5e3" stroke-width="2"/><text x="35" y="494" class="note">Cargo route: rough ER → carrier vesicle → Golgi → secretory vesicle</text><text x="35" y="528" class="note">Secretory vesicles later fuse with the plasma membrane to release cargo.</text></svg>