<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 767" role="img" aria-labelledby="mitochondrion-mobile-title mitochondrion-mobile-desc"><title id="mitochondrion-mobile-title">Mitochondrion</title><desc id="mitochondrion-mobile-desc">Mitochondrion cutaway with two distinct continuous membranes. The inner membrane folds inward to form cristae, and the folds enclose intermembrane space. The matrix is inside the inner membrane. Cristae increase membrane area for aerobic ATP synthesis; Krebs cycle enzymes and substrates occur in the matrix. Not to scale; no membrane transport process arrows are shown.</desc><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b6061"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#61747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#385d61;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.membrane{stroke:#236a6c;stroke-width:4;fill:none}.flow{stroke:#3b6061;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.bacteria{fill:#db8774;stroke:#944b46;stroke-width:2}.enzyme{fill:#e4a25c;stroke:#995d2c;stroke-width:1.5}</style><rect width="560" height="767" fill="#f8fbfa"/><text x="24" y="52" class="title">Mitochondrion</text><text x="24" y="82" class="subtitle">A double-membrane organelle</text><ellipse cx="278" cy="335" rx="240" ry="140" fill="#dbeef4" stroke="#326989" stroke-width="4"/><path d="M72 334 Q72 228 145 226 H169 V287 Q169 308 186 308 Q203 308 203 287 V226 H241 V287 Q241 308 258 308 Q275 308 275 287 V226 H313 V287 Q313 308 330 308 Q347 308 347 287 V226 H390 Q480 232 484 335 Q481 452 386 452 H160 Q72 445 72 334 Z" fill="#fff3e3" stroke="#ae7252" stroke-width="4"/><path class="leader" d="M182 157 L115 225"/><circle cx="115" cy="225" r="4" fill="#294b4b"/><path class="leader" d="M370 199 L430 240"/><circle cx="430" cy="240" r="4" fill="#294b4b"/><path class="leader" d="M180 520 L76 399"/><circle cx="76" cy="399" r="4" fill="#294b4b"/><path class="leader" d="M327 507 L315 382"/><circle cx="315" cy="382" r="4" fill="#294b4b"/><path class="leader" d="M246 582 L255 308"/><circle cx="255" cy="308" r="4" fill="#294b4b"/><text x="25" y="655" class="note">Cristae increase the area of</text><text x="25" y="679" class="note">the inner respiratory membrane.</text><text x="25" y="713" class="note">Krebs cycle reactions occur</text><text x="25" y="737" class="note">in the matrix.</text></svg>