<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.8: Process and sort after translation</title><desc id="desc">Secretory cargo enters rough ER, travels in membrane carriers toward the cis region of the Golgi, undergoes processing and sorting across Golgi compartments, and leaves from the trans region in secretory vesicles. A later fusion with plasma membrane releases lumenal cargo. The drawing is a functional route: cisternae and carriers are dynamic, and the image does not prescribe one microscopic mechanism of intra-Golgi transport or exclude recycling traffic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Process and sort after translation</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><rect x="40" y="190" width="170" height="160" rx="14" fill="#e6f1f8" stroke="#246da2" stroke-width="3"/><circle cx="90" cy="186" r="13" fill="#eaa862" stroke="#173d40" stroke-width="2"/><circle cx="145" cy="186" r="13" fill="#eaa862" stroke="#173d40" stroke-width="2"/><circle cx="268" cy="270" r="24" fill="#e6f1f8" stroke="#173d40" stroke-width="2"/><path d="M220 270 L235 270" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M300 270 L345 270" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="185" width="26" height="170" rx="12" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><rect x="410" y="185" width="26" height="170" rx="12" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><rect x="455" y="185" width="26" height="170" rx="12" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><rect x="500" y="185" width="26" height="170" rx="12" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><text x="345" y="405" font-size="18" fill="#173d40">cis → processing → trans</text><path d="M555 270 L591 270" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="631" cy="270" r="30" fill="#e2f0ed" stroke="#173d40" stroke-width="2"/><path d="M578 368 L631 305" stroke="#173d40" stroke-width="2" fill="none"/><text x="60" y="470" font-size="22" fill="#173d40">Functional cargo route: ER → Golgi → secretory vesicles</text><text x="60" y="510" font-size="20" fill="#173d40">Then membrane fusion releases lumenal cargo outside the cell.</text></g></svg>