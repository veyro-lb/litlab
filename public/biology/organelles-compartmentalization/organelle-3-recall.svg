<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.3: Contain the particle and control its chemistry</title><desc id="desc">An engulfed bacterium is enclosed in a membrane-bounded phagocytic vacuole. A lysosome supplies digestive enzymes by fusion. The resulting phagolysosome has acidic conditions favourable to acid hydrolases, while the cytosol remains outside its membrane. Circles represent compartments at successive times, not three stages inside one continuous organelle. pH is an approximate typical value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">Contain the particle and control its chemistry</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><text x="40" y="140" font-size="23" fill="#173d40">1  Engulf</text><text x="310" y="140" font-size="23" fill="#173d40">2  Fuse</text><text x="568" y="140" font-size="23" fill="#173d40">3  Digest</text><circle cx="135" cy="275" r="87" fill="#e2f0ed" stroke="#173d40" stroke-width="2"/><circle cx="395" cy="275" r="87" fill="#e2f0ed" stroke="#173d40" stroke-width="2"/><circle cx="655" cy="275" r="87" fill="#e2f0ed" stroke="#173d40" stroke-width="2"/><rect x="104" y="262" width="63" height="25" rx="10" fill="#ce7570" stroke="#b14e26" stroke-width="3"/><path d="M58 418 L100 359" stroke="#173d40" stroke-width="2" fill="none"/><text x="65" y="450" font-size="18" fill="#173d40">Bacterium enclosed</text><circle cx="343" cy="182" r="27" fill="#f8d1a6" stroke="#173d40" stroke-width="2"/><text x="315" y="189" font-size="12" fill="#173d40">enzymes</text><path d="M350 213 L374 242" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="364" y="262" width="63" height="25" rx="10" fill="#ce7570" stroke="#b14e26" stroke-width="3"/><path d="M308 418 L365 344" stroke="#173d40" stroke-width="2" fill="none"/><text x="622" y="264" font-size="19" fill="#173d40">pH ≈ 5</text><circle cx="628" cy="295" r="5" fill="#ce7570" stroke="#173d40" stroke-width="2"/><circle cx="654" cy="307" r="5" fill="#ce7570" stroke="#173d40" stroke-width="2"/><circle cx="676" cy="286" r="5" fill="#ce7570" stroke="#173d40" stroke-width="2"/><circle cx="640" cy="316" r="5" fill="#ce7570" stroke="#173d40" stroke-width="2"/><path d="M566 418 L645 364" stroke="#173d40" stroke-width="2" fill="none"/><text x="560" y="450" font-size="19" fill="#173d40">Acidic digestion</text><path d="M231 276 L292 276" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M489 276 L549 276" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="45" y="510" font-size="21" fill="#173d40">All three spaces are separated from surrounding cytosol.</text></g></svg>