<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">B2.2.1: From a cell to evidence of function</title><desc id="desc">Cells are disrupted to obtain a homogenate retaining many intact organelles. Centrifugation produces a pellet and a supernatant. Testing several markers in separated fractions supports inference of organelle function, with contamination limiting certainty. This protocol is schematic, not an image of a real experiment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#173d40"/></marker></defs><rect width="800" height="560" rx="18" fill="#f7faf6"/><g font-family="Arial, sans-serif"><text x="30" y="45" font-size="28" fill="#173d40">From a cell to evidence of function</text><text x="30" y="75" font-size="16" fill="#173d40">Original conceptual schematic · not to scale</text><rect x="40" y="110" width="220" height="150" rx="14" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><text x="58" y="145" font-size="23" fill="#173d40">Cell homogenate</text><text x="58" y="185" font-size="20" fill="#173d40">Disrupted cells;</text><text x="58" y="216" font-size="18" fill="#173d40">many organelles intact</text><path d="M280 185 L350 185" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="370" y="110" width="355" height="150" rx="14" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><text x="390" y="147" font-size="23" fill="#173d40">Centrifuge, then separate</text><text x="390" y="191" font-size="21" fill="#173d40" data-recall-label="true">Supernatant: still suspended</text><text x="390" y="230" font-size="21" fill="#173d40" data-recall-label="true">Pellet: sedimented material</text><path d="M550 275 L550 335" stroke="#173d40" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="80" y="350" width="645" height="125" rx="14" fill="#e2f0ed" stroke="#147d6f" stroke-width="3"/><text x="105" y="390" font-size="23" fill="#173d40">Test fractions for several marker activities</text><text x="105" y="427" font-size="20" fill="#173d40">Enrichment supports an inference; contamination limits it.</text><text x="40" y="520" font-size="20" fill="#173d40">NOS: a new separation technique made functional tests possible.</text></g></svg>