<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1015" role="img" aria-labelledby="golgi-mobile-title golgi-mobile-desc"><title id="golgi-mobile-title">Golgi apparatus and secretion</title><desc id="golgi-mobile-desc">Schematic protein secretion route, not to scale. Ribosomes on rough endoplasmic reticulum make cargo proteins that move in membrane-bound carriers to the cis face of the Golgi stack. Golgi cisternae are flattened, curved membrane sacs that modify and sort the cargo. Secretory vesicles leave the trans face for later fusion at the plasma membrane and protein release. Intra-Golgi traffic and its recycling pathways are deliberately not specified.</desc><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#345e60"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203d40}.title{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#60747a}.step{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px;fill:#436264}.note{font-size:18px;fill:#314e51}.leader{stroke:#375c61;stroke-width:2;fill:none;stroke-linecap:round}.arrow{stroke:#345e60;stroke-width:3;fill:none;marker-end:url(#end)}.cisterna{fill:#e2f0ed;stroke:#247a6b;stroke-width:3}</style><rect width="560" height="1015" fill="#f8fbfa"/><text x="24" y="52" class="title">Golgi processing and secretion</text><text x="24" y="83" class="subtitle">Follow a membrane-bound protein.</text><rect x="26" y="117" width="508" height="244" rx="15" fill="#fff" stroke="#d6e5e1" stroke-width="2"/><text x="42" y="154" class="step">1   Rough ER makes secretory proteins</text><path d="M70 220 Q170 205 281 220 M70 250 Q170 235 281 250 M70 280 Q170 265 281 280" fill="none" stroke="#36749d" stroke-width="9" stroke-linecap="round"/><circle cx="90" cy="209" r="5" fill="#c68d53"/><circle cx="113" cy="209" r="5" fill="#c68d53"/><circle cx="136" cy="209" r="5" fill="#c68d53"/><circle cx="159" cy="236" r="5" fill="#c68d53"/><circle cx="182" cy="236" r="5" fill="#c68d53"/><circle cx="205" cy="236" r="5" fill="#c68d53"/><circle cx="228" cy="263" r="5" fill="#c68d53"/><circle cx="251" cy="263" r="5" fill="#c68d53"/><circle cx="394" cy="254" r="27" fill="#f5e7c9" stroke="#a46e43" stroke-width="3"/><path class="arrow" d="M298 254 L355 254"/><text x="340" y="314" class="label" data-recall-label="true">Transport vesicle</text><path class="arrow" d="M279 367 L279 414"/><rect x="26" y="422" width="508" height="323" rx="15" fill="#fff" stroke="#d6e5e1" stroke-width="2"/><text x="42" y="459" class="step">2   Golgi processes and sorts</text><path class="cisterna" d="M184 514 Q289 500 394 514 Q408 528 394 536 Q289 519 184 536 Q170 525 184 514 Z"/><path class="cisterna" d="M187 557 Q289 543 391 557 Q405 571 391 579 Q289 562 187 579 Q173 568 187 557 Z"/><path class="cisterna" d="M190 600 Q289 586 388 600 Q402 614 388 622 Q289 605 190 622 Q176 611 190 600 Z"/><path class="cisterna" d="M193 643 Q289 629 385 643 Q399 657 385 665 Q289 648 193 665 Q179 654 193 643 Z"/><text x="45" y="503" class="label" data-recall-label="true">Cis face</text><path class="leader" d="M128 501 L184 521"/><circle cx="184" cy="521" r="4" fill="#294b4b"/><text x="405" y="701" class="label" data-recall-label="true">Trans face</text><path class="leader" d="M400 686 L380 659"/><circle cx="380" cy="659" r="4" fill="#294b4b"/><path class="arrow" d="M279 754 L279 810"/><text x="45" y="788" class="step">3   Secretory vesicle</text><circle cx="278" cy="855" r="42" fill="#f5e7c9" stroke="#a46e43" stroke-width="3"/><path class="arrow" d="M324 854 L395 854"/><path d="M426 809 V898 M445 809 V898" stroke="#316e86" stroke-width="5"/><text x="35" y="958" class="small">Later fusion with the plasma membrane</text><text x="35" y="982" class="small">releases cargo outside the cell.</text></svg>