<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" role="img" aria-labelledby="t d">
<title id="t">Mobile sliding-filament sarcomere diagram</title><desc id="d">Comparison of relaxed and contracted sarcomeres: Z discs move closer, actin and myosin lengths remain unchanged while their overlap increases. I band and H zone narrow while A band length remains constant. Model not to scale.</desc>
<rect width="560" height="720" rx="18" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#233d4c">
<text x="20" y="40" font-size="30" font-weight="700">Actin slides past myosin</text>
<text x="22" y="70" font-size="22">Filaments never shorten</text>
<text x="25" y="140" font-size="26" font-weight="700">Relaxed</text>
<text x="25" y="416" font-size="26" font-weight="700">Contracted</text>
<g stroke="#526b80" stroke-width="8"><path d="M80 170V285 M480 170V285 M150 448V562 M410 448V562"/></g>
<g stroke="#278c71" stroke-width="7" stroke-linecap="round"><path d="M80 201H225 M80 252H225 M480 201H335 M480 252H335 M150 478H295 M150 535H295 M410 478H265 M410 535H265"/></g>
<g stroke="#c16d42" stroke-width="16" stroke-linecap="round"><path d="M210 227H350 M210 506H350"/></g>
<g stroke="#846353" stroke-width="3" stroke-dasharray="6 5"><path d="M280 163V292 M280 440V571"/></g>
<text x="22" y="325" font-size="21">Z discs further apart</text>
<text x="22" y="602" font-size="21">Z discs closer; overlap increases</text>
<text x="22" y="644" font-size="20">Green: thin actin · orange: thick myosin</text>
<text x="22" y="678" font-size="19">I band, H zone ↓ · A band unchanged</text>
<text x="22" y="705" font-size="16">Explanatory schematic; not to scale.</text>
</g></svg>