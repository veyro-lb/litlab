<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Sliding filament sarcomeres</title><desc id="d">Green thin actin filaments extend from Z discs toward the central orange thick myosin. Contraction brings Z discs closer without shortening either filament type.</desc><rect width="900" height="440" rx="17" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#203d4c"><text x="25" y="36" font-size="25">Relaxed versus contracted sarcomeres</text><text x="27" y="105" font-size="19">Relaxed</text><text x="27" y="275" font-size="19">Contracted</text><g stroke="#44637a" stroke-width="7"><path d="M113 132 V223 M789 132 V223 M232 293 V390 M670 293 V390"/></g><g stroke="#439b74" stroke-width="6"><path d="M113 153 H390 M113 203 H390 M789 153 H510 M789 203 H510 M232 313 H411 M232 370 H411 M670 313 H489 M670 370 H489"/></g><g stroke="#c07a65" stroke-width="13"><path d="M342 181 H555 M342 340 H555"/></g><g stroke="#ac5e47" stroke-width="3"><path d="M450 130 V226 M450 290 V393"/></g><text x="45" y="414" font-size="16">Green: actin. Orange: myosin. Z-disc distance decreases; thick-filament length is unchanged.</text></g></svg>