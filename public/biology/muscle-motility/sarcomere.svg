<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
<title id="title">Sarcomere filament sliding: relaxed versus contracted</title>
<desc id="description">Green actin filaments have equal lengths in both states and project inward from Z discs. Orange myosin thick filaments also retain equal lengths. The relaxed Z discs are further apart. In contraction, Z discs approach, actin overlaps myosin more, the I band and H zone narrow, and the A band remains constant. Schematic, not to scale.</desc>
<rect width="960" height="470" rx="20" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1e3a4a">
<text x="28" y="42" font-size="27" font-weight="700">Sliding filament model — lengths stay constant</text>
<text x="31" y="110" font-size="22" font-weight="700">Relaxed</text>
<text x="31" y="299" font-size="22" font-weight="700">Contracted</text>
<g stroke="#516a84" stroke-width="8" stroke-linecap="round">
<path d="M140 147V236 M760 147V236 M240 321V409 M660 321V409"/>
</g>
<g stroke="#268b70" stroke-width="7" stroke-linecap="round">
<path d="M140 165H350 M140 217H350 M760 165H550 M760 217H550 M240 338H450 M240 391H450 M660 338H450 M660 391H450"/>
</g>
<g stroke="#c16d42" stroke-width="17" stroke-linecap="round"><path d="M345 192H555 M345 365H555"/></g>
<g stroke="#885b42" stroke-width="3" stroke-dasharray="6 5"><path d="M450 143V241 M450 317V414"/></g>
<g font-size="17">
<text x="119" y="138">Z</text><text x="754" y="138">Z</text><text x="232" y="311">Z</text><text x="653" y="311">Z</text>
<text x="468" y="140">M line</text>
<text x="767" y="197">Actin unchanged</text>
<text x="673" y="365">Actin unchanged</text>
</g>
<path d="M197 271H335 M703 271H565" stroke="#1f789b" stroke-width="4" fill="none"/><path d="M335 271l-13-7v14z M565 271l13-7v14z" fill="#1f789b"/>
<text x="362" y="278" font-size="18">Z discs move inward</text>
<g font-size="17"><text x="28" y="443">Green = actin · orange = myosin · dashed = M line. Both filament types retain their lengths.</text></g>
</g></svg>