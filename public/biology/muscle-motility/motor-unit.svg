<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">A skeletal muscle motor unit</title><desc id="d">One motor neuron has an axon branching toward junctions on three muscle fibres, illustrating motor-unit recruitment.</desc><rect width="900" height="440" rx="17" fill="#f9fbfc"/><g font-family="Arial,sans-serif" fill="#203d4c"><text x="30" y="40" font-size="25">One motor neuron → several muscle fibres</text><circle cx="136" cy="215" r="52" fill="#cadfeb" stroke="#4383a9" stroke-width="5"/><circle cx="136" cy="215" r="16" fill="#759fb9"/><path d="M190 215 H401 M401 215 V110 H538 M401 215 H538 M401 215 V318 H538" fill="none" stroke="#4383a9" stroke-width="7"/><g fill="#e9b7ab" stroke="#b97d76" stroke-width="3"><rect x="550" y="77" width="294" height="64" rx="22"/><rect x="550" y="184" width="294" height="64" rx="22"/><rect x="550" y="287" width="294" height="64" rx="22"/></g><g fill="#286f91"><circle cx="550" cy="110" r="12"/><circle cx="550" cy="215" r="12"/><circle cx="550" cy="319" r="12"/></g><text x="635" y="118" font-size="18">Fibre A</text><text x="635" y="225" font-size="18">Fibre B</text><text x="635" y="327" font-size="18">Fibre C</text><text x="57" y="293" font-size="17">Motor neuron</text><text x="276" y="410" font-size="16">Axon branches terminate at neuromuscular junctions</text></g></svg>