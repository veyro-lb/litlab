<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 742" role="img" aria-labelledby="title desc"><title id="title">Calvin cycle: fixation to regeneration</title><desc id="desc">Three CO2 add to three RuBP to give six GP, reduced using six ATP and six NADPH to six TP. One TP leaves; five TP plus three ATP regenerate three RuBP. Original accounting model; no direct formation of glucose from a single turn.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="742" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Calvin cycle: fixation to regeneration</text><text x="28" y="76" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Chloroplast stroma · accounting for 3 CO₂</text><rect x="173" y="109" width="253" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="299.5" y="140" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">3 RuBP</text><text x="299.5" y="169" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">3 × 5C = 15C</text><text x="30" y="214" font-size="23" fill="#b84c6f" text-anchor="start" font-weight="400">+ 3 CO₂</text><path d="M300 190V244" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="329" y="222" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Rubisco</text><rect x="173" y="252" width="253" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="299.5" y="283" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">6 GP</text><text x="299.5" y="312" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">6 × 3C = 18C</text><path d="M300 334V394" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="330" y="358" font-size="21" fill="#a87013" text-anchor="start" font-weight="400">6 ATP</text><text x="330" y="384" font-size="21" fill="#316aaf" text-anchor="start" font-weight="400">6 NADPH</text><rect x="173" y="402" width="253" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="299.5" y="433" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">6 TP</text><text x="299.5" y="462" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">6 × 3C = 18C</text><path d="M432 440H537V532" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="435" y="567" font-size="22" fill="#163d48" text-anchor="start" font-weight="600">1 TP exits</text><text x="435" y="596" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3C net gain</text><path d="M300 484V546" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="173" y="554" width="253" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="299.5" y="585" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">5 TP</text><text x="299.5" y="614" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">5 × 3C = 15C</text><path d="M168 593H112V147H166" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="31" y="383" font-size="22" fill="#a87013" text-anchor="start" font-weight="400">3 ATP</text><text x="31" y="415" font-size="18" fill="#163d48" text-anchor="start" font-weight="400">for RuBP</text><text x="31" y="442" font-size="18" fill="#163d48" text-anchor="start" font-weight="400">regeneration</text><text x="30" y="679" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">GP = glycerate 3-phosphate; TP = triose</text><text x="30" y="706" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">phosphate. Net 1 TP uses 9 ATP and 6 NADPH.</text></g></svg>