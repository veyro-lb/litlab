<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-label="Schematic scientific process, not experimental measurements"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#17718b"/></marker></defs><rect width="880" height="390" rx="18" fill="#fcfdf9"/><text x="30" y="37" font-family="Arial, sans-serif" font-size="23" fill="#16434a">Calvin cycle: carbon fixation, reduction and regeneration</text><rect x="38" y="112" width="240" height="67" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="50" y="147" font-family="Arial, sans-serif" font-size="18" fill="#16434a">3 CO₂ + 3 RuBP (5C)</text><path d="M285 145 L359 145" stroke="#17718b" stroke-width="3.5" fill="none" marker-end="url(#arr)"/><rect x="365" y="112" width="235" height="67" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="377" y="147" font-family="Arial, sans-serif" font-size="18" fill="#16434a">6 GP (3C)</text><path d="M487 181 L487 230" stroke="#17718b" stroke-width="3.5" fill="none" marker-end="url(#arr)"/><rect x="360" y="235" width="242" height="67" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="372" y="270" font-family="Arial, sans-serif" font-size="18" fill="#16434a">6 TP (3C)</text><path d="M361 267 L222 265" stroke="#17718b" stroke-width="3.5" fill="none" marker-end="url(#arr)"/><rect x="32" y="238" width="245" height="68" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="44" y="273" font-family="Arial, sans-serif" font-size="18" fill="#16434a">5 TP → 3 RuBP</text><text x="620" y="262" font-family="Arial, sans-serif" font-size="18" fill="#16434a">1 TP exits → sugar</text><text x="52" y="347" font-family="Arial, sans-serif" font-size="18" fill="#16434a">Rubisco fixes CO₂; ATP + NADPH reduce GP; ATP regenerates RuBP.</text></svg>
