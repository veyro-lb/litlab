<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" role="img" aria-labelledby="title desc"><title id="title">Light reactions: two linked pathways</title><desc id="desc">Linear electron transport model. Water is split at PSII on the lumen side; electrons pass through carriers to PSI then support reduction of NADP on the stroma side. Proton pumping into lumen and proton return via ATP synthase are distinct from electron flow. Bottom inset separates ATP synthase orientation; not a second membrane.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="730" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Light reactions: two linked pathways</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">STROMA · ATP and NADPH made on this side</text><text x="48" y="118" font-size="21" fill="#a87013" text-anchor="start" font-weight="400">Light</text><path d="M91 128L126 177" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="310" y="118" font-size="21" fill="#a87013" text-anchor="start" font-weight="400">Light</text><path d="M350 128L383 177" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><rect x="28" y="188" width="544" height="91" rx="12" fill="#c9ddd6" stroke="#86ada8" stroke-width="2"/><rect x="65" y="194" width="98" height="77" rx="12" fill="#e0efed" stroke="#86ada8" stroke-width="2"/><text x="114.0" y="239" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">PSII</text><rect x="219" y="194" width="114" height="77" rx="12" fill="#e0efed" stroke="#86ada8" stroke-width="2"/><text x="276.0" y="239" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">Chain</text><rect x="365" y="194" width="98" height="77" rx="12" fill="#e0efed" stroke="#86ada8" stroke-width="2"/><text x="414.0" y="239" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">PSI</text><path d="M167 230H215" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M337 230H361" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M468 231H538V153" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="540" y="141" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">e⁻</text><text x="358" y="96" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">NADP⁺ → NADPH</text><path d="M277 152V336" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="304" y="318" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">H⁺ pumped in</text><text x="28" y="382" font-size="22" fill="#163d48" text-anchor="start" font-weight="600">LUMEN · H⁺ accumulates here</text><text x="35" y="317" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">2 H₂O</text><path d="M92 301V276" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="35" y="350" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">O₂ + 4 H⁺ + 4 e⁻</text><text x="35" y="410" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Water splitting replaces electrons lost by PSII.</text><rect x="28" y="443" width="544" height="74" rx="12" fill="#c9ddd6" stroke="#86ada8" stroke-width="2"/><rect x="191" y="423" width="211" height="111" rx="12" fill="#f0d5b4" stroke="#86ada8" stroke-width="2"/><text x="296" y="472" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">ATP synthase</text><text x="296" y="502" font-size="21" fill="#a87013" text-anchor="middle" font-weight="400">H⁺ flows out</text><text x="28" y="558" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Lumen</text><path d="M440 561V403" fill="none" stroke="#a87013" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="458" y="413" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Stroma</text><text x="458" y="448" font-size="22" fill="#a87013" text-anchor="start" font-weight="400">H⁺</text><text x="30" y="610" font-size="23" fill="#a87013" text-anchor="start" font-weight="400">ADP + Pi → ATP on the stroma side</text><text x="30" y="654" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Chain carriers transfer electrons from PSII</text><text x="30" y="682" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">to PSI. Light excites electrons at both</text><text x="30" y="710" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">photosystems.</text></g></svg>