, sans-serif" font-size="18" fill="#16434a">NADP⁺ → NADPH</text><text x="647" y="116" font-family="Arial, sans-serif" font-size="16" fill="#16434a">H⁺ → stroma</text><text x="32" y="385" font-family="Arial, sans-serif" font-size="16" fill="#16434a">Actual H⁺ accumulation is in lumen; ATP synthase returns H⁺ to stroma.</text></svg>
