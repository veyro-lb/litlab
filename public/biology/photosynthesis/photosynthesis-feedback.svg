<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-label="Schematic scientific process, not experimental measurements"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#17718b"/></marker></defs><rect width="880" height="390" rx="18" fill="#fcfdf9"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="25" fill="#16434a">Coupling across chloroplast compartments</text><rect x="44" y="116" width="330" height="88" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="56" y="151" font-family="Arial, sans-serif" font-size="18" fill="#16434a">Light reactions: thylakoids</text><rect x="505" y="116" width="322" height="88" rx="13" fill="#e5f5ef" stroke="#67aaa5" stroke-width="2"/><text x="517" y="151" font-family="Arial, sans-serif" font-size="18" fill="#16434a">Calvin cycle: stroma</text><path d="M372 140 L497 140" stroke="#17718b" stroke-width="3.5" fill="none" marker-end="url(#arr)"/><text x="396" y="124" font-family="Arial, sans-serif" font-size="14" fill="#16434a">ATP + NADPH</text><path d="M499 188 L375 188" stroke="#17718b" stroke-width="3.5" fill="none" marker-end="url(#arr)"/><text x="385" y="215" font-family="Arial, sans-serif" font-size="15" fill="#16434a">ADP + Pi + NADP⁺</text><text x="45" y="299" font-family="Arial, sans-serif" font-size="18" fill="#16434a">No light → ATP/NADPH supply falls</text><text x="45" y="332" font-family="Arial, sans-serif" font-size="18" fill="#16434a">No CO₂ → Calvin use and recycling stop; photochemistry backs up</text></svg>
