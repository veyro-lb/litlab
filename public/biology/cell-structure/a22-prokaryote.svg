<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">Prokaryotic cell: connected structures</title><desc id="desc">Generalized bacterial model with peptidoglycan cell wall outside plasma membrane, cytoplasm with 70S ribosomes, DNA nucleoid not enclosed by a membrane, optional plasmid and flagellum. Not a universal set of bacterial surface structures; no Gram-negative outer membrane shown.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="760" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Prokaryotic cell: connected structures</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Generalized bacterium · structures vary by species</text><rect x="75" y="205" width="450" height="259" rx="120" fill="#e4ead3" stroke="#4c8759" stroke-width="2"/><rect x="90" y="222" width="420" height="225" rx="105" fill="#eef5ed" stroke="#147d83" stroke-width="2"/><path d="M525 327Q573 279 567 391Q566 447 585 466" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 321C178 256 297 270 326 312S437 347 404 397S289 394 260 361S164 373 195 321Z" fill="none" stroke="#b84c6f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="144" cy="313" r="4" fill="#316aaf"/><circle cx="170" cy="391" r="4" fill="#316aaf"/><circle cx="230" cy="254" r="4" fill="#316aaf"/><circle cx="286" cy="409" r="4" fill="#316aaf"/><circle cx="377" cy="256" r="4" fill="#316aaf"/><circle cx="463" cy="356" r="4" fill="#316aaf"/><circle cx="423" cy="416" r="4" fill="#316aaf"/><circle cx="335" cy="246" r="4" fill="#316aaf"/><circle cx="126" cy="353" r="4" fill="#316aaf"/><ellipse cx="388" cy="304" rx="24" ry="13" fill="none" stroke="#a87013" stroke-width="3"/><path d="M144 313L45 150" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="136" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">70S ribosomes</text><path d="M81 271L43 192" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="180" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Cell wall</text><path d="M100 405L49 508" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="538" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Plasma membrane</text><path d="M273 342L280 500" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="223" y="538" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Nucleoid: DNA</text><path d="M388 293L431 156" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="411" y="137" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Plasmid</text><path d="M566 417L500 562" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="411" y="592" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Flagellum</text><text x="420" y="487" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Cytoplasm</text><path d="M437 467L440 425" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="649" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">No membrane-enclosed nucleus or other</text><text x="30" y="677" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">membrane-bound organelles. Plasmids and</text><text x="30" y="705" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">flagella are not universal.</text></g></svg>