<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 753" role="img" aria-labelledby="title desc"><title id="title">Eukaryotic animal cell</title><desc id="desc">Independent animal-cell section with plasma membrane enclosing cytoplasm, nucleus with nucleolus and nuclear envelope, rough ER with cytosolic ribosomes, Golgi stack, mitochondria with internal folds, lysosome and free ribosomes. No cell wall or chloroplast. Simplified subset; organelles not to scale.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="753" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Eukaryotic animal cell</text><text x="28" y="77" font-size="19" fill="#163d48" text-anchor="start" font-weight="400">Animal cell section · not a photograph or a fixed layout</text><ellipse cx="300" cy="340" rx="244" ry="211" fill="#eef6f3" stroke="#147d83" stroke-width="4"/><ellipse cx="257" cy="326" rx="76" ry="65" fill="#e4dcef" stroke="#8566a5" stroke-width="6"/><circle cx="249" cy="330" r="21" fill="#8566a5"/><path d="M330 223Q390 202 449 232" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="219" r="3" fill="#316aaf"/><circle cx="370" cy="219" r="3" fill="#316aaf"/><circle cx="396" cy="219" r="3" fill="#316aaf"/><circle cx="421" cy="219" r="3" fill="#316aaf"/><path d="M330 244Q390 223 449 253" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="240" r="3" fill="#316aaf"/><circle cx="370" cy="240" r="3" fill="#316aaf"/><circle cx="396" cy="240" r="3" fill="#316aaf"/><circle cx="421" cy="240" r="3" fill="#316aaf"/><path d="M330 265Q390 244 449 274" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="261" r="3" fill="#316aaf"/><circle cx="370" cy="261" r="3" fill="#316aaf"/><circle cx="396" cy="261" r="3" fill="#316aaf"/><circle cx="421" cy="261" r="3" fill="#316aaf"/><path d="M349 390Q390 402 432 387" fill="none" stroke="#a87013" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M349 412Q390 424 432 409" fill="none" stroke="#a87013" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M349 434Q390 446 432 431" fill="none" stroke="#a87013" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="132" cy="304" rx="40" ry="24" fill="#f5e4cc" stroke="#a87013" stroke-width="2"/><path d="M110 304q10 -17 20 0t20 0" fill="none" stroke="#a87013" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="183" cy="461" rx="40" ry="24" fill="#f5e4cc" stroke="#a87013" stroke-width="2"/><path d="M161 461q10 -17 20 0t20 0" fill="none" stroke="#a87013" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="127" cy="373" r="4" fill="#316aaf"/><circle cx="361" cy="480" r="4" fill="#316aaf"/><circle cx="419" cy="343" r="4" fill="#316aaf"/><circle cx="190" cy="218" r="4" fill="#316aaf"/><circle cx="300" cy="467" r="4" fill="#316aaf"/><circle cx="453" cy="370" r="16" fill="#b84c6f"/><path d="M65 291L41 161" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="136" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Plasma membrane</text><path d="M233 302L105 213" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="193" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Nucleus</text><path d="M358 235L432 149" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="128" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Rough ER</text><path d="M405 412L520 465" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="385" y="504" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Golgi apparatus</text><path d="M180 460L115 551" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="583" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Mitochondrion</text><path d="M300 467L298 552" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="583" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Free ribosomes</text><path d="M453 370L550 358" fill="none" stroke="#147d83" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="335" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Lysosome</text><text x="30" y="647" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Ribosomes on the rough ER face the cytosol.</text><text x="30" y="675" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">No cell wall or chloroplasts. Organelle</text><text x="30" y="703" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">sizes are simplified.</text></g></svg>