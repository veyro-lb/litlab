<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 530" role="img" aria-labelledby="ttl d"><title id="ttl">Hypothetical potato mass change against sucrose concentration</title><desc id="d">An original illustrative model line graph of potato-cylinder percentage mass change: positive four percent at 0.20 mol per cubic decimeter, positive one percent at 0.30 and negative two percent at 0.40. Linear interpolation gives an estimated zero crossing at 0.333 mol per cubic decimeter. This is not empirical experimental data.</desc><rect width="930" height="530" fill="#f8fbff"/><text x="48" y="51" font-size="24" font-family="sans-serif" fill="#154260" font-weight="700">Potato osmosis: model data, not measured results</text><g stroke="#536d87" stroke-width="3"><line x1="140" y1="100" x2="140" y2="420"/><line x1="140" y1="420" x2="830" y2="420"/></g><g stroke="#d0dce6" stroke-width="1.5"><line x1="140" y1="130" x2="830" y2="130"/><line x1="140" y1="240" x2="830" y2="240"/><line x1="140" y1="310" x2="830" y2="310"/><line x1="140" y1="390" x2="830" y2="390"/></g><line x1="140" y1="310" x2="830" y2="310" stroke="#a7765e" stroke-width="3" stroke-dasharray="8 7"/><g font-size="19" font-family="sans-serif" fill="#344a61"><text x="92" y="140">+4</text><text x="92" y="250">+1</text><text x="103" y="316">0</text><text x="94" y="397">−2</text><text x="231" y="454">0.20</text><text x="479" y="454">0.30</text><text x="726" y="454">0.40</text><text x="225" y="496">External sucrose concentration (mol dm⁻³)</text><text x="20" y="95">Mass change (%)</text></g><polyline points="250,130 500,240 750,390" fill="none" stroke="#2f829a" stroke-width="5"/><g fill="#2f829a" stroke="white" stroke-width="3"><circle cx="250" cy="130" r="9"/><circle cx="500" cy="240" r="9"/><circle cx="750" cy="390" r="9"/></g><text x="600" y="289" font-size="17" font-family="sans-serif" fill="#8c563d">Zero crossing ~0.333 M</text></svg>