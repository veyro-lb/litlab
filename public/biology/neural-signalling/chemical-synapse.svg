<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="Presynaptic membrane at top, synaptic cleft centrally, postsynaptic membrane below. Calcium enters presynaptic terminal, vesicles release transmitter, which binds to postsynaptic receptors."><rect width="900" height="350" fill="#fff"/><text x="30" y="35" font-size="23" font-family="Arial">Chemical synapse: information flows presynaptic → postsynaptic</text><rect x="25" y="57" width="850" height="120" rx="12" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/><text x="45" y="81" font-family="Arial" font-size="19">Presynaptic terminal (cytosol)</text><g stroke="#1d4ed8" fill="#bfdbfe"><circle cx="290" cy="121" r="25"/><circle cx="365" cy="121" r="25"/></g><text x="250" y="162" font-size="16" font-family="Arial">Vesicles</text><text x="560" y="107" font-size="17" font-family="Arial">Ca²⁺ influx ↓</text><path d="M630 119 v48" stroke="#0369a1" stroke-width="4"/><path d="M622 159 l8 12 8 -12" fill="#0369a1"/><rect x="25" y="177" width="850" height="73" fill="#fef3c7" stroke="#a16207"/><text x="45" y="204" font-size="18" font-family="Arial">Synaptic cleft — released neurotransmitter diffuses ↓</text><path d="M348 174 v65" stroke="#b45309" stroke-width="3" stroke-dasharray="7 7"/><path d="M340 230 l8 11 8 -11" fill="#b45309"/><rect x="25" y="251" width="850" height="75" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="45" y="282" font-family="Arial" font-size="19">Postsynaptic membrane — ligand-gated receptors</text><text x="45" y="307" font-family="Arial" font-size="16">Cation entry can cause an excitatory postsynaptic potential</text></svg>