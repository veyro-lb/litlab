<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 755" role="img" aria-labelledby="title desc"><title id="title">Saltatory conduction at nodes</title><desc id="desc">Axon membrane under myelin with gaps at nodes of Ranvier. Sodium influx at an active node creates local current spreading under myelin; the next node regenerates the action potential. Refractory membrane limits backward propagation. Not an electrical spark jumping through space; schematic.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="755" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Saltatory conduction at nodes</text><text x="28" y="77" font-size="19" fill="#163d48" text-anchor="start" font-weight="400">Myelin insulates internodes; nodes regenerate impulses</text><text x="50" y="143" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Axon interior</text><path d="M30 223H570" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 312H570" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="188" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="35" y="314" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="216" y="188" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="216" y="314" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="397" y="188" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="397" y="314" width="132" height="34" rx="12" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><text x="55" y="377" font-size="21" fill="#a87013" text-anchor="start" font-weight="400">Myelin</text><text x="185" y="176" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">Node</text><text x="365" y="176" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">Node</text><path d="M184 188V257" fill="none" stroke="#b84c6f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b84c6f)"/><text x="184" y="123" font-size="20" fill="#b84c6f" text-anchor="middle" font-weight="400">Na⁺ in</text><path d="M196 273H353" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="277" y="301" font-size="19" fill="#147d83" text-anchor="middle" font-weight="400">Local current</text><path d="M367 190V256" fill="none" stroke="#b84c6f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b84c6f)"/><path d="M185 405Q276 365 365 405" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="279" y="447" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">Direction of propagation</text><text x="30" y="500" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">1. Na⁺ entry depolarizes an active node.</text><text x="30" y="528" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Local current spreads inside the axon</text><text x="30" y="556" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">beneath the myelin.</text><text x="30" y="599" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">2. The next node reaches threshold and</text><text x="30" y="627" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">regenerates an action potential.</text><text x="30" y="655" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Refractoriness limits backward re-</text><text x="30" y="683" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">excitation.</text><text x="30" y="724" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">The action potential does not physically leap a gap.</text></g></svg>