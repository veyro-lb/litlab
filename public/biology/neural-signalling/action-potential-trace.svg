<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Schematic membrane potential against time, voltage from minus 90 to plus 40 millivolts and time from zero to six milliseconds."><rect width="900" height="470" fill="#fff"/><text x="72" y="38" font-size="25" fill="#0f172a" font-family="Arial">Action potential — schematic, not measured data</text><path d="M100 65 V390 H835" fill="none" stroke="#1e293b" stroke-width="3"/><text x="35" y="235" font-size="17" font-family="Arial" fill="#0f172a" transform="rotate(-90 35 235)">Membrane potential (mV)</text><text x="400" y="443" font-size="18" font-family="Arial" fill="#0f172a">Time (ms)</text><path d="M95 82 h8" stroke="#334155"/><text x="55" y="88" font-size="15" font-family="Arial">+40</text><path d="M95 180 h8" stroke="#334155"/><text x="55" y="186" font-size="15" font-family="Arial">0</text><path d="M95 314 h8" stroke="#334155"/><text x="55" y="320" font-size="15" font-family="Arial">−55</text><path d="M95 355 h8" stroke="#334155"/><text x="55" y="361" font-size="15" font-family="Arial">−70</text><path d="M95 390 h8" stroke="#334155"/><text x="55" y="396" font-size="15" font-family="Arial">−90</text><text x="100" y="410" font-size="15" font-family="Arial">0</text><text x="220" y="410" font-size="15" font-family="Arial">1</text><text x="340" y="410" font-size="15" font-family="Arial">2</text><text x="460" y="410" font-size="15" font-family="Arial">3</text><text x="580" y="410" font-size="15" font-family="Arial">4</text><text x="700" y="410" font-size="15" font-family="Arial">5</text><text x="820" y="410" font-size="15" font-family="Arial">6</text><path d="M100 343 L240 343 C280 343 305 339 326 307 C340 263 357 147 382 94 C390 82 408 84 420 106 C446 176 466 310 508 366 C531 391 568 380 607 358 C645 342 705 343 820 343" fill="none" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/><path d="M100 307 H834" stroke="#d97706" stroke-dasharray="8 7" stroke-width="1.6"/><text x="650" y="303" font-size="15" fill="#92400e" font-family="Arial">Threshold ≈ −55 mV</text><text x="225" y="339" font-size="14" font-family="Arial" fill="#0f172a">Rest</text><text x="336" y="154" font-size="15" font-family="Arial" fill="#075985">Na⁺ influx</text><text x="455" y="199" font-size="15" font-family="Arial" fill="#075985">K⁺ efflux</text><text x="521" y="339" font-size="14" font-family="Arial" fill="#075985">After-hyperpolarization</text><text x="100" y="460" font-size="12" font-family="Arial" fill="#475569">Representative educational waveform and approximate voltages; timing and threshold vary among neurons.</text></svg>