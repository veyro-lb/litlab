<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="353" viewBox="0 0 1000 353" role="img" aria-labelledby="title desc"><title id="title">Saltatory conduction along a myelinated axon</title><desc id="desc">Myelin-covered internodes reduce current loss. Voltage-gated sodium channels cluster at the gaps called nodes of Ranvier, where action potentials are regenerated. Depolarizing current travels through the axoplasm between nodes, allowing faster conduction than an unmyelinated fibre.</desc><rect width="1000" height="353" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="26" y="40" fill="#0f172a" font-weight="700" font-size="23">Saltatory conduction: current travels, spikes regenerate</text><text x="26" y="62" fill="#475569" font-size="14">IB C2.2.11 (HL) · schematic of a myelinated axon (not to scale)</text><rect x="35" y="166" width="925" height="44" rx="22" fill="#dae5f6" stroke="#64748b" stroke-width="2"/><g fill="#eabf77" stroke="#ba8542" stroke-width="2"><rect x="110" y="139" width="225" height="98" rx="24"/><rect x="386" y="139" width="225" height="98" rx="24"/><rect x="661" y="139" width="225" height="98" rx="24"/></g><g fill="#f8fafc" stroke="#ba8542" stroke-width="1.5"><rect x="118" y="150" width="210" height="76" rx="20"/><rect x="394" y="150" width="209" height="76" rx="20"/><rect x="669" y="150" width="209" height="76" rx="20"/></g><rect x="110" y="173" width="776" height="29" rx="13" fill="#cbdcf6"/><g stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"><path d="M94 157V178"/><path d="M94 197V218"/><path d="M359 157V178"/><path d="M359 197V218"/><path d="M635 157V178"/><path d="M635 197V218"/><path d="M909 157V178"/><path d="M909 197V218"/></g><g fill="#0f172a" font-size="13" text-anchor="middle"><text x="95" y="130">Node 1</text><text x="360" y="130">Node 2</text><text x="635" y="130">Node 3</text><text x="909" y="130">Node 4</text><text x="223" y="267">Myelinated internode</text><text x="497" y="267">Myelinated internode</text><text x="771" y="267">Myelinated internode</text></g><g stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"><path d="M130 188H319"/><path d="M405 188H594"/><path d="M681 188H870"/></g><g fill="#2563eb"><path d="M320 188l-13 -7v14z"/><path d="M595 188l-13 -7v14z"/><path d="M871 188l-13 -7v14z"/></g><text x="36" y="99" font-size="14" fill="#334155">Action potential at a node → local depolarizing current spreads rapidly through the axoplasm → next node reaches threshold</text><g font-size="13" fill="#475569"><text x="37" y="306">Voltage-gated Na⁺ channels and ion pumps are concentrated at the nodes; myelin reduces charge leakage between them.</text><text x="37" y="328">The impulse does not jump through empty space: active regeneration occurs at nodes, and current flows between them.</text></g></g></svg>