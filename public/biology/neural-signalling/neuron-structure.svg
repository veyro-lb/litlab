<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Neuron: receive, conduct, transmit</title><desc id="desc">Simplified myelinated multipolar neuron. Branched dendrites and nucleated cell body receive signals. Axon is wrapped in separated myelin segments with nodes of Ranvier and ends in branching terminals. Arrow denotes typical information flow along axon; many neuron forms differ.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="740" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Neuron: receive, conduct, transmit</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">A myelinated neuron · one simplified form</text><ellipse cx="151" cy="265" rx="62" ry="65" fill="#e7deef" stroke="#8566a5" stroke-width="3"/><circle cx="151" cy="265" r="20" fill="#8566a5"/><path d="M105 221L70 153L40 127" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 163L105 128" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 249L43 215L28 172" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M91 284L37 308L28 351" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 315L78 387L40 409" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M81 381L112 406" fill="none" stroke="#8566a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M209 265H524V468" fill="none" stroke="#147d83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="247" y="240" width="77" height="50" rx="18" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="355" y="240" width="77" height="50" rx="18" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><rect x="463" y="240" width="77" height="50" rx="18" fill="#f0d5b4" stroke="#a87013" stroke-width="2"/><path d="M524 449L479 504" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M524 468L566 509" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M524 468V525" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="479" cy="504" r="9" fill="#147d83"/><circle cx="566" cy="509" r="9" fill="#147d83"/><circle cx="524" cy="525" r="9" fill="#147d83"/><text x="30" y="113" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Dendrites</text><text x="33" y="449" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Cell body</text><path d="M113 428L130 323" fill="none" stroke="#147d83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="249" y="204" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Axon + myelin sheath</text><path d="M344 216V239" fill="none" stroke="#147d83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="275" y="347" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Node of Ranvier</text><path d="M338 325V270" fill="none" stroke="#147d83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 382H476" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="246" y="420" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">Typical signal direction</text><text x="325" y="570" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Axon terminals</text><path d="M467 550L483 514" fill="none" stroke="#147d83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="639" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Dendrites and cell body receive inputs.</text><text x="30" y="667" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Action potentials propagate along the axon;</text><text x="30" y="695" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">terminals signal to target cells.</text></g></svg>