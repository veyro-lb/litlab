rect x="535" y="226" width="270" height="78" rx="10" fill="#e2f3f1" stroke="#6aadb1" stroke-width="1.5"/><text x="547" y="256">CO₂ and CH₄ released</text><path d="M805 265H825" stroke="#147e8d" stroke-width="2.5"/><path d="M817 260 L825 265 L817 270" fill="none" stroke="#147e8d" stroke-width="2"/><rect x="835" y="226" width="220" height="78" rx="10" fill="#e2f3f1" stroke="#6aadb1" stroke-width="1.5"/><text x="847" y="256">Additional warming</text><text x="28" y="382" class="sub">Conceptual links: feedback magnifies initial forcing. Not a measured rate or inevitable tipping threshold.</text></svg>