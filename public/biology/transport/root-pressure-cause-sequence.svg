<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="371" viewBox="0 0 1000 371" role="img" aria-labelledby="title desc"><title id="title">Root pressure arises from active mineral transport and osmosis</title><desc id="desc">Four-step causal diagram: respiration-powered mineral loading into the root xylem reduces xylem water potential, water moves by osmosis into xylem, and positive hydrostatic pressure can push sap upward over limited distances when transpiration is low. Contrast with negative pressure from transpiration pull in tall plants.</desc><rect width="1000" height="371" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="26" y="40" font-size="23" font-weight="700" fill="#0f172a">Why active mineral transport generates root pressure</text><text x="26" y="64" font-size="14" fill="#475569">IB B3.2.17 (HL) · causes and direction of water movement</text><g stroke-width="1.5"><rect x="25" y="91" width="218" height="170" rx="14" fill="#eaf2ff" stroke="#bfd5f4"/><rect x="272" y="91" width="218" height="170" rx="14" fill="#ebf8f1" stroke="#b8e5cb"/><rect x="519" y="91" width="218" height="170" rx="14" fill="#fff4e5" stroke="#f3d5a2"/><rect x="766" y="91" width="208" height="170" rx="14" fill="#f0edff" stroke="#d4c8f8"/></g><g fill="#0f172a" font-size="16" font-weight="700"><text x="40" y="124">1 · Active ion loading</text><text x="287" y="124">2 · Lower water</text><text x="287" y="146">potential in xylem</text><text x="534" y="124">3 · Osmotic</text><text x="534" y="146">water entry</text><text x="781" y="124">4 · Positive pressure</text></g><g fill="#334155" font-size="13.5"><text x="40" y="167">Cells use metabolic</text><text x="40" y="185">energy to move mineral</text><text x="40" y="203">ions into xylem.</text><text x="287" y="181">More dissolved ions</text><text x="287" y="199">lower xylem water</text><text x="287" y="217">potential.</text><text x="534" y="181">Water moves from</text><text x="534" y="199">adjacent root cells</text><text x="534" y="217">toward the xylem.</text><text x="781" y="167">Water accumulation</text><text x="781" y="185">can push sap upward</text><text x="781" y="203">a limited distance.</text></g><g fill="#64748b" font-size="28" font-weight="700"><text x="245" y="201">›</text><text x="492" y="201">›</text><text x="739" y="201">›</text></g><rect x="25" y="278" width="949" height="64" rx="12" fill="#e2e8f0"/><text x="43" y="300" fill="#0f172a" font-weight="700" font-size="14.5">Contrast: root pressure vs transpiration pull</text><text x="43" y="322" fill="#334155" font-size="14">Root pressure = positive hydrostatic pressure when transpiration is low; transpiration pull = negative pressure (tension) that normally lifts water in tall trees.</text></g></svg>