<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">Phloem: pressure drives bulk flow</title><desc id="desc">Original pressure-flow model. Sucrose loading at source lowers phloem water potential so water enters from xylem and raises hydrostatic pressure. Sap flows toward lower pressure at a sink, where unloading allows water to return to xylem. Separate sieve tubes can transport in different directions. Not to scale.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="750" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Phloem: pressure drives bulk flow</text><text x="28" y="77" font-size="19" fill="#163d48" text-anchor="start" font-weight="400">One source-to-sink pathway · direction follows demand</text><rect x="65" y="135" width="136" height="436" rx="12" fill="#e2edf8" stroke="#316aaf" stroke-width="2"/><rect x="365" y="135" width="154" height="436" rx="12" fill="#e2f2e8" stroke="#4c8759" stroke-width="2"/><text x="133" y="117" font-size="23" fill="#316aaf" text-anchor="middle" font-weight="400">Xylem</text><text x="442" y="117" font-size="23" fill="#4c8759" text-anchor="middle" font-weight="400">Phloem</text><path d="M210 202H353" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="282" y="185" font-size="22" fill="#316aaf" text-anchor="middle" font-weight="400">H₂O</text><text x="365" y="167" font-size="19" fill="#4c8759" text-anchor="start" font-weight="400">High pressure</text><path d="M443 237V451" fill="none" stroke="#4c8759" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4c8759)"/><text x="452" y="331" font-size="22" fill="#4c8759" text-anchor="start" font-weight="400">Sap</text><path d="M355 509H212" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="282" y="493" font-size="22" fill="#316aaf" text-anchor="middle" font-weight="400">H₂O</text><text x="365" y="552" font-size="19" fill="#4c8759" text-anchor="start" font-weight="400">Lower pressure</text><text x="32" y="614" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">SOURCE: sucrose loading lowers water potential.</text><text x="32" y="645" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Water enters from xylem; pressure rises.</text><text x="32" y="684" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">SINK: sucrose unloading; water can return.</text><text x="32" y="715" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Bulk flow follows the hydrostatic pressure gradient.</text><text x="531" y="207" font-size="18" fill="#4c8759" text-anchor="middle" font-weight="400">Sugar</text><path d="M569 229H525" fill="none" stroke="#4c8759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4c8759)"/><text x="531" y="475" font-size="18" fill="#4c8759" text-anchor="middle" font-weight="400">Sugar</text><path d="M525 454H568" fill="none" stroke="#4c8759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4c8759)"/></g></svg>