<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" role="img" aria-labelledby="title desc"><title id="title">heart-circuits</title><desc id="desc">Schematic sequence of single circulation fish through heart, gills and body, compared to mammal's pulmonary and systemic circuits.</desc><rect width="900" height="465" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#163a4a"><text x="29" y="37" font-size="24">Blood circulation: compare one versus two circuits</text><g font-size="19"><text x="115" y="102">Bony fish</text><text x="555" y="102">Mammal</text></g><g fill="#e7eff7" stroke="#5b7e9b" stroke-width="2"><rect x="65" y="150" width="180" height="54" rx="12"/><rect x="65" y="273" width="180" height="54" rx="12"/><rect x="503" y="145" width="140" height="56" rx="12"/><rect x="701" y="145" width="141" height="56" rx="12"/><rect x="504" y="295" width="140" height="56" rx="12"/><rect x="701" y="295" width="141" height="56" rx="12"/></g><g font-size="17" text-anchor="middle"><text x="155" y="183">Heart</text><text x="155" y="307">Gills</text><text x="572" y="176">Right heart</text><text x="768" y="176">Lungs</text><text x="573" y="327">Body tissues</text><text x="767" y="327">Left heart</text></g><g stroke="#397e9e" stroke-width="5" fill="none"><path d="M155 205 V267 M252 298 H329 V175 H253 M150 327 V377 H33 V175 H59"/><path d="M648 172 H694 M768 202 V288 M696 323 H651 M573 289 V207"/><path d="M715 173 H655 M767 352 V402 H570 V359"/></g><g font-size="15"><text x="257" y="268">Body → heart</text><text x="71" y="392">One loop</text><text x="548" y="433">Two linked loops: pulmonary and systemic</text></g></g></svg>