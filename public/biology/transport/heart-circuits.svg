<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="595" viewBox="0 0 1160 595" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">Fish and mammalian blood circulation</title>
<desc id="visual-description">Original conceptual topology. Fish: heart to gill capillaries to systemic capillaries and back to heart. Mammal: right heart to lung capillaries to left heart to systemic capillaries and back to right heart. Every vessel connector has a one-way arrow. Blue means relatively low oxygen and red means relatively high oxygen; oxygen content is comparative, not numerical.</desc>
<defs>
 <marker id="arrow-low" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2269a5"/></marker>
 <marker id="arrow-high" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b43e50"/></marker>
</defs>
<style>
 .canvas{fill:#f8fbfd}.panel{fill:#fff;stroke:#c9d8e4;stroke-width:2}.node{fill:#edf5f9;stroke:#44748e;stroke-width:2}.heading,.panel-title,.node-text,.sub,.caption,.note,.blank{font-family:Arial,Helvetica,sans-serif;fill:#15364a}.heading{font-weight:700;font-size:29px}.panel-title{font-weight:700;font-size:22px}.sub{font-size:16px}.node-text{font-size:18px;font-weight:600}.blank{font-size:32px;font-weight:700}.caption{font-size:18px;font-weight:700}.note{font-size:16px}.flow-low,.flow-high{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.flow-low{stroke:#2269a5}.flow-high{stroke:#b43e50}
</style>
<rect class="canvas" width="1160" height="595" rx="18"/>
<text x="25" y="38" class="heading">Compare circulation: fish and mammal</text>
<text x="25" y="69" class="sub">Arrowheads show direction · <tspan fill="#2269a5">blue = lower O₂</tspan> · <tspan fill="#b43e50">red = higher O₂</tspan></text>
<g transform="translate(25 92)" data-circuit="fish"><rect width="540" height="450" rx="18" class="panel"/><text x="24" y="42" class="panel-title">FISH — single circulation</text><text x="24" y="89" class="sub">One circuit through gills and body</text><g data-node="fish-heart"><rect x="24" y="126" width="138" height="76" rx="13" class="node"/><text x="93" y="171" text-anchor="middle" class="node-text">Heart</text></g><g data-node="fish-gills"><rect x="202" y="126" width="138" height="76" rx="13" class="node"/><text x="271" y="159.5" text-anchor="middle" class="node-text">Gill</text><text x="271" y="182.5" text-anchor="middle" class="node-text">capillaries</text></g><g data-node="fish-body"><rect x="380" y="126" width="138" height="76" rx="13" class="node"/><text x="449" y="159.5" text-anchor="middle" class="node-text">Systemic</text><text x="449" y="182.5" text-anchor="middle" class="node-text">capillaries</text></g><path data-from="fish-heart" data-to="fish-gills" class="flow-low" d="M166 164 H197" marker-end="url(#arrow-low)"/><path data-from="fish-gills" data-to="fish-body" class="flow-high" d="M344 164 H375" marker-end="url(#arrow-high)"/><path data-from="fish-body" data-to="fish-heart" class="flow-low" d="M449 207 V281 H93 V207" marker-end="url(#arrow-low)"/><text x="24" y="355" class="caption">Sequence: heart → gills → body → heart</text><text x="24" y="385" class="note">Blood passes through systemic capillaries before returning.</text></g>
<g transform="translate(595 92)" data-circuit="mammal"><rect width="540" height="450" rx="18" class="panel"/><text x="24" y="42" class="panel-title">MAMMAL — double circulation</text><text x="24" y="89" class="sub">Pulmonary and systemic routes in series</text><g data-node="mammal-right-heart"><rect x="24" y="126" width="180" height="76" rx="13" class="node"/><text x="114" y="171" text-anchor="middle" class="node-text">Right heart</text></g><g data-node="mammal-lungs"><rect x="334" y="126" width="180" height="76" rx="13" class="node"/><text x="424" y="159.5" text-anchor="middle" class="node-text">Lung</text><text x="424" y="182.5" text-anchor="middle" class="node-text">capillaries</text></g><g data-node="mammal-left-heart"><rect x="334" y="281" width="180" height="76" rx="13" class="node"/><text x="424" y="326" text-anchor="middle" class="node-text">Left heart</text></g><g data-node="mammal-body"><rect x="24" y="281" width="180" height="76" rx="13" class="node"/><text x="114" y="314.5" text-anchor="middle" class="node-text">Systemic</text><text x="114" y="337.5" text-anchor="middle" class="node-text">capillaries</text></g><path data-from="mammal-right-heart" data-to="mammal-lungs" class="flow-low" d="M209 164 H329" marker-end="url(#arrow-low)"/><path data-from="mammal-lungs" data-to="mammal-left-heart" class="flow-high" d="M424 207 V276" marker-end="url(#arrow-high)"/><path data-from="mammal-left-heart" data-to="mammal-body" class="flow-high" d="M329 320 H209" marker-end="url(#arrow-high)"/><path data-from="mammal-body" data-to="mammal-right-heart" class="flow-low" d="M114 276 V207" marker-end="url(#arrow-low)"/><text x="24" y="392" class="note">Right heart → lungs → left heart</text><text x="24" y="418" class="note">→ body → right heart</text></g>
<text x="25" y="577" class="note">Conceptual flow model; not an anatomical drawing or a scaled measurement.</text>
</svg>