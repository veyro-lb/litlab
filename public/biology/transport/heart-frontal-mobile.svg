<g font-size="19"><text x="84" y="252">Venae cavae</text><text x="80" y="413">Tricuspid</text><text x="80" y="438">valve</text><text x="350" y="413">Mitral valve</text><text x="25" y="208">Pulmonary</text><text x="25" y="231">artery</text><text x="444" y="208">Pulmonary</text><text x="444" y="231">veins</text><text x="88" y="622">Pulmonary valve</text><text x="363" y="622">Aortic valve</text><text x="451" y="739">Aorta → body</text></g>
