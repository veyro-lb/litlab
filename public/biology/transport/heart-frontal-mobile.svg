<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc">
<title id="title">Mammalian heart, frontal view, mobile diagram</title>
<desc id="desc">Anatomical right on viewer left: venae cavae into right atrium, tricuspid valve into right ventricle, pulmonary valve and artery to lungs; pulmonary veins into left atrium, mitral valve into left ventricle, aortic valve and aorta to body. Arrows indicate blood flow. Constructed anatomy schematic, not to scale.</desc>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2873a5"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c44f55"/></marker></defs>
<rect width="600" height="840" rx="18" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#263f4d">
<text x="25" y="42" font-size="29" font-weight="700">Heart: one-way blood flow</text>
<text x="26" y="72" font-size="20">Anatomical right is on the viewer's left</text>
<rect x="214" y="100" width="173" height="77" rx="14" fill="#e9f6ef" stroke="#6f9880" stroke-width="2"/>
<text x="300" y="145" text-anchor="middle" font-size="25">Lungs</text>
<g stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
