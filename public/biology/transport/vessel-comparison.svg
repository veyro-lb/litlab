<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" role="img" aria-labelledby="title desc"><title id="title">vessel-comparison</title><desc id="desc">Schematic artery with thick media and round lumen, vein with thin wall and valve, and capillary with single thin endothelial ring.</desc><rect width="900" height="465" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#163a4a"><text x="32" y="42" font-size="25">Blood vessels: structure and exchange</text><circle cx="175" cy="231" r="117" fill="#dc8f89" stroke="#aa5551" stroke-width="6"/><circle cx="175" cy="231" r="52" fill="#f9e6e3" stroke="#b56963" stroke-width="3"/><text x="127" y="382" font-size="22">Artery</text><text x="95" y="414" font-size="15">Thick muscular wall</text><ellipse cx="471" cy="231" rx="125" ry="106" fill="#c6d8ef" stroke="#597ba8" stroke-width="5"/><ellipse cx="471" cy="231" rx="105" ry="86" fill="#f3f8ff"/><path d="M462 167 L486 230 L463 294" fill="none" stroke="#6385b2" stroke-width="6"/><text x="433" y="382" font-size="22">Vein</text><text x="379" y="412" font-size="15">Thinner wall + valve</text><circle cx="760" cy="232" r="63" fill="#f3f8ff" stroke="#a95d60" stroke-width="9"/><ellipse cx="760" cy="232" rx="24" ry="15" fill="#ca5357"/><text x="717" y="382" font-size="22">Capillary</text><text x="691" y="412" font-size="15">Thin endothelium</text><text x="32" y="448" font-size="13">Conceptual cross sections; not micrographs and not drawn to a common size scale.</text></g></svg>