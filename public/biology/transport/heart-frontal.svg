<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Mammalian heart in simplified frontal plane with one-way blood flow</title>
<desc id="desc">Anatomical right appears on the viewer's left. Venae cavae feed the right atrium, the tricuspid valve leads to the right ventricle, the pulmonary semilunar valve leads to pulmonary arteries and lungs, pulmonary veins feed the left atrium, the mitral valve leads to the left ventricle, and the aortic semilunar valve leads to the aorta and body. Blue is relatively oxygen-poor and red oxygen-rich blood. Chambers and paths are schematic and not to scale.</desc>
<defs><marker id="bluehead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2775a7"/></marker><marker id="redhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c54d52"/></marker></defs>
<rect width="1200" height="680" rx="18" fill="#f9fbfd"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#233849">
<text x="34" y="43" font-weight="700" font-size="30">Heart chambers, valves and circulation</text>
<text x="34" y="76" font-size="18">Frontal schematic · anatomical right is on the left of the page · not to scale</text>
<rect x="432" y="96" width="334" height="76" rx="15" fill="#e9f5f0" stroke="#668e83" stroke-width="2"/>
<text x="599" y="126" text-anchor="middle" font-size="23" font-weight="700">Lung capillaries</text>
<text x="599" y="152" text-anchor="middle" font-size="17">O₂ enters blood · CO₂ leaves</text>
<rect x="226" y="220" width="300" height="126" rx="22" fill="#d9ebf9" stroke="#2775a7" stroke-width="3"/>
<rect x="226" y="394" width="300" height="158" rx="26" fill="#d3e5f7" stroke="#2775a7" stroke-width="4"/>
<rect x="672" y="220" width="300" height="126" rx="22" fill="#fce0e1" stroke="#c54d52" stroke-width="3"/>
<rect x="672" y="394" width="300" height="158" rx="26" fill="#f7d4d7" stroke="#c54d52" stroke-width="7"/>
<g font-size="24" font-weight="700" text-anchor="middle">
<text x="376" y="270">Right atrium</text><text x="376" y="446">Right ventricle</text>
<text x="822" y="270">Left atrium</text><text x="822" y="446">Left ventricle</text>
</g>
<g font-size="17" text-anchor="middle"><text x="376" y="309">receives venous blood</text><text x="376" y="485">pumps to lungs</text><text x="822" y="309">receives pulmonary veins</text><text x="822" y="485">thicker myocardium</text></g>
<rect x="570" y="220" width="58" height="332" rx="18" fill="#e4e9eb" stroke="#8b9da4" stroke-width="2"/>
<text x="598" y="577" text-anchor="middle" font-size="19">Septum separates sides</text>
<g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<path d="M40 282H215" stroke="#2775a7" marker-end="url(#bluehead)"/>
<path d="M376 347V386" stroke="#2775a7" marker-end="url(#bluehead)"/>
<path d="M225 467H140V132H423" stroke="#2775a7" marker-end="url(#bluehead)"/>
<path d="M774 132H1054V281H986" stroke="#c54d52" marker-end="url(#redhead)"/>
<path d="M822 347V386" stroke="#c54d52" marker-end="url(#redhead)"/>
<path d="M974 501H1092V177" stroke="#c54d52" marker-end="url(#redhead)"/>
</g>
<g font-size="19" font-weight="600">
<text x="38" y="256">Venae cavae</text><text x="388" y="375">Tricuspid valve</text><text x="840" y="375">Mitral valve</text>
<text x="145" y="107">Pulmonary artery</text><text x="802" y="107">Pulmonary veins</text>
<text x="1010" y="534">Aorta</text><text x="995" y="559">→ body</text>
<text x="31" y="499">Pulmonary</text><text x="31" y="522">valve</text>
<text x="1057" y="605">Aortic valve</text>
</g>
<g font-size="17"><text x="34" y="627">Blue: relatively deoxygenated · red: oxygenated.</text><text x="34" y="654">Flow directions shown by arrowheads; valves open when upstream pressure exceeds downstream pressure.</text></g>
</g></svg>