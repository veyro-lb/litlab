<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Root pressure: ion loading draws water</title><desc id="desc">Conceptual root-cell to xylem model: active ion loading decreases xylem water potential; osmotic water entry raises positive pressure. The root endodermal barrier is omitted for clarity. Root pressure is distinct from the transpiration-tension mechanism.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="740" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Root pressure: ion loading draws water</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Root: mineral uptake changes water potential</text><rect x="34" y="130" width="180" height="367" rx="12" fill="#f1e5d3" stroke="#a87013" stroke-width="2"/><rect x="351" y="130" width="212" height="367" rx="12" fill="#e2edf8" stroke="#316aaf" stroke-width="2"/><text x="124" y="170" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">Root cells</text><text x="457" y="170" font-size="22" fill="#316aaf" text-anchor="middle" font-weight="400">Xylem</text><text x="124" y="235" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">Mineral ions</text><path d="M224 250H341" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="282" y="218" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">Active</text><text x="282" y="292" font-size="19" fill="#163d48" text-anchor="middle" font-weight="400">transport</text><text x="282" y="324" font-size="19" fill="#a87013" text-anchor="middle" font-weight="400">ATP used</text><path d="M224 400H341" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="282" y="380" font-size="23" fill="#316aaf" text-anchor="middle" font-weight="400">H₂O</text><text x="282" y="439" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">Osmosis</text><path d="M456 447V219" fill="none" stroke="#316aaf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="457" y="480" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">Pressure rises</text><text x="30" y="553" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Ion loading lowers xylem water potential.</text><text x="30" y="581" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Water moves in by osmosis, producing</text><text x="30" y="609" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">positive root pressure.</text><text x="30" y="656" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Root pressure can push sap upward, but</text><text x="30" y="684" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">transpiration pull is the main driver in</text><text x="30" y="712" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">tall plants.</text></g></svg>