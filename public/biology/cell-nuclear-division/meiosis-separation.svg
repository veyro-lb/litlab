<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" role="img" aria-labelledby="title desc"><title id="title">Meiosis: one replication, two divisions</title><desc id="desc">Original 2n=4 model: replicated homologous pairs segregate in meiosis I; sister chromatids separate in meiosis II to four n=2 products. Two parental origins blue/red. One orientation shown, with possible combinations 2 to the n before crossing over. Crossing over not depicted in this separate counting model.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="770" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Meiosis: one replication, two divisions</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Two homologous pairs · 2n = 4</text><path d="M84 127L116 192M116 127L84 192" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 127L236 192M236 127L204 192" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 127L391 169M391 127L359 169" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M479 127L511 169M511 127L479 169" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="234" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">Meiosis I: homologues separate</text><path d="M160 201L145 265" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M445 201L455 265" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="35" y="277" width="220" height="112" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M93 299L117 359M117 299L93 359" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M173 299L197 339M197 299L173 339" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="277" width="220" height="112" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M403 299L427 359M427 299L403 359" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M483 299L507 339M507 299L483 339" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="441" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">Meiosis II: sister chromatids separate</text><path d="M145 394L82 484" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="27" y="494" width="111" height="107" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M62 516V577" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 528V565" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 394L227 484" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="172" y="494" width="111" height="107" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M207 516V577" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M247 528V565" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 394L372 484" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="317" y="494" width="111" height="107" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M352 516V577" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 528V565" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 394L517 484" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="462" y="494" width="111" height="107" rx="12" fill="#eef4f7" stroke="#86ada8" stroke-width="2"/><path d="M497 516V577" fill="none" stroke="#b84c6f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M537 528V565" fill="none" stroke="#316aaf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="648" font-size="22" fill="#163d48" text-anchor="start" font-weight="600">Four haploid products · each n = 2</text><text x="30" y="691" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">One possible orientation is shown.</text><text x="30" y="718" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Independent orientation of each pair gives</text><text x="30" y="745" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">2ⁿ combinations before crossing over.</text></g></svg>