<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 485" role="img" aria-labelledby="ttl d"><title id="ttl">Chromosomes, chromatids and DNA molecules through mitosis in a two n equals four model</title><desc id="d">G1 has four chromosomes and four DNA molecules. G2 after replication has four chromosomes, eight chromatids and eight DNA molecules. Mitotic metaphase has the same count. During anaphase before cytokinesis one cell has eight separated chromosomes and eight DNA molecules. After cytokinesis each daughter cell has four chromosomes and four DNA molecules.</desc><rect width="1020" height="485" fill="#f5faff"/><text x="25" y="44" font-family="sans-serif" font-size="24" fill="#153858" font-weight="700">Count centromeres: model cell 2n = 4</text><g font-family="sans-serif" font-size="17" fill="#244e71"><text x="38" y="105">G1</text><text x="234" y="105">G2 / after S</text><text x="448" y="105">Metaphase</text><text x="650" y="105">Anaphase*</text><text x="840" y="105">Each daughter</text></g><g stroke="#5693c3" stroke-width="4" fill="none"><rect x="20" y="125" width="176" height="270" rx="18"/><rect x="216" y="125" width="190" height="270" rx="18"/><rect x="425" y="125" width="188" height="270" rx="18"/><rect x="631" y="125" width="184" height="270" rx="18"/><rect x="833" y="125" width="165" height="270" rx="18"/></g><g font-family="monospace" font-size="32" fill="#1d719e"><text x="49" y="214">| |</text><text x="49" y="264">| |</text><text x="242" y="214">X X</text><text x="242" y="264">X X</text><text x="453" y="214">X X</text><text x="453" y="264">X X</text><text x="656" y="192">| | | |</text><text x="656" y="242">| | | |</text><text x="858" y="214">| |</text><text x="858" y="264">| |</text></g><g font-family="sans-serif" font-size="19" fill="#244e71"><text x="38" y="332">4 chr</text><text x="38" y="361">4 DNA</text><text x="234" y="332">4 chr</text><text x="234" y="361">8 DNA</text><text x="443" y="332">4 chr</text><text x="443" y="361">8 DNA</text><text x="649" y="332">8 chr*</text><text x="649" y="361">8 DNA</text><text x="851" y="332">4 chr</text><text x="851" y="361">4 DNA</text></g><text x="26" y="432" font-family="sans-serif" font-size="18" fill="#3d5268">*At anaphase, separated sister chromatids become individual chromosomes within one cell.</text><text x="26" y="462" font-family="sans-serif" font-size="18" fill="#3d5268">Schematic chromosome symbols show counting only; not actual spindle geometry or a micrograph.</text></svg>