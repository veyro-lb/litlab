<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Crossing over exchanges DNA</title><desc id="desc">Paired replicated homologues each have two sister chromatids. An equivalent distal segment exchanges between one chromatid of each homologue, yielding two recombinant and two non-recombinant chromatids. Centromeres shown as dark dots; chromosomes spread for clarity. Not sister chromatid exchange.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="740" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Crossing over exchanges DNA</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Prophase I · paired homologous chromosomes</text><text x="115" y="113" font-size="21" fill="#316aaf" text-anchor="middle" font-weight="400">Homologue A</text><text x="438" y="113" font-size="21" fill="#b84c6f" text-anchor="middle" font-weight="400">Homologue B</text><path d="M85 145V293" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="85" cy="215" r="9" fill="#163d48"/><path d="M145 145V293" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="145" cy="215" r="9" fill="#163d48"/><path d="M410 145V293" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="215" r="9" fill="#163d48"/><path d="M470 145V293" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="215" r="9" fill="#163d48"/><path d="M157 263C240 320 314 320 398 263" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="290" y="345" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">Non-sister chromatids exchange</text><text x="290" y="375" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">equivalent DNA segments</text><path d="M300 395V444" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M85 467V573" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 581V632" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="85" cy="530" r="9" fill="#163d48"/><path d="M145 467V573" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 581V632" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="145" cy="530" r="9" fill="#163d48"/><path d="M410 467V573" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 581V632" fill="none" stroke="#316aaf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="410" cy="530" r="9" fill="#163d48"/><path d="M470 467V573" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M470 581V632" fill="none" stroke="#b84c6f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="530" r="9" fill="#163d48"/><text x="28" y="680" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Two chromatids are recombinant; two unchanged.</text><text x="28" y="715" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Chromosome number is unchanged by crossing over.</text></g></svg>