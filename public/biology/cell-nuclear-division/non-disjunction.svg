<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" role="img" aria-labelledby="title desc">
  <title id="title">Nondisjunction in meiosis I and meiosis II</title>
  <desc id="desc">For one chromosome pair, meiosis I nondisjunction gives gametes with two, two, zero, and zero copies. Meiosis II nondisjunction in one of the two cells gives gametes with two, zero, one, and one copy.</desc>
  <defs>
    <g id="x" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M-8 -13L8 13M8 -13L-8 13"/>
    </g>
    <path id="chromatid" d="M0 -12V12" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <circle id="gamete" r="24" fill="#fff" stroke="#8798a5" stroke-width="1.5"/>
  </defs>
  <rect width="640" height="434" rx="18" fill="#f3f7fa"/>
  <rect x="12" y="12" width="302" height="410" rx="14" fill="#fff"/>
  <rect x="326" y="12" width="302" height="410" rx="14" fill="#fff"/>
  <g font-family="system-ui,sans-serif" fill="#203242" text-anchor="middle">
    <text x="163" y="43" font-size="21" font-weight="700">Error in meiosis I</text>
    <text x="477" y="43" font-size="21" font-weight="700">Error in meiosis II</text>
    <text x="163" y="70" font-size="15">Homologues fail to separate</text>
    <text x="477" y="70" font-size="15">Sister chromatids fail to separate</text>
    <text x="163" y="234" font-size="15">Meiosis II separates sister chromatids</text>
    <text x="477" y="234" font-size="15">One of the two cells is affected</text>
    <g font-size="14">
      <text x="55" y="329">n + 1</text><text x="127" y="329">n + 1</text>
      <text x="199" y="329">n − 1</text><text x="271" y="329">n − 1</text>
      <text x="369" y="329">n + 1</text><text x="441" y="329">n − 1</text>
      <text x="513" y="329">n</text><text x="585" y="329">n</text>
      <text x="163" y="370">All four products are affected.</text>
      <text x="477" y="370">Two products have the usual number.</text>
      <text x="320" y="404">One chromosome pair shown. n = usual haploid number.</text>
    </g>
  </g>
  <g fill="none" stroke="#8798a5" stroke-width="2">
    <path d="M163 129V143M163 143L91 165M163 143L235 165M91 198L55 258M91 198L127 258M235 198L199 258M235 198L271 258"/>
    <path d="M477 129V143M477 143L405 165M477 143L549 165M405 198L369 258M405 198L441 258M549 198L513 258M549 198L585 258"/>
  </g>
  <g fill="#edf3f6" stroke="#8798a5" stroke-width="1.5">
    <ellipse cx="163" cy="108" rx="37" ry="22"/><ellipse cx="477" cy="108" rx="37" ry="22"/>
    <ellipse cx="91" cy="181" rx="36" ry="23"/><ellipse cx="235" cy="181" rx="26" ry="23"/>
    <ellipse cx="405" cy="181" rx="26" ry="23"/><ellipse cx="549" cy="181" rx="26" ry="23"/>
  </g>
  <g color="#00746c">
    <use href="#x" x="149" y="108"/><use href="#x" x="463" y="108"/>
    <use href="#x" x="77" y="181"/><use href="#x" x="405" y="181"/>
  </g>
  <g color="#7c3893">
    <use href="#x" x="177" y="108"/><use href="#x" x="491" y="108"/>
    <use href="#x" x="105" y="181"/><use href="#x" x="549" y="181"/>
  </g>
  <g>
    <use href="#gamete" x="55" y="282"/><use href="#gamete" x="127" y="282"/>
    <use href="#gamete" x="199" y="282"/><use href="#gamete" x="271" y="282"/>
    <use href="#gamete" x="369" y="282"/><use href="#gamete" x="441" y="282"/>
    <use href="#gamete" x="513" y="282"/><use href="#gamete" x="585" y="282"/>
  </g>
  <g color="#00746c">
    <use href="#chromatid" x="49" y="282"/><use href="#chromatid" x="121" y="282"/>
    <use href="#chromatid" x="363" y="282"/><use href="#chromatid" x="375" y="282"/>
  </g>
  <g color="#7c3893">
    <use href="#chromatid" x="61" y="282"/><use href="#chromatid" x="133" y="282"/>
    <use href="#chromatid" x="513" y="282"/><use href="#chromatid" x="585" y="282"/>
  </g>
</svg>
