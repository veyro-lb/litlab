<g stroke="#d5e4f4" stroke-width="4" fill="none"><ellipse cx="147" cy="253" rx="95" ry="116"/><ellipse cx="423" cy="253" rx="95" ry="116"/><ellipse cx="704" cy="253" rx="95" ry="116"/><ellipse cx="918" cy="253" rx="42" ry="103"/><ellipse cx="1036" cy="253" rx="42" ry="103"/></g>
