<text x="32" y="443" font-family="Arial,sans-serif" font-size="18" fill="#41556a">Each X = one chromosome with two chromatids. After anaphase separation, each line = one chromosome.</text>
<text x="32" y="470" font-family="Arial,sans-serif" font-size="16" fill="#52677c">Original conceptual teaching illustration; cytoplasm, spindle architecture and exact chromosome shape are simplified.</text>
