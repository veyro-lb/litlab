<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Four stages of mitosis in a theoretical diploid cell with 2n = 4</title>
<desc id="desc">The same diploid set of four duplicated chromosomes appears condensed in prophase, then aligned at metaphase. In anaphase all four pairs of sister chromatids separate, with four daughter chromosomes moving toward each pole (eight chromosomes total within the still-undivided cell). Telophase shows two re-forming nuclei, each with four single-chromatid chromosomes. Illustrative chromosomes and distances are not to scale and this is not a micrograph.</desc>
<rect width="1120" height="490" rx="18" fill="#f6faff"/>
<text x="32" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173a59">Track chromosomes through mitosis · model 2n = 4</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#1f4766" font-weight="700"><text x="42" y="95">Prophase</text><text x="323" y="95">Metaphase</text><text x="601" y="95">Anaphase</text><text x="876" y="95">Telophase</text></g>
