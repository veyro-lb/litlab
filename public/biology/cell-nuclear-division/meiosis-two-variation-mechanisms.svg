<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="433" viewBox="0 0 1020 433" role="img" aria-labelledby="title desc"><title id="title">Two mechanisms that produce variation during meiosis I</title><desc id="desc">During prophase I crossing over exchanges matching DNA segments between non-sister chromatids. During metaphase I two homologous pairs orient independently, producing four possible combinations of whole maternal and paternal homologs before considering crossing over.</desc><rect width="1020" height="433" rx="18" fill="#f8fafc"/><g font-family="system-ui,sans-serif"><text x="24" y="39" font-size="23" font-weight="700" fill="#0f172a">Meiosis creates variation in two different ways</text><text x="24" y="61" font-size="14" fill="#475569">IB D2.1.11 · model with two chromosome pairs; diagrams are conceptual, not to scale</text><rect x="22" y="80" width="462" height="317" rx="15" fill="#eef4ff" stroke="#c9d8f1"/><rect x="507" y="80" width="490" height="317" rx="15" fill="#eef9f3" stroke="#bae3cb"/><text x="44" y="112" font-size="18" font-weight="700" fill="#0f172a">1 · Crossing over (prophase I)</text><text x="528" y="112" font-size="18" font-weight="700" fill="#0f172a">2 · Independent orientation (metaphase I)</text><g font-size="13.5" fill="#334155"><text x="44" y="139">Non-sister chromatids exchange corresponding</text><text x="44" y="157">segments after homologous chromosomes pair.</text><text x="528" y="139">Each homologous pair faces the poles independently.</text><text x="528" y="157">Whole-chromosome combinations vary between gametes.</text></g><g stroke-width="13" stroke-linecap="round"><path d="M95 194V291" stroke="#2563eb"/><path d="M154 194V291" stroke="#d97706"/><path d="M286 194V253" stroke="#2563eb"/><path d="M286 253V291" stroke="#d97706"/><path d="M346 194V253" stroke="#d97706"/><path d="M346 253V291" stroke="#2563eb"/></g><g fill="#64748b" font-size="27"><text x="211" y="246">→</text></g><g fill="#334155" font-size="12.5" text-anchor="middle"><text x="124" y="316">Before exchange</text><text x="316" y="316">Recombinant chromatids</text></g><g fill="#64748b" font-size="12"><text x="44" y="363">Blue = one homolog; orange = the other.</text><text x="44" y="380">Segments exchange at corresponding loci.</text></g><g font-size="15" font-weight="700" fill="#334155"><text x="529" y="205">Pair 1</text><text x="529" y="244">Pair 2</text></g><g fill="#2563eb"><circle cx="618" cy="200" r="14"/><circle cx="618" cy="240" r="14"/></g><g fill="#d97706"><circle cx="655" cy="200" r="14"/><circle cx="655" cy="240" r="14"/></g><g stroke="#94a3b8" stroke-dasharray="4 4"><path d="M683 180V257"/></g><text x="710" y="203" fill="#334155" font-size="13">Either orientation of each pair</text><text x="710" y="224" fill="#334155" font-size="13">is possible, independently.</text><g fill="#f8fafc" stroke="#bbd3c2"><rect x="531" y="278" rx="9" width="446" height="88"/></g><g font-size="13" fill="#334155"><text x="546" y="298">Possible whole-homolog combinations (n = 2):</text><text x="546" y="322">maternal 1 + maternal 2</text><text x="756" y="322">maternal 1 + paternal 2</text><text x="546" y="347">paternal 1 + maternal 2</text><text x="756" y="347">paternal 1 + paternal 2</text></g><text x="24" y="419" font-size="13.5" fill="#0f172a">Crossing over recombines alleles within chromatids; assortment distributes homologs. Neither process creates a new allele by itself.</text></g></svg>