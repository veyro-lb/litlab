<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" role="img" aria-labelledby="t d"><title id="t">alveolus-capillary</title><desc id="d">Alveolar air, short barrier and adjacent capillary; arrows show oxygen moving into blood and carbon dioxide into air; surfactant noted.</desc><rect width="850" height="440" rx="18" fill="#f7fafb"/><g font-family="Arial,sans-serif" fill="#193a4b"><text x="30" y="36" font-size="25">Alveolus and perfused capillary</text><circle cx="280" cy="220" r="137" fill="#d2eaf4" stroke="#347c97" stroke-width="7"/><circle cx="280" cy="220" r="123" fill="white"/><text x="205" y="205" font-size="24">Air space</text><text x="222" y="239" font-size="18">Moist lining</text><path d="M160 274 Q185 403 325 389 Q450 365 407 243" fill="none" stroke="#bd676a" stroke-width="43" stroke-linecap="round"/><ellipse cx="313" cy="386" rx="28" ry="16" fill="#c65258"/><path d="M283 300 V344" stroke="#247fa2" stroke-width="5"/><path d="M283 352 l-12 -18 h24 Z" fill="#247fa2"/><text x="301" y="331" font-size="17">O₂ to blood</text><path d="M200 345 L214 291" stroke="#b05b34" stroke-width="4"/><path d="M214 288 l-13 21 h24 Z" fill="#b05b34"/><text x="34" y="360" font-size="17">CO₂ to air</text><text x="527" y="129" font-size="18">Thin epithelial layer</text><path d="M515 136 L408 171" stroke="#347c97" stroke-width="2"/><text x="529" y="184" font-size="18">Surfactant reduces</text><text x="529" y="208" font-size="18">surface tension</text><text x="529" y="349" font-size="18">Capillary with blood cells</text><path d="M514 348 L398 366" stroke="#bd676a" stroke-width="2"/><text x="28" y="420" font-size="14">Original conceptual schematic; not to anatomical scale.</text></g></svg>