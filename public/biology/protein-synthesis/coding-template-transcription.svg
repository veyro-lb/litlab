<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 450" role="img" aria-labelledby="title desc"><title id="title">Coding DNA, template DNA, mRNA and amino-acid sequence</title><desc id="desc">DNA coding strand 5 prime ATG GCT TAA 3 prime; antiparallel template strand 3 prime TAC CGA ATT 5 prime; transcribed RNA 5 prime AUG GCU UAA 3 prime; translated product methionine alanine then stop. RNA polymerase reads the template from 3 prime to 5 prime and synthesizes RNA 5 prime to 3 prime.</desc><rect width="970" height="450" fill="#f6fafd"/><text x="35" y="49" font-family="sans-serif" font-size="25" fill="#123c58" font-weight="700">Which DNA strand is used as the RNA template?</text><text x="35" y="113" font-family="sans-serif" font-size="21">DNA coding</text><text x="235" y="113" font-family="monospace" font-size="26" fill="#27658a">5′  ATG  GCT  TAA  3′</text><text x="35" y="172" font-family="sans-serif" font-size="21">DNA template</text><text x="235" y="172" font-family="monospace" font-size="26" fill="#27658a">3′  TAC  CGA  ATT  5′</text><path d="M420 193 V248" stroke="#b86636" stroke-width="4"/><path d="M408 235 L420 250 L432 235" fill="none" stroke="#b86636" stroke-width="4"/><text x="458" y="225" font-family="sans-serif" font-size="17" fill="#8b4b28">RNA polymerase reads 3′→5′</text><text x="35" y="288" font-family="sans-serif" font-size="21">mRNA</text><text x="235" y="288" font-family="monospace" font-size="27" fill="#168875">5′  AUG  GCU  UAA  3′</text><path d="M420 311 V359" stroke="#168875" stroke-width="4"/><path d="M408 347 L420 362 L432 347" fill="none" stroke="#168875" stroke-width="4"/><text x="458" y="336" font-family="sans-serif" font-size="17">Ribosome reads mRNA 5′→3′</text><text x="35" y="402" font-family="sans-serif" font-size="21">Polypeptide</text><text x="235" y="402" font-family="sans-serif" font-size="24" fill="#70419b">Met — Ala · STOP</text><text x="572" y="402" font-family="sans-serif" font-size="18">Stop is not an amino acid</text></svg>