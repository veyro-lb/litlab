<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Translation: pair, join, move</title><desc id="desc">An illustrative ribosome with P and A sites on mRNA reading 5 prime AUG CCG 3 prime. tRNA anticodons are displayed antiparallel. The polypeptide transfers from P to A, then translocation moves the ribosome one codon toward mRNA 3 prime. E site and initiation factors omitted.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="740" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Translation: pair, join, move</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">mRNA is read 5′ → 3′; chain grows N → C</text><rect x="107" y="166" width="397" height="227" rx="65" fill="#e2edf8" stroke="#316aaf" stroke-width="2"/><text x="300" y="198" font-size="22" fill="#316aaf" text-anchor="middle" font-weight="400">Ribosome</text><text x="212" y="235" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">P site</text><text x="383" y="235" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">A site</text><path d="M214 266V315" fill="none" stroke="#b84c6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M385 266V315" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="340" font-size="22" fill="#b84c6f" text-anchor="middle" font-weight="400">UAC</text><text x="385" y="340" font-size="22" fill="#a87013" text-anchor="middle" font-weight="400">GGC</text><path d="M31 365H562" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="32" y="401" font-size="22" fill="#163d48" text-anchor="start" font-weight="400">5′</text><text x="558" y="401" font-size="22" fill="#163d48" text-anchor="start" font-weight="400">3′</text><text x="214" y="373" font-size="23" fill="#163d48" text-anchor="middle" font-weight="700">AUG</text><text x="385" y="373" font-size="23" fill="#163d48" text-anchor="middle" font-weight="700">CCG</text><circle cx="134" cy="263" r="10" fill="#b84c6f"/><circle cx="160" cy="263" r="10" fill="#b84c6f"/><circle cx="186" cy="263" r="10" fill="#b84c6f"/><circle cx="212" cy="263" r="10" fill="#b84c6f"/><circle cx="385" cy="263" r="11" fill="#a87013"/><path d="M238 262H363" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="298" y="294" font-size="19" fill="#316aaf" text-anchor="middle" font-weight="400">Transfer</text><text x="40" y="140" font-size="20" fill="#b84c6f" text-anchor="start" font-weight="400">Growing chain on tRNA</text><text x="348" y="140" font-size="20" fill="#a87013" text-anchor="start" font-weight="400">Next amino acid</text><text x="30" y="451" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">1. A charged tRNA pairs its anticodon with</text><text x="30" y="479" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">the next mRNA codon in the A site.</text><text x="30" y="532" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">2. A peptide bond transfers the growing</text><text x="30" y="560" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">chain from the P-site tRNA to the A-site</text><text x="30" y="588" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">amino acid.</text><text x="30" y="613" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">3. Ribosome moves one codon toward 3′. Empty</text><text x="30" y="641" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">tRNA exits; loaded tRNA moves to P.</text><text x="30" y="709" font-size="19" fill="#163d48" text-anchor="start" font-weight="400">Codon example AUG–CCG is illustrative. Not to scale.</text></g></svg>