<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img" aria-labelledby="title desc">
<title id="title">One cycle of polypeptide elongation at a ribosome</title>
<desc id="desc">A charged tRNA enters the A site, the growing peptide is transferred to it by peptide bond formation, and the ribosome moves three nucleotides toward the mRNA's three-prime end. The emptied tRNA exits and elongation repeats.</desc>
<rect width="1000" height="386" fill="#f8fafc" rx="18"/>
<text x="26" y="39" font-size="23" font-weight="700" fill="#0f172a" font-family="system-ui,sans-serif">Translation elongation: one codon at a time</text>
<text x="26" y="62" font-size="14" fill="#475569" font-family="system-ui,sans-serif">IB D1.2.10 · conceptual order; the same mechanism repeats for each added amino acid</text>
<g font-family="system-ui,sans-serif">
<g fill="#eef4ff" stroke="#c7d8f4"><rect x="24" y="79" width="302" height="269" rx="16"/></g>
<g fill="#ebf8f1" stroke="#b6e0c9"><rect x="349" y="79" width="302" height="269" rx="16"/></g>
<g fill="#fff6e6" stroke="#f3d9a9"><rect x="674" y="79" width="302" height="269" rx="16"/></g>
<g font-size="17" font-weight="700" fill="#0f172a"><text x="43" y="110">1 · Codon recognition</text><text x="368" y="110">2 · Peptide bond</text><text x="693" y="110">3 · Translocation</text></g>
<g font-size="13.5" fill="#334155"><text x="43" y="137">A matching aminoacyl-tRNA</text><text x="43" y="155">enters the A site.</text><text x="368" y="137">The growing chain transfers</text><text x="368" y="155">to the A-site amino acid.</text><text x="693" y="137">Ribosome advances exactly</text><text x="693" y="155">one codon along the mRNA.</text></g>
<g stroke="#64748b" stroke-width="8" stroke-linecap="round"><path d="M54 258H297"/><path d="M379 258H622"/><path d="M704 258H947"/></g>
<g fill="#475569" font-size="12" text-anchor="middle"><text x="175" y="281">5′ → 3′ mRNA</text><text x="500" y="281">5′ → 3′ mRNA</text><text x="825" y="281">5′ → 3′ mRNA</text></g>
<g fill="#dce4f4" stroke="#64748b" stroke-width="2"><rect x="89" y="185" width="161" height="60" rx="29"/><rect x="414" y="185" width="161" height="60" rx="29"/><rect x="739" y="185" width="161" height="60" rx="29"/></g>
<g fill="#0f172a" font-size="12" text-anchor="middle"><text x="135" y="237">P site</text><text x="202" y="237">A site</text><text x="460" y="237">P site</text><text x="527" y="237">A site</text><text x="785" y="237">P site</text><text x="852" y="237">A site</text></g>
<g stroke-width="5" stroke-linecap="round"><path d="M134 187V170" stroke="#2563eb"/><path d="M201 187V170" stroke="#d97706"/><path d="M459 187V170" stroke="#2563eb"/><path d="M526 187V170" stroke="#16a34a"/><path d="M753 187V170" stroke="#94a3b8"/><path d="M785 187V170" stroke="#16a34a"/></g>
<g fill="#2563eb"><circle cx="132" cy="167" r="8"/><circle cx="145" cy="163" r="8"/></g><circle cx="200" cy="167" r="8" fill="#d97706"/>
<g fill="#16a34a"><circle cx="511" cy="163" r="8"/><circle cx="525" cy="159" r="8"/><circle cx="539" cy="163" r="8"/><circle cx="770" cy="163" r="8"/><circle cx="784" cy="159" r="8"/><circle cx="798" cy="163" r="8"/></g>
<g fill="#334155" font-size="12.5"><text x="45" y="311">P = growing peptide</text><text x="368" y="311">Chain is now on A-site tRNA</text><text x="693" y="311">Old tRNA leaves via E site</text></g>
<g fill="#64748b" font-size="30" font-weight="700"><text x="327" y="222">›</text><text x="652" y="222">›</text></g>
<text x="30" y="373" fill="#0f172a" font-size="14" font-weight="600">A-site tRNA moves to P; the emptied P-site tRNA moves to E. The growing polypeptide is extended at its C-terminus.</text>
</g></svg>