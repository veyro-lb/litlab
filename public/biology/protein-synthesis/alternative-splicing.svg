<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">Alternative splicing selects exons</title><desc id="desc">Original three-exon pre-mRNA model: all introns removed; mature mRNA A retains exons 1 2 3 whereas B retains exons 1 and 3. This is a conceptual example, not a named gene.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="760" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Alternative splicing selects exons</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">One gene · different mature mRNA products</text><rect x="50" y="135" width="134" height="58" rx="12" fill="#316aaf" stroke="#316aaf" stroke-width="2"/><text x="117" y="173" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 1</text><rect x="231" y="135" width="134" height="58" rx="12" fill="#147d83" stroke="#147d83" stroke-width="2"/><text x="298" y="173" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 2</text><rect x="412" y="135" width="134" height="58" rx="12" fill="#b84c6f" stroke="#b84c6f" stroke-width="2"/><text x="479" y="173" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 3</text><path d="M187 164H227" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M368 164H408" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="118" font-size="17" fill="#163d48" text-anchor="middle" font-weight="400">intron</text><text x="389" y="118" font-size="17" fill="#163d48" text-anchor="middle" font-weight="400">intron</text><path d="M184 215L159 301" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M416 215L442 467" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="30" y="284" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">Splicing pattern A</text><rect x="50" y="309" width="145" height="58" rx="12" fill="#316aaf" stroke="#316aaf" stroke-width="2"/><text x="122" y="347" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 1</text><rect x="210" y="309" width="145" height="58" rx="12" fill="#147d83" stroke="#147d83" stroke-width="2"/><text x="282" y="347" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 2</text><rect x="370" y="309" width="145" height="58" rx="12" fill="#b84c6f" stroke="#b84c6f" stroke-width="2"/><text x="442" y="347" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 3</text><text x="30" y="452" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">Splicing pattern B</text><rect x="130" y="483" width="155" height="58" rx="12" fill="#316aaf" stroke="#316aaf" stroke-width="2"/><text x="207" y="521" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 1</text><rect x="304" y="483" width="155" height="58" rx="12" fill="#b84c6f" stroke="#b84c6f" stroke-width="2"/><text x="381" y="521" font-size="21" fill="#fff" text-anchor="middle" font-weight="400">Exon 3</text><text x="30" y="602" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Introns are removed in both products. Exon</text><text x="30" y="630" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">2 is included in A and skipped in B.</text><text x="30" y="683" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Different exon combinations can encode</text><text x="30" y="711" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">different protein variants. Simplified</text><text x="30" y="739" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">model.</text></g></svg>