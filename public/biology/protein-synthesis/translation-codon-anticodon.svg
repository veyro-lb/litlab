<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Antiparallel codon anticodon matching and ribosomal translation direction</title>
<desc id="desc">An mRNA runs left to right 5 prime AUG GCU UAA 3 prime. Ribosome P site is above codon AUG and A site above GCU. Anticodons pair antiparallel, 3 prime UAC 5 prime with AUG and 3 prime CGA 5 prime with GCU. Methionine and alanine are attached to separate tRNAs; the ribosome will make a peptide bond and move 5 prime toward 3 prime. UAA is a stop signal, not an amino acid. Original schematic is not a molecular-scale structural drawing.</desc>
<rect width="1040" height="500" rx="18" fill="#f6faff"/>
<text x="30" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#163d5d">Read mRNA 5′→3′; pair tRNA anticodons antiparallel</text>
<ellipse cx="485" cy="243" rx="270" ry="144" fill="#e1ecf6" stroke="#719bbe" stroke-width="4"/>
<rect x="326" y="144" width="122" height="185" rx="18" fill="#f1f7fc" stroke="#6591b4" stroke-width="3"/>
<rect x="484" y="144" width="122" height="185" rx="18" fill="#f1f7fc" stroke="#6591b4" stroke-width="3"/>
<g font-family="Arial,sans-serif" font-size="23" fill="#254866" font-weight="700"><text x="366" y="179">P site</text><text x="519" y="179">A site</text></g>
<g stroke="#168678" stroke-width="5" fill="none" stroke-linecap="round"><path d="M386 289V236M543 289V236"/><path d="M360 231Q385 204 413 231M517 231Q542 204 571 231"/></g>
<g font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><text x="386" y="208" fill="#126a65" font-weight="700">Met</text><text x="544" y="208" fill="#126a65" font-weight="700">Ala</text><text x="386" y="320" fill="#285e80">3′ UAC 5′</text><text x="545" y="320" fill="#285e80">3′ CGA 5′</text></g>
<g stroke="#9d5b39" stroke-width="3" stroke-dasharray="4 5"><line x1="359" y1="330" x2="359" y2="353"/><line x1="386" y1="330" x2="386" y2="353"/><line x1="413" y1="330" x2="413" y2="353"/><line x1="518" y1="330" x2="518" y2="353"/><line x1="545" y1="330" x2="545" y2="353"/><line x1="572" y1="330" x2="572" y2="353"/></g>
<rect x="271" y="355" width="510" height="57" rx="8" fill="#cfebee" stroke="#2e8193" stroke-width="3"/>
<g font-family="Arial,monospace" font-size="27" fill="#185b72" font-weight="700"><text x="289" y="392">5′</text><text x="340" y="392">AUG</text><text x="497" y="392">GCU</text><text x="653" y="392">UAA</text><text x="741" y="392">3′</text></g>
<path d="M813 382H965m-18-14l18 14-18 14" fill="none" stroke="#bd7652" stroke-width="4"/>
<text x="797" y="351" font-family="Arial,sans-serif" font-size="17" fill="#945a39">Ribosome movement</text>
<text x="29" y="452" font-family="Arial,sans-serif" font-size="18" fill="#324e64">AUG → methionine; GCU → alanine; UAA → STOP (no amino acid).</text>
<text x="29" y="479" font-family="Arial,sans-serif" font-size="16" fill="#52677c">Schematic: stage shown is codon recognition, before peptide transfer or translocation; not to scale.</text>
</svg>