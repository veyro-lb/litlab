<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title descr" viewBox="0 0 480 532" width="480" height="532">
<title id="title">Original LitLab molecular recognition schematic</title>
<desc id="descr">Three schematic carbohydrate ring representations: ribose five carbon atoms with a five-membered ring, glucose six carbon atoms with a six-membered ring, fructose six carbon atoms with a five-membered ring. Oxygen occupies one corner of each ring; exocyclic carbon atoms must be counted. Atom substitutions, hydroxyl groups and full stereochemistry are omitted.</desc>
<rect width="480" height="532" rx="16" fill="#fcfdfb"/>
<text x="22" y="30" fill="#1e4551" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Pentose or hexose? Count carbon atoms</text><rect x="18" y="45" width="444" height="139" rx="12" fill="#f1f6f8" stroke="#cbdede" stroke-width="1"/><text x="33" y="70" fill="#18515c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Ribose (pentose): 5 carbons</text><path d="M 123 84 L 157 103 L 146 138 L 99 138 L 88 103 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="85" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">O</text><text x="157" y="92" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C1</text><text x="146" y="127" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C2</text><text x="99" y="127" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C3</text><text x="88" y="92" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C4</text><line data-bond="ribose-C4-C5" x1="88" y1="103" x2="51" y2="119" stroke="#3b6975" stroke-width="2.3" stroke-linecap="round"/><text x="48" y="137" fill="#765b22" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">C5</text><text x="31" y="166" fill="#49666b" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">4 ring carbons + 1 outside carbon = 5.</text><rect x="18" y="194" width="444" height="139" rx="12" fill="#eef6f3" stroke="#cbdede" stroke-width="1"/><text x="33" y="219" fill="#18515c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Glucose (hexose): 6 carbons</text><path d="M 125 236 L 163 245 L 173 278 L 144 306 L 104 299 L 92 262 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="238" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">O</text><text x="163" y="234" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C1</text><text x="173" y="267" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C2</text><text x="144" y="295" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C3</text><text x="104" y="288" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C4</text><text x="92" y="251" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C5</text><line x1="92" y1="262" x2="55" y2="264" stroke="#3b6975" stroke-width="2.3" stroke-linecap="round"/><text x="55" y="252" fill="#765b22" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">C6</text><text x="31" y="315" fill="#49666b" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">5 ring carbons + 1 outside carbon = 6.</text><rect x="18" y="343" width="444" height="139" rx="12" fill="#f1f6f8" stroke="#cbdede" stroke-width="1"/><text x="33" y="368" fill="#18515c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Fructose (hexose): 6 carbons</text><path d="M 123 385 L 158 404 L 145 440 L 99 440 L 89 404 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="387" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">O</text><text x="158" y="393" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C2</text><text x="145" y="429" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C3</text><text x="99" y="429" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C4</text><text x="89" y="393" fill="#315b71" font-family="Arial,sans-serif" font-size="14" stroke="#fcfdfb" stroke-width="3" paint-order="stroke" font-weight="700" text-anchor="middle">C5</text><line data-bond="fructose-C2-C1" x1="158" y1="404" x2="193" y2="404" stroke="#3b6975" stroke-width="2.3" stroke-linecap="round"/><text x="193" y="396" fill="#765b22" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">C1</text><line data-bond="fructose-C5-C6" x1="89" y1="404" x2="57" y2="408" stroke="#3b6975" stroke-width="2.3" stroke-linecap="round"/><text x="57" y="399" fill="#765b22" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">C6</text><text x="31" y="464" fill="#49666b" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">4 ring carbons + 2 outside carbons = 6.</text><text x="22" y="511" fill="#4d6970" font-family="Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Simplified ring connectivity; atom groups/OH omitted.</text>
</svg>
