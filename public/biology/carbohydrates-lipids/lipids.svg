<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle figDesc" viewBox="0 0 480 482" width="480" height="482">
<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Upper: glycerol backbone linked to three fatty-acid tails in triglyceride. Lower: glycerol backbone linked to two fatty-acid tails and a phosphate-containing head in a schematic phospholipid. Bonds are conceptual, not complete atomic structures.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="34" font-size="19" font-weight="700" text-anchor="start" fill="#193c45">Same glycerol scaffold; different components</text><text x="22" y="68" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">TRIGLYCERIDE</text><text x="22" y="88" font-size="13" font-weight="500" text-anchor="start" fill="#193c45">Three fatty-acid residues</text><rect x="24" y="107" width="110" height="148" rx="12" fill="#e0edf3" stroke="#87ada5" stroke-width="1.5"/><text x="79" y="188" font-size="15" font-weight="700" text-anchor="middle" fill="#193c45">Glycerol</text><line x1="134" y1="135" x2="161" y2="135" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="120" width="291" height="30" rx="12" fill="#e7edd4" stroke="#87ada5" stroke-width="1.5"/><text x="306" y="140" font-size="15" font-weight="500" text-anchor="middle" fill="#193c45">Fatty-acid tail 1</text><line x1="134" y1="179" x2="161" y2="179" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="164" width="291" height="30" rx="12" fill="#e7edd4" stroke="#87ada5" stroke-width="1.5"/><text x="306" y="184" font-size="15" font-weight="500" text-anchor="middle" fill="#193c45">Fatty-acid tail 2</text><line x1="134" y1="223" x2="161" y2="223" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="208" width="291" height="30" rx="12" fill="#e7edd4" stroke="#87ada5" stroke-width="1.5"/><text x="306" y="228" font-size="15" font-weight="500" text-anchor="middle" fill="#193c45">Fatty-acid tail 3</text><text x="22" y="290" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">PHOSPHOLIPID</text><text x="22" y="309" font-size="13" font-weight="500" text-anchor="start" fill="#193c45">Two tails + phosphate-containing head</text><rect x="24" y="326" width="110" height="134" rx="12" fill="#e0edf3" stroke="#87ada5" stroke-width="1.5"/><text x="79" y="399" font-size="15" font-weight="700" text-anchor="middle" fill="#193c45">Glycerol</text><line x1="134" y1="351" x2="161" y2="351" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="336" width="291" height="29" rx="12" fill="#ffe4ca" stroke="#87ada5" stroke-width="1.5"/><text x="307" y="356" font-size="14" font-weight="600" text-anchor="middle" fill="#193c45">Phosphate-containing head</text><line x1="134" y1="392" x2="161" y2="392" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="377" width="291" height="29" rx="12" fill="#e7edd4" stroke="#87ada5" stroke-width="1.5"/><text x="307" y="397" font-size="14" font-weight="600" text-anchor="middle" fill="#193c45">Fatty-acid tail 1</text><line x1="134" y1="433" x2="161" y2="433" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="161" y="418" width="291" height="29" rx="12" fill="#e7edd4" stroke="#87ada5" stroke-width="1.5"/><text x="307" y="438" font-size="14" font-weight="600" text-anchor="middle" fill="#193c45">Fatty-acid tail 2</text>
</svg>
