<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" role="img" aria-labelledby="t d"><title id="t">Triglyceride and glycerophospholipid chemical connectivity</title><desc id="d">Original schematic structural formula showing glycerol carbon positions and ester groups to fatty acids. Upper has three fatty-acyl esters, lower has two fatty-acyl esters plus a phosphate ester with polar substituent X. R groups are abbreviated hydrocarbon chains.</desc><rect width="900" height="595" rx="16" fill="#fbfdfb"/><text x="35" y="43" fill="#173b47" font-size="26" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700">One glycerol backbone, two different lipid structures</text><rect x="36" y="64" width="828" height="226" rx="14" fill="#f1f7f9" stroke="#9fbfbd"/><text x="58" y="95" fill="#165e68" font-size="21" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700">TRIGLYCERIDE • 3 fatty-acyl residues</text><text x="106" y="138" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH₂</text><text x="176" y="138" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–C(=O)–R1</text><text x="106" y="192" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH</text><text x="176" y="192" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–C(=O)–R2</text><text x="106" y="246" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH₂</text><text x="176" y="246" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–C(=O)–R3</text><path d="M137 151 V178 M137 205 V232" stroke="#183b47" stroke-width="2.4"/><rect x="36" y="309" width="828" height="228" rx="14" fill="#f5f8ec" stroke="#a7bd97"/><text x="58" y="342" fill="#35644b" font-size="21" font-family="Arial,DejaVu Sans,sans-serif" font-weight="700">GLYCEROPHOSPHOLIPID • 2 acyl residues + phosphate</text><text x="106" y="382" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH₂</text><text x="176" y="382" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–C(=O)–R1</text><text x="106" y="436" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH</text><text x="176" y="436" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–C(=O)–R2</text><text x="106" y="490" fill="#183b47" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">CH₂</text><text x="176" y="490" fill="#86531c" font-size="29" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">–O–P(=O)(O⁻)–O–X</text><path d="M137 394 V420 M137 448 V474" stroke="#183b47" stroke-width="2.4"/><text x="48" y="568" fill="#365e67" font-size="18" font-family="Arial,DejaVu Sans,sans-serif" font-weight="500">R₁–R₃ = fatty-acid hydrocarbon chains     X = polar head group     –O–C(=O)– = ester link</text></svg>
