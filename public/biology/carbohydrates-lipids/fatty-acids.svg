<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title descr" viewBox="0 0 480 373" width="480" height="373">
<title id="title">Original LitLab molecular recognition schematic</title>
<desc id="descr">Schematic saturated hydrocarbon chain has no carbon-carbon double bonds and adopts a comparatively straight zig-zag. Cis-monounsaturated hydrocarbon chain has a carbon-carbon double bond, represented by two parallel lines, and a bend that reduces close packing. Polyunsaturated means two or more double bonds. Chains are conceptual and not atomic structural formulas.</desc>
<rect width="480" height="373" rx="16" fill="#fcfdfb"/>
<text x="22" y="32" fill="#1e4551" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Spot the C=C bond and predict packing</text><rect x="18" y="54" width="444" height="105" rx="12" fill="#eaf5ec" stroke="#cbdede" stroke-width="1"/><text x="30" y="80" fill="#285b58" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Saturated: zero C=C bonds</text><path d="M 33 121 L 82 96 L 131 121 L 180 96 L 229 121 L 278 96 L 326 121 L 377 96 L 427 121" fill="none" stroke="#51866d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="148" fill="#536a69" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Straight-ish chains can pack comparatively closely.</text><rect x="18" y="174" width="444" height="119" rx="12" fill="#f7f2e6" stroke="#cbdede" stroke-width="1"/><text x="30" y="199" fill="#825722" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Cis-monounsaturated: one C=C bond</text><path d="M 33 238 L 85 213 L 137 238 L 183 212" fill="none" stroke="#b47b33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="183" y1="212" x2="222" y2="236" stroke="#b47b33" stroke-width="3.7" stroke-linecap="round"/><line x1="179" y1="218" x2="218" y2="242" stroke="#b47b33" stroke-width="1.8" stroke-linecap="round"/><path d="M 222 236 L 250 267 L 304 276 L 353 260 L 414 284" fill="none" stroke="#b47b33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="285" fill="#5b665f" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">A cis C=C kink tends to reduce packing.</text><text x="22" y="321" fill="#315e6e" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">Polyunsaturated means two or more C=C bonds.</text><text x="22" y="350" fill="#52666e" font-family="Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Chain length and cis/trans geometry also matter.</text>
</svg>
