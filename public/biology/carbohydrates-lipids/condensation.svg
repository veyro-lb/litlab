<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle figDesc" viewBox="0 0 480 314" width="480" height="314">
<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Diagram compares condensation linking monomers with release of water, versus hydrolysis splitting a covalent linkage by consuming water.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="24" y="36" font-size="20" font-weight="700" text-anchor="start" fill="#193c45">Condensation joins; hydrolysis splits</text><rect x="26" y="66" width="196" height="66" rx="12" fill="#e8f6f1" stroke="#87ada5" stroke-width="1.5"/><text x="124" y="92" font-size="16" font-weight="700" text-anchor="middle" fill="#193c45">Monomer + monomer</text><text x="124" y="117" font-size="13" font-weight="500" text-anchor="middle" fill="#49656b">reacting groups</text><rect x="256" y="66" width="196" height="66" rx="12" fill="#e8f6f1" stroke="#87ada5" stroke-width="1.5"/><text x="354" y="93" font-size="17" font-weight="700" text-anchor="middle" fill="#193c45">Linked product</text><text x="354" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#276c68">+ H₂O released</text><line x1="222" y1="100" x2="251" y2="100" stroke="#b46e31" stroke-width="3"  stroke-linecap="round"/><text x="236" y="87" font-size="22" font-weight="700" text-anchor="middle" fill="#b46e31">→</text><text x="24" y="173" font-size="17" font-weight="700" text-anchor="start" fill="#193c45">HYDROLYSIS</text><line x1="26" y1="184" x2="453" y2="184" stroke="#b8d5d0" stroke-width="2"  stroke-linecap="round"/><rect x="26" y="202" width="195" height="58" rx="12" fill="#e8f6f1" stroke="#87ada5" stroke-width="1.5"/><rect x="257" y="202" width="195" height="58" rx="12" fill="#e8f6f1" stroke="#87ada5" stroke-width="1.5"/><text x="124" y="222" font-size="15" font-weight="700" text-anchor="middle" fill="#193c45">Linked molecule</text><text x="124" y="246" font-size="14" font-weight="600" text-anchor="middle" fill="#193c45">+ H₂O consumed</text><text x="354" y="237" font-size="15" font-weight="700" text-anchor="middle" fill="#193c45">Separate monomers</text><line x1="222" y1="230" x2="253" y2="230" stroke="#b46e31" stroke-width="3"  stroke-linecap="round"/><text x="238" y="217" font-size="21" font-weight="700" text-anchor="middle" fill="#b46e31">→</text><text x="24" y="292" font-size="13" font-weight="500" text-anchor="start" fill="#526c70">Reaction logic: water is released to join, used to split.</text>
</svg>
