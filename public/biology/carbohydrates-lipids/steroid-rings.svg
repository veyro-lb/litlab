<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title descr" viewBox="0 0 480 370" width="480" height="370">
<title id="title">Original LitLab molecular recognition schematic</title>
<desc id="descr">A simplified steroid core comprising three angularly fused six-membered carbon rings labelled A, B and C, and one fused five-membered ring labelled D. The framework is characteristic of steroids including oestradiol and testosterone. Hydrogen atoms, double bonds and substituents are intentionally omitted.</desc>
<rect width="480" height="370" rx="16" fill="#fcfdfb"/>
<text x="22" y="33" fill="#1e4551" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Recognize the fused-ring steroid nucleus</text><rect x="18" y="52" width="444" height="206" rx="12" fill="#eef6f3" stroke="#cbdede" stroke-width="1"/><text x="80" y="190" fill="#185e69" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">A</text><text x="150" y="190" fill="#185e69" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">B</text><text x="185" y="130" fill="#185e69" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">C</text><text x="250" y="125" fill="#185e69" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">D</text><text x="23" y="289" fill="#1c525d" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Three six-membered rings + one five-membered ring.</text><text x="23" y="319" fill="#49666b" font-family="Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Oestradiol and testosterone share this nucleus.</text><text x="23" y="349" fill="#49666b" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">This is the ring framework; substituents are not shown.</text>
<path data-ring="A" d="M 45 165 L 80 145 L 115 165 L 115 205 L 80 225 L 45 205 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linejoin="round"/><path data-ring="B" d="M 115 165 L 150 145 L 185 165 L 185 205 L 150 225 L 115 205 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linejoin="round"/><path data-ring="C" d="M 150 145 L 150 105 L 185 85 L 220 105 L 220 145 L 185 165 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linejoin="round"/><path data-ring="D" d="M 220 105 L 255 85 L 285 115 L 270 150 L 220 145 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linejoin="round"/></svg>
