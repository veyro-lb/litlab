<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title descr" viewBox="0 0 480 370" width="480" height="370">
<title id="title">Original LitLab molecular recognition schematic</title>
<desc id="descr">A simplified steroid core comprising three fused six-membered carbon rings labelled A, B and C, and one fused five-membered ring labelled D. The framework is characteristic of steroids including oestradiol and testosterone. Hydrogen atoms, double bonds and substituents are intentionally omitted.</desc>
<rect width="480" height="370" rx="16" fill="#fcfdfb"/>
<text x="22" y="33" fill="#1e4551" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Recognize the fused-ring steroid nucleus</text><rect x="18" y="52" width="444" height="206" rx="12" fill="#eef6f3" stroke="#cbdede" stroke-width="1"/><path d="M 102 98 L 149.6 125.5 L 149.6 180.5 L 102 208 L 54.4 180.5 L 54.4 125.5 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 197.3 98 L 244.9 125.5 L 244.9 180.5 L 197.3 208 L 149.7 180.5 L 149.7 125.5 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 292.6 98 L 340.2 125.5 L 340.2 180.5 L 292.6 208 L 245 180.5 L 245 125.5 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 340.2 125.5 L 379 111 L 408 152 L 379 193 L 340.2 180.5 Z" fill="none" stroke="#3b6975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="234" fill="#185e69" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text><text x="197" y="234" fill="#185e69" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">B</text><text x="293" y="234" fill="#185e69" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">C</text><text x="378" y="234" fill="#185e69" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">D</text><text x="23" y="289" fill="#1c525d" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Three six-membered rings + one five-membered ring.</text><text x="23" y="319" fill="#49666b" font-family="Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Oestradiol and testosterone share this nucleus.</text><text x="23" y="349" fill="#49666b" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">This is the ring framework; substituents are not shown.</text>
</svg>
