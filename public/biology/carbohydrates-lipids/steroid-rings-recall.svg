<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title descr" viewBox="0 0 480 370" width="480" height="370">
<title id="title">Unlabelled recall schematic</title>
<desc id="descr">A simplified steroid core comprising three fused six-membered carbon rings labelled A, B and C, and one fused five-membered ring labelled D. The framework is characteristic of steroids including oestradiol and testosterone. Hydrogen atoms, double bonds and substituents are intentionally omitted.</desc>
<rect width="480" height="370" rx="16" fill="#fcfdfb"/>
