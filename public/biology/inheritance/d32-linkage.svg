<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><rect width="840" height="380" rx="24" fill="#f7fbfc"/><style>text{font:17px system-ui,Arial;fill:#143d49}.head{font-weight:700;font-size:23px}.sub{font-size:14px;fill:#426878}.lab{font-weight:700;fill:#076a75}</style><text x="38" y="45" class="head">Autosomal linkage: AB / ab</text><text x="38" y="75" class="sub">Two homologues in coupling phase</text><line x1="250" y1="115" x2="250" y2="282" stroke="#238f9b" stroke-width="14" stroke-linecap="round"/><line x1="400" y1="115" x2="400" y2="282" stroke="#238f9b" stroke-width="14" stroke-linecap="round"/><text x="272" y="150" class="lab">A</text><text x="422" y="150" class="lab">a</text><text x="272" y="252" class="lab">B</text><text x="422" y="252" class="lab">b</text><text x="505" y="160">Parental: AB, ab</text><text x="505" y="223">Crossovers: Ab, aB</text><text x="38" y="335" class="sub">Recombinants require exchange between loci, not mutation of the alleles.</text></svg>