<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-label="Monohybrid cross: Aa × Aa"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#317a75"/></marker></defs><rect width="1160" height="500" fill="#fff" rx="20"/><text x="36" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173c3a">Monohybrid cross: Aa × Aa</text><text x="100" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#173c3a">Each parent produces A and a gametes with equal probability.</text><rect x="345" y="180" width="158" height="87" rx="14" fill="#e7f3eb" stroke="#a7c9c2" stroke-width="1.5"/><text x="401" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173c3a">AA</text><rect x="525" y="180" width="158" height="87" rx="14" fill="#edf2fa" stroke="#a7c9c2" stroke-width="1.5"/><text x="581" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173c3a">Aa</text><rect x="345" y="285" width="158" height="87" rx="14" fill="#edf2fa" stroke="#a7c9c2" stroke-width="1.5"/><text x="401" y="338" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173c3a">Aa</text><rect x="525" y="285" width="158" height="87" rx="14" fill="#e7f3eb" stroke="#a7c9c2" stroke-width="1.5"/><text x="581" y="338" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173c3a">aa</text><text x="403" y="169" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">A</text><text x="585" y="169" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">a</text><text x="306" y="232" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">A</text><text x="306" y="337" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">a</text><rect x="750" y="183" width="350" height="202" rx="14" fill="#ebf5f2" stroke="#a7c9c2" stroke-width="1.5"/><text x="778" y="235" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">Genotypes: 1 AA : 2 Aa : 1 aa</text><text x="778" y="289" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#173c3a">Phenotypes (A dominant):</text><text x="778" y="327" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173c3a">3 dominant : 1 recessive</text><text x="45" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">Expected probabilities for independent offspring; four births need not match the exact ratio.</text></svg>