<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="title desc"><title id="title">Pedigrees constrain possible genotypes</title><desc id="desc">Constructed two-generation autosomal recessive pedigree. Unaffected father and mother, each Aa, have four illustrative children: affected male aa, unaffected female AA or Aa, unaffected male AA or Aa, affected female aa. Symbols indicate sex and phenotype, not severity. Each child has independent one-quarter risk of aa; the observed sample need not equal the expected ratio.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="765" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Pedigrees constrain possible genotypes</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Autosomal recessive model · constructed family</text><text x="153" y="132" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">I-1</text><text x="423" y="132" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">I-2</text><rect x="127" y="158" width="52" height="52" rx="0" fill="#fff" stroke="#163d48" stroke-width="2"/><circle cx="423" cy="184" r="27" fill="#fff" stroke="#163d48" stroke-width="2"/><path d="M181 184H394" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 184V328H93M288 328H507" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="244" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">Aa</text><text x="423" y="244" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">Aa</text><path d="M93 328V391" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="93" y="303" font-size="19" fill="#163d48" text-anchor="middle" font-weight="400">II-1</text><rect x="67" y="392" width="52" height="52" rx="0" fill="#163d48" stroke="#163d48" stroke-width="2"/><text x="93" y="485" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">aa</text><path d="M231 328V391" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="231" y="303" font-size="19" fill="#163d48" text-anchor="middle" font-weight="400">II-2</text><circle cx="231" cy="418" r="27" fill="#fff" stroke="#163d48" stroke-width="2"/><text x="231" y="485" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">A–</text><path d="M369 328V391" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="369" y="303" font-size="19" fill="#163d48" text-anchor="middle" font-weight="400">II-3</text><rect x="343" y="392" width="52" height="52" rx="0" fill="#fff" stroke="#163d48" stroke-width="2"/><text x="369" y="485" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">A–</text><path d="M507 328V391" fill="none" stroke="#163d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="507" y="303" font-size="19" fill="#163d48" text-anchor="middle" font-weight="400">II-4</text><circle cx="507" cy="418" r="27" fill="#163d48" stroke="#163d48" stroke-width="2"/><text x="507" y="485" font-size="23" fill="#163d48" text-anchor="middle" font-weight="400">aa</text><text x="28" y="541" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Square: male · circle: female · filled: affected</text><text x="28" y="588" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Unaffected parents can both carry a</text><text x="28" y="616" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">recessive allele. A– means AA or Aa:</text><text x="28" y="644" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">appearance alone cannot distinguish them.</text><text x="28" y="687" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Each child has a 1/4 chance of aa in this</text><text x="28" y="714" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">cross. A small family need not show an exact</text><text x="28" y="741" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3:1 outcome.</text></g></svg>