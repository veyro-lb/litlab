<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 395" role="img" aria-labelledby="ttl dsc"><title id="ttl">Original schematic of a single DNA base substitution in beta-globin</title><desc id="dsc">Illustrative beta globin coding DNA triplet 5 prime GAG 3 prime encodes glutamate via mRNA GAG. A single A to T DNA coding substitution gives 5 prime GTG 3 prime, mRNA GUG and valine. The reading frame remains unchanged.</desc><rect width="950" height="395" fill="#f5faff"/><text x="36" y="48" font-size="25" font-family="sans-serif" fill="#1c4365" font-weight="700">One substituted base can change one amino acid</text><rect x="35" y="78" width="390" height="260" rx="16" fill="white" stroke="#85afcd"/><rect x="520" y="78" width="390" height="260" rx="16" fill="white" stroke="#b5a6c8"/><text x="62" y="117" font-size="22" font-family="sans-serif">Before mutation</text><text x="545" y="117" font-size="22" font-family="sans-serif">After DNA substitution</text><text x="62" y="165" font-size="21" font-family="monospace">coding DNA 5′ GAG 3′</text><text x="545" y="165" font-size="21" font-family="monospace">coding DNA 5′ GTG 3′</text><text x="62" y="216" font-size="21" font-family="monospace">mRNA 5′ GAG 3′</text><text x="545" y="216" font-size="21" font-family="monospace">mRNA 5′ GUG 3′</text><text x="62" y="274" font-size="23" font-family="sans-serif" fill="#1d7f78">Glutamate (Glu)</text><text x="545" y="274" font-size="23" font-family="sans-serif" fill="#8557a5">Valine (Val)</text><path d="M440 211 H500" stroke="#3b5470" stroke-width="5"/><path d="M483 199 L502 211 L483 223" stroke="#3b5470" stroke-width="5" fill="none"/><text x="36" y="374" font-size="17" font-family="sans-serif">HBB example: a single substitution changes codon meaning without shifting the reading frame.</text></svg>