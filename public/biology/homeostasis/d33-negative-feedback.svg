<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 360" width="1030" height="360" role="img"><rect width="1030" height="360" fill="#f7fbfa" rx="22"/><style>text{font:17px system-ui;fill:#184854}.head{font-size:24px;font-weight:700}.small{font-size:14px;fill:#45717b}.box{fill:#e1f3f1;stroke:#65aeb4;stroke-width:2}</style><text x="27" y="39" class="head">Negative feedback: correction of the error</text><rect class="box" x="40" y="105" width="185" height="65" rx="12"/><text x="52" y="136">Stimulus: ↑ variable</text><path d="M225 137 L244 137" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M236 132 L244 137 L236 142" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="252" y="105" width="185" height="65" rx="12"/><text x="264" y="136">Receptor senses ↑</text><path d="M437 137 L456 137" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M448 132 L456 137 L448 142" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="464" y="105" width="185" height="65" rx="12"/><text x="476" y="136">Control system</text><path d="M649 137 L668 137" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M660 132 L668 137 L660 142" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="676" y="105" width="185" height="65" rx="12"/><text x="688" y="136">Effector activated</text><path d="M861 137 L864 137" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M856 132 L864 137 L856 142" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="872" y="105" width="138" height="65" rx="12"/><text x="884" y="131" font-size="16">Variable</text><text x="884" y="153" font-size="16">decreases</text><text x="40" y="240" class="small">When the variable is too low, the control system activates opposing effectors to raise it.</text><text x="40" y="278">Example: ↑ temperature → thermoreceptors → hypothalamus → sweating → ↓ temperature</text><text x="40" y="310" class="small">Sensor detects • Controller integrates • Effector acts • Response opposes disturbance</text></svg>