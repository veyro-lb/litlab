<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 773" role="img" aria-labelledby="title desc"><title id="title">Loop of Henle builds a gradient</title><desc id="desc">Countercurrent schematic with descending filtrate on left, ascending limb on right and collecting duct further right. Water exits descending limb; ascending limb pumps sodium into medulla and is water-impermeable. Increasing medullary osmotic concentration enables collecting duct water reabsorption when ADH increases permeability. No fabricated numerical gradient.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="773" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Loop of Henle builds a gradient</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Cortex above; medullary concentration rises below</text><rect x="28" y="126" width="544" height="120" rx="0" fill="#edf5ef" stroke="#edf5ef" stroke-width="2"/><rect x="28" y="246" width="544" height="120" rx="0" fill="#e2eee6" stroke="#e2eee6" stroke-width="2"/><rect x="28" y="366" width="544" height="120" rx="0" fill="#d4e4db" stroke="#d4e4db" stroke-width="2"/><rect x="28" y="486" width="544" height="120" rx="0" fill="#c1d5ca" stroke="#c1d5ca" stroke-width="2"/><text x="37" y="114" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Descending</text><text x="251" y="114" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Ascending</text><text x="443" y="114" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Collecting</text><path d="M132 150V499Q132 556 212 556Q292 556 292 499V150" fill="none" stroke="#316aaf" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 170V480" fill="none" stroke="#163d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#163d48)"/><path d="M292 480V170" fill="none" stroke="#163d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#163d48)"/><path d="M492 149V559" fill="none" stroke="#4c8759" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 170V539" fill="none" stroke="#163d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#163d48)"/><path d="M147 249H208" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="169" y="235" font-size="18" fill="#316aaf" text-anchor="start" font-weight="400">H₂O</text><path d="M307 249H374" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="328" y="235" font-size="18" fill="#a87013" text-anchor="start" font-weight="400">Na⁺</text><path d="M477 249H411" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><path d="M147 369H208" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="169" y="355" font-size="18" fill="#316aaf" text-anchor="start" font-weight="400">H₂O</text><path d="M307 369H374" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="328" y="355" font-size="18" fill="#a87013" text-anchor="start" font-weight="400">Na⁺</text><path d="M477 369H411" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><path d="M147 489H208" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="169" y="475" font-size="18" fill="#316aaf" text-anchor="start" font-weight="400">H₂O</text><path d="M307 489H374" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="328" y="475" font-size="18" fill="#a87013" text-anchor="start" font-weight="400">Na⁺</text><path d="M477 489H411" fill="none" stroke="#316aaf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="30" y="644" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">Descending limb: water leaves by osmosis.</text><text x="30" y="677" font-size="20" fill="#a87013" text-anchor="start" font-weight="400">Ascending limb: Na⁺ pumped out; not water.</text><text x="30" y="710" font-size="19" fill="#163d48" text-anchor="start" font-weight="400">Gradient permits collecting-duct water reabsorption.</text><text x="30" y="740" font-size="19" fill="#4c8759" text-anchor="start" font-weight="400">ADH regulates collecting-duct water permeability.</text></g></svg>