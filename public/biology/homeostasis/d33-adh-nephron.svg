<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 360" width="1030" height="360" role="img"><rect width="1030" height="360" fill="#f7fbfa" rx="22"/><style>text{font:17px system-ui;fill:#184854}.head{font-size:24px;font-weight:700}.small{font-size:14px;fill:#45717b}.box{fill:#e1f3f1;stroke:#65aeb4;stroke-width:2}</style><text x="29" y="39" class="head">ADH: osmoreceptors to collecting duct</text><rect class="box" x="24" y="107" width="192" height="73" rx="12"/><text x="36" y="138">Plasma osmolarity ↑</text><path d="M216 143 L217 143" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M209 138 L217 143 L209 148" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="224" y="107" width="192" height="73" rx="12"/><text x="236" y="138">Hypothalamus senses</text><path d="M416 143 L438 143" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M430 138 L438 143 L430 148" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="445" y="107" width="192" height="73" rx="12"/><text x="457" y="138">Posterior pituitary ADH ↑</text><path d="M637 143 L681 143" fill="none" stroke="#167c91" stroke-width="2.5"/><path d="M673 138 L681 143 L673 148" fill="none" stroke="#167c91" stroke-width="2"/><rect class="box" x="688" y="107" width="300" height="73" rx="12"/><text x="700" y="138">Apical AQP2 insertion</text><text x="40" y="236">AQP2 ↑ → water permeability ↑ → water recovered by osmosis → osmolarity tends to fall</text><text x="40" y="283" class="small">When osmolarity falls: ADH ↓, AQP2 returns to vesicles, less water reclaimed.</text><text x="40" y="318" class="small">The renal medullary salt gradient drives the osmosis; aquaporins do not pump water.</text></svg>