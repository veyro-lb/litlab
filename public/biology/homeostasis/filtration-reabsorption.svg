<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 759" role="img" aria-labelledby="title desc"><title id="title">Kidney: filter, then selectively return</title><desc id="desc">Functional model, not a nephron anatomical drawing. Hydrostatic pressure filters water and small solutes from glomerular blood into Bowmans capsule; blood cells and large proteins are normally retained. Filtrate passes into proximal tubule, where useful solutes and water are reabsorbed into nearby blood. Remaining filtrate flows to loop of Henle.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="759" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Kidney: filter, then selectively return</text><text x="28" y="77" font-size="18" fill="#163d48" text-anchor="start" font-weight="400">Functional compartments · not an anatomical nephron map</text><rect x="28" y="140" width="200" height="111" rx="12" fill="#f8e1df" stroke="#86ada8" stroke-width="2"/><text x="128.0" y="171" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Blood in the</text><text x="128.0" y="200" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">glomerular capillary</text><rect x="353" y="140" width="219" height="111" rx="12" fill="#e2edf8" stroke="#86ada8" stroke-width="2"/><text x="462.5" y="171" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Bowman’s capsule</text><text x="462.5" y="200" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">filtrate</text><path d="M234 188H341" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="287" y="122" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">Pressure</text><text x="28" y="293" font-size="19" fill="#b84c6f" text-anchor="start" font-weight="400">Cells + large proteins</text><text x="28" y="321" font-size="19" fill="#b84c6f" text-anchor="start" font-weight="400">normally retained</text><text x="352" y="292" font-size="19" fill="#316aaf" text-anchor="start" font-weight="400">Water + small solutes</text><text x="352" y="321" font-size="19" fill="#316aaf" text-anchor="start" font-weight="400">enter the filtrate</text><path d="M464 342V413" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><rect x="353" y="425" width="219" height="111" rx="12" fill="#e2edf8" stroke="#86ada8" stroke-width="2"/><text x="462.5" y="456" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Proximal tubule</text><text x="462.5" y="485" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">filtrate continues</text><rect x="28" y="425" width="200" height="111" rx="12" fill="#f8e1df" stroke="#86ada8" stroke-width="2"/><text x="128.0" y="456" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Blood in nearby</text><text x="128.0" y="485" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">capillaries</text><path d="M341 477H240" fill="none" stroke="#4c8759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#4c8759)"/><text x="287" y="402" font-size="20" fill="#4c8759" text-anchor="middle" font-weight="400">Selective</text><text x="287" y="563" font-size="20" fill="#4c8759" text-anchor="middle" font-weight="400">reabsorption</text><path d="M464 543V610" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="464" y="643" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">To loop of Henle</text><text x="28" y="690" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Useful glucose, ions and water return to</text><text x="28" y="717" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">blood. Unwanted solutes remain for further</text><text x="28" y="744" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">processing and excretion.</text></g></svg>