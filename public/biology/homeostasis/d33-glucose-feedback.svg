<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-label="Blood glucose: two negative-feedback loops"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#317a75"/></marker></defs><rect width="1160" height="500" fill="#fff" rx="20"/><text x="36" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173c3a">Blood glucose: two negative-feedback loops</text><rect x="29" y="133" width="265" height="117" rx="14" fill="#fff0e9" stroke="#a7c9c2" stroke-width="1.5"/><text x="41" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Blood glucose rises</text><path d="M 297 193 L 310 193" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="312" y="133" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="324" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">β-cells release insulin</text><path d="M 580 193 L 593 193" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="595" y="133" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="607" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Uptake and storage</text><text x="607" y="198" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">increase</text><path d="M 863 193 L 876 193" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="878" y="133" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="890" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Glucose falls toward range</text><rect x="29" y="306" width="265" height="117" rx="14" fill="#e9f1fd" stroke="#a7c9c2" stroke-width="1.5"/><text x="41" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Blood glucose falls</text><path d="M 297 366 L 310 366" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="312" y="306" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="324" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">α-cells release glucagon</text><path d="M 580 366 L 593 366" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="595" y="306" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="607" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Liver glucose output</text><text x="607" y="371" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">increases</text><path d="M 863 366 L 876 366" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="878" y="306" width="265" height="117" rx="14" fill="#edf7f3" stroke="#a7c9c2" stroke-width="1.5"/><text x="890" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Glucose rises toward range</text><text x="33" y="476" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">In both cases the response opposes the initial disturbance. Qualitative pathways, not measurements.</text></svg>