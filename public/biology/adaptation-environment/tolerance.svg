<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d"><title id="t">A conceptual tolerance curve</title><desc id="d">A bell-shaped model showing organism performance versus an abiotic variable with lower and upper tolerance limits and an optimum zone; no field observations.</desc><rect width="900" height="450" rx="15" fill="#f8fbfc"/><g font-family="Arial,sans-serif" fill="#173948"><text x="28" y="40" font-size="24">Species performance across an abiotic gradient</text><path d="M106 75 V368 H765" stroke="#295267" stroke-width="3" fill="none"/><text x="280" y="421" font-size="17">Abiotic factor (e.g., salinity, temperature)</text><text x="22" y="68" font-size="17">Performance</text><path d="M125 365 C239 365 263 274 340 187 C388 127 438 115 482 178 C559 273 599 365 742 365" fill="none" stroke="#367d97" stroke-width="7"/><path d="M408 357 V132" stroke="#58a36d" stroke-width="2" stroke-dasharray="6 5"/><text x="356" y="117" font-size="18">Optimum zone</text><text x="108" y="391" font-size="16">Lower limit</text><text x="660" y="391" font-size="16">Upper limit</text><text x="31" y="440" font-size="13">Conceptual response, not a measured species-specific tolerance experiment.</text></g></svg>