<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 540" role="img" aria-labelledby="t d"><title id="t">Conceptual climate controls on biomes</title><desc id="d">Approximate non-exclusive climate fields with x-axis mean annual temperature in degrees Celsius from minus 20 to 35 and y-axis precipitation millimeters per year from zero to 4500. Not measured global data.</desc><rect width="930" height="540" rx="16" fill="#f8fbfc"/><g font-family="Arial,sans-serif" fill="#173948"><text x="29" y="35" font-size="25">Biomes along climatic gradients (schematic)</text><path d="M117 60 V458 H696" fill="none" stroke="#325364" stroke-width="3"/><g stroke="#dbe4e6" stroke-width="1"><path d="M117 458 H696"/><path d="M117 368 H696"/><path d="M117 278 H696"/><path d="M117 188 H696"/><path d="M117 98 H696"/></g><g font-size="14"><text x="61" y="464">0</text><text x="61" y="374">1000</text><text x="61" y="284">2000</text><text x="61" y="194">3000</text><text x="61" y="104">4000</text><text x="111" y="481">-20</text><text x="206" y="481">-10</text><text x="301" y="481">0</text><text x="396" y="481">10</text><text x="491" y="481">20</text><text x="586" y="481">30</text></g><text x="280" y="514" font-size="17">Mean annual temperature (°C)</text><text x="14" y="74" font-size="15">Annual precipitation</text><text x="26" y="92" font-size="15">(mm year⁻¹)</text><g opacity="0.85" stroke="#668d85" stroke-width="2"><rect x="119" y="392" width="174" height="62" rx="12" fill="#b7d3dd"/><rect x="233" y="240" width="144" height="150" rx="12" fill="#85bb8e"/><rect x="338" y="168" width="140" height="170" rx="12" fill="#6ba5a3"/><rect x="531" y="65" width="158" height="216" rx="12" fill="#427e7c"/><rect x="393" y="371" width="232" height="71" rx="12" fill="#d7c494"/><rect x="469" y="443" width="219" height="13" rx="5" fill="#ceae80"/></g><g font-size="16"><text x="148" y="427">Tundra</text><text x="279" y="260">Taiga</text><text x="351" y="197">Temperate</text><text x="351" y="219">forest</text><text x="555" y="98" fill="white">Tropical</text><text x="555" y="120" fill="white">rainforest</text><text x="441" y="406">Grassland</text><text x="509" y="438">Hot desert ↓</text></g><text x="713" y="156" font-size="14">Overlapping</text><text x="713" y="178" font-size="14">model ranges;</text><text x="713" y="200" font-size="14">not empirical</text><text x="713" y="222" font-size="14">observations.</text><text x="43" y="528" font-size="13">Ranges intentionally generalized; soils, precipitation seasonality and disturbance also matter.</text></g></svg>