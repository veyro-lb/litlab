<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">The alpha carbon bonds to four groups: amine (NH2), carboxyl (COOH), hydrogen H, and variable R side chain. At physiological pH ionized forms commonly occur.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="34" font-size="19" font-weight="700" text-anchor="start" fill="#193c45">Generalized amino acid (school-level form)</text><rect x="201" y="137" width="78" height="70" rx="12" fill="#e1f0e9" stroke="#87ada5" stroke-width="1.5"/><text x="240" y="180" font-size="27" font-weight="700" text-anchor="middle" fill="#193c45">Cα</text><line x1="201" y1="172" x2="130" y2="172" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><line x1="279" y1="172" x2="348" y2="172" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><line x1="240" y1="137" x2="240" y2="98" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><line x1="240" y1="207" x2="240" y2="252" stroke="#365f67" stroke-width="3"  stroke-linecap="round"/><rect x="26" y="146" width="104" height="53" rx="12" fill="#d9edf5" stroke="#87ada5" stroke-width="1.5"/><text x="78" y="180" font-size="19" font-weight="700" text-anchor="middle" fill="#193c45">NH₂</text><rect x="348" y="146" width="105" height="53" rx="12" fill="#ffe6cd" stroke="#87ada5" stroke-width="1.5"/><text x="401" y="180" font-size="19" font-weight="700" text-anchor="middle" fill="#193c45">COOH</text><rect x="206" y="56" width="68" height="42" rx="12" fill="#f1e7d9" stroke="#87ada5" stroke-width="1.5"/><text x="240" y="83" font-size="20" font-weight="700" text-anchor="middle" fill="#193c45">H</text><rect x="206" y="252" width="68" height="42" rx="12" fill="#eacfe8" stroke="#87ada5" stroke-width="1.5"/><text x="240" y="279" font-size="21" font-weight="700" text-anchor="middle" fill="#193c45">R</text><text x="24" y="332" font-size="13" font-weight="500" text-anchor="start" fill="#526c70">R changes among amino acids. Group ionization depends on pH.</text>
