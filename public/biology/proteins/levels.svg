<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle figDesc" viewBox="0 0 480 460" width="480" height="460">
<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Four schematic levels: primary as ordered chain, secondary as alpha helices or beta sheets, tertiary as overall three-dimensional fold of one chain, and quaternary as association of multiple polypeptide subunits.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="35" font-size="19" font-weight="700" text-anchor="start" fill="#193c45">Different levels describe different features</text><rect x="20" y="63" width="439" height="79" rx="12" fill="#d0e6f2" stroke="#87ada5" stroke-width="1.5"/><text x="36" y="87" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">1  Primary: exact residue sequence</text><rect x="20" y="155" width="439" height="79" rx="12" fill="#e9e2f2" stroke="#87ada5" stroke-width="1.5"/><text x="36" y="179" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">2  Secondary: helix or sheet</text><rect x="20" y="246" width="439" height="79" rx="12" fill="#dcf0e6" stroke="#87ada5" stroke-width="1.5"/><text x="36" y="270" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">3  Tertiary: one chain's full fold</text><rect x="20" y="337" width="439" height="79" rx="12" fill="#f5e7ce" stroke="#87ada5" stroke-width="1.5"/><text x="36" y="361" font-size="16" font-weight="700" text-anchor="start" fill="#193c45">4  Quaternary: multiple subunits</text><circle cx="52" cy="119" r="10" fill="#70aac4" stroke="#376c80" stroke-width="2"/><line x1="62" y1="119" x2="89" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="99" cy="119" r="10" fill="#a9cade" stroke="#376c80" stroke-width="2"/><line x1="109" y1="119" x2="136" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="146" cy="119" r="10" fill="#70aac4" stroke="#376c80" stroke-width="2"/><line x1="156" y1="119" x2="183" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="193" cy="119" r="10" fill="#a9cade" stroke="#376c80" stroke-width="2"/><line x1="203" y1="119" x2="230" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="240" cy="119" r="10" fill="#70aac4" stroke="#376c80" stroke-width="2"/><line x1="250" y1="119" x2="277" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="287" cy="119" r="10" fill="#a9cade" stroke="#376c80" stroke-width="2"/><line x1="297" y1="119" x2="324" y2="119" stroke="#376c80" stroke-width="2"  stroke-linecap="round"/><circle cx="334" cy="119" r="10" fill="#70aac4" stroke="#376c80" stroke-width="2"/><path d="M50 210 C65 185 80 232 95 209 S125 187 140 210 S170 232 185 209" stroke="#9370ac" stroke-width="8" fill="none" stroke-linecap="round"/><text x="36" y="284" font-size="13" font-weight="500" text-anchor="start" fill="#193c45">Folded single chain: schematic</text><path data-chain="tertiary-single" d="M55 309 C35 285 102 279 120 300 S160 320 179 297 S241 280 260 302 S306 319 330 290" stroke="#4c9f83" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="86" cy="394" r="25" fill="#e1b877" stroke="#916229" stroke-width="2"/><circle cx="132" cy="394" r="25" fill="#e1b877" stroke="#916229" stroke-width="2"/><circle cx="178" cy="394" r="25" fill="#e1b877" stroke="#916229" stroke-width="2"/><text x="36" y="439" font-size="13" font-weight="500" text-anchor="start" fill="#526c70">Cartoons show topology, not atomic bonds or scale.</text>
<path d="M240 200 L330 200 M330 214 L240 214" stroke="#9370ac" stroke-width="5" fill="none"/><path d="M240 200 L248 195 M240 200 L248 205 M330 214 L322 209 M330 214 L322 219" stroke="#9370ac" stroke-width="3" fill="none"/><path d="M260 203 L260 211 M280 203 L280 211 M300 203 L300 211" stroke="#526c70" stroke-width="2" stroke-dasharray="2 2"/></svg>
