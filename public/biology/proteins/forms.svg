<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Insulin is depicted as a compact, soluble globular hormone composed of disulfide-linked peptide chains. Collagen is represented as three long intertwining chains forming an extended fibrous triple helix that supports tensile strength.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="35" font-size="19" font-weight="700" text-anchor="start" fill="#193c45">Shape supports different biological tasks</text><text x="24" y="73" font-size="15" font-weight="700" text-anchor="start" fill="#193c45">Insulin — compact, globular signalling protein</text><path data-chain="insulin-A" d="M55 115 C50 80 135 90 132 120 S85 158 70 139" stroke="#418f88" fill="none" stroke-width="5"/><path data-chain="insulin-B" d="M60 145 C95 175 150 145 150 120 S100 110 98 134" stroke="#8466a0" fill="none" stroke-width="5"/><path d="M75 139 L94 150 M126 124 L143 131" stroke="#916229" stroke-width="3"/><text x="40" y="183" font-size="12" fill="#526c70">Lines between chains: disulfide links</text><text x="197" y="122" font-size="15" font-weight="500" text-anchor="start" fill="#193c45">Two disulfide-linked</text><text x="197" y="145" font-size="15" font-weight="500" text-anchor="start" fill="#193c45">mature peptide chains</text><line x1="23" y1="201" x2="457" y2="201" stroke="#b8d5d0" stroke-width="2"  stroke-linecap="round"/><text x="24" y="237" font-size="15" font-weight="700" text-anchor="start" fill="#193c45">Collagen — extended fibrous triple helix</text><text x="24" y="365" font-size="13" font-weight="500" text-anchor="start" fill="#526c70">Conceptual form only; not a molecular-scale structure.</text>
