<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Insulin is depicted as a compact, soluble globular hormone composed of disulfide-linked peptide chains. Collagen is represented as three long intertwining chains forming an extended fibrous triple helix that supports tensile strength.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="35" font-size="19" font-weight="700" text-anchor="start" fill="#193c45">Shape supports different biological tasks</text><text x="24" y="73" font-size="15" font-weight="700" text-anchor="start" fill="#193c45">Insulin — compact, globular signalling protein</text><path d="M90 115 C40 83 43 176 103 150 C162 194 167 84 100 100 Z" stroke="#418f88" fill="#c9e9e2" stroke-width="4"/><circle cx="77" cy="114" r="8" fill="#5fada0" stroke="#365f67" stroke-width="2"/><circle cx="119" cy="122" r="8" fill="#5fada0" stroke="#365f67" stroke-width="2"/><circle cx="92" cy="148" r="8" fill="#5fada0" stroke="#365f67" stroke-width="2"/><text x="197" y="122" font-size="15" font-weight="500" text-anchor="start" fill="#193c45">Two disulfide-linked</text><text x="197" y="145" font-size="15" font-weight="500" text-anchor="start" fill="#193c45">mature peptide chains</text><line x1="23" y1="201" x2="457" y2="201" stroke="#b8d5d0" stroke-width="2"  stroke-linecap="round"/><text x="24" y="237" font-size="15" font-weight="700" text-anchor="start" fill="#193c45">Collagen — extended fibrous triple helix</text><path d="M 37 294 Q 54 278 71 294 Q 88 310 105 294 Q 122 278 139 294 Q 156 310 173 294 Q 190 278 207 294 Q 224 310 241 294 Q 258 278 275 294 Q 292 310 309 294 Q 326 278 343 294 Q 360 310 377 294 Q 394 278 411 294 Q 428 310 445 294" stroke="#8466a0" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 37 306 Q 54 290 71 306 Q 88 322 105 306 Q 122 290 139 306 Q 156 322 173 306 Q 190 290 207 306 Q 224 322 241 306 Q 258 290 275 306 Q 292 322 309 306 Q 326 290 343 306 Q 360 322 377 306 Q 394 290 411 306 Q 428 322 445 306" stroke="#5298ab" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 37 318 Q 54 302 71 318 Q 88 334 105 318 Q 122 302 139 318 Q 156 334 173 318 Q 190 302 207 318 Q 224 334 241 318 Q 258 302 275 318 Q 292 334 309 318 Q 326 302 343 318 Q 360 334 377 318 Q 394 302 411 318 Q 428 334 445 318" stroke="#ba8b4c" stroke-width="5" fill="none" stroke-linecap="round"/><text x="24" y="365" font-size="13" font-weight="500" text-anchor="start" fill="#526c70">Conceptual form only; not a molecular-scale structure.</text>
