<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle figDesc" viewBox="0 0 480 353" width="480" height="353">
<title id="figTitle">Original LitLab educational schematic</title><desc id="figDesc">Two amino acids react by condensation. Generalized dipeptide H2N–CH(R1)–C(=O)–NH–CH(R2)–COOH plus water. The covalent peptide linkage is C(=O)–NH.</desc>
<rect width="100%" height="100%" rx="16" fill="#fbfdfb"/>
<text x="22" y="34" font-size="18" font-weight="700" text-anchor="start" fill="#193c45">Peptide bond: link the carboxyl and amine</text><rect x="24" y="59" width="432" height="65" rx="12" fill="#e8f6f1" stroke="#87ada5" stroke-width="1.5"/><text x="240" y="88" font-size="17" font-weight="700" text-anchor="middle" fill="#193c45">Amino acid 1 + amino acid 2</text><text x="240" y="111" font-size="14" font-weight="500" text-anchor="middle" fill="#526c70">Carboxyl group + amine group react</text><text x="240" y="161" font-size="16" font-weight="700" text-anchor="middle" fill="#b46e31">↓  condensation (water released)</text><rect x="24" y="184" width="432" height="115" rx="12" fill="#e3f4ee" stroke="#87ada5" stroke-width="1.5"/><text x="240" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#276c68">GENERALIZED DIPEPTIDE</text><text x="240" y="241" font-size="17" font-weight="700" text-anchor="middle" fill="#193c45">H₂N–CH(R₁)–C(=O)–NH–</text><text x="240" y="265" font-size="17" font-weight="700" text-anchor="middle" fill="#193c45">CH(R₂)–COOH    +    H₂O</text><text x="24" y="329" font-size="14" font-weight="700" text-anchor="start" fill="#526c70">New covalent peptide linkage: –C(=O)–NH–</text>
</svg>
