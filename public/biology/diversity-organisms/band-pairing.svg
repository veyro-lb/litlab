<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 400" role="img" aria-labelledby="title desc"><title id="title">Schematic chromosomes for homologous pairing</title><desc id="desc">Six labelled chromosome silhouettes A to F, with different lengths, dark band positions and constricted centromeres. Pair the matching features; the schematic is not a real micrograph.</desc><rect width="890" height="400" rx="22" fill="#f5fafc"/><text x="28" y="37" font-family="Arial" font-size="24" font-weight="bold" fill="#12394c">Find three chromosome pairs</text><text x="28" y="67" font-family="Arial" font-size="17" fill="#32546a">Compare length, relative band locations and centromere position.</text><g transform="translate(135 211)"><path d="M-21 -95 H21 V-10 L13 -2 L21 7 V95 H-21 V7 L-13 -2 L-21 -10 Z" fill="#b0dce6" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-69" width="36" height="10" rx="3"/><rect x="-18" y="-44" width="36" height="10" rx="3"/><rect x="-18" y="57" width="36" height="10" rx="3"/></g><path d="M-14 -3H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">A</text></g><g transform="translate(260 211)"><path d="M-21 -64 H21 V-45 L13 -37 L21 -28 V64 H-21 V-28 L-13 -37 L-21 -45 Z" fill="#f8d8a8" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-52" width="36" height="10" rx="3"/><rect x="-18" y="29" width="36" height="10" rx="3"/><rect x="-18" y="49" width="36" height="10" rx="3"/></g><path d="M-14 -38H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">B</text></g><g transform="translate(385 211)"><path d="M-21 -79 H21 V-10 L13 -2 L21 7 V79 H-21 V7 L-13 -2 L-21 -10 Z" fill="#cbdee6" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-55" width="36" height="10" rx="3"/><rect x="-18" y="22" width="36" height="10" rx="3"/><rect x="-18" y="47" width="36" height="10" rx="3"/></g><path d="M-14 -3H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">C</text></g><g transform="translate(510 211)"><path d="M-21 -95 H21 V-10 L13 -2 L21 7 V95 H-21 V7 L-13 -2 L-21 -10 Z" fill="#b0dce6" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-69" width="36" height="10" rx="3"/><rect x="-18" y="-44" width="36" height="10" rx="3"/><rect x="-18" y="57" width="36" height="10" rx="3"/></g><path d="M-14 -3H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">D</text></g><g transform="translate(635 211)"><path d="M-21 -79 H21 V-10 L13 -2 L21 7 V79 H-21 V7 L-13 -2 L-21 -10 Z" fill="#cbdee6" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-55" width="36" height="10" rx="3"/><rect x="-18" y="22" width="36" height="10" rx="3"/><rect x="-18" y="47" width="36" height="10" rx="3"/></g><path d="M-14 -3H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">E</text></g><g transform="translate(760 211)"><path d="M-21 -64 H21 V-45 L13 -37 L21 -28 V64 H-21 V-28 L-13 -37 L-21 -45 Z" fill="#f8d8a8" stroke="#29647a" stroke-width="2"/><g fill="#497a90"><rect x="-18" y="-52" width="36" height="10" rx="3"/><rect x="-18" y="29" width="36" height="10" rx="3"/><rect x="-18" y="49" width="36" height="10" rx="3"/></g><path d="M-14 -38H14" stroke="#25576a" stroke-width="3"/><text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#12394c">F</text></g><text x="28" y="373" font-family="Arial" font-size="16" fill="#4b6675">Constructed teaching model · not an actual stained chromosome image · not to scale</text></svg>