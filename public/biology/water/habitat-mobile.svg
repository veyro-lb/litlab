<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">Four distinct water and air comparisons under matched conditions</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="650" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="20" text-anchor="start">Compare water with air</text><rect x="16" y="64" width="328" height="130" rx="8" fill="white" stroke="#d6eae5"/><text x="30" y="92" font-size="18" text-anchor="start">Buoyancy</text><text x="30" y="117" font-size="13" text-anchor="start">Same displaced volume</text><text x="30" y="146" font-size="15" text-anchor="start">Water → greater upthrust</text><text x="30" y="172" font-size="13" text-anchor="start">Displaced fluid’s weight</text><rect x="16" y="207" width="328" height="130" rx="8" fill="white" stroke="#d6eae5"/><text x="30" y="235" font-size="18" text-anchor="start">Dynamic viscosity</text><text x="30" y="260" font-size="13" text-anchor="start">Comparable mild temperature</text><text x="30" y="289" font-size="15" text-anchor="start">Water → more shear resistance</text><text x="30" y="315" font-size="13" text-anchor="start">Drag also depends on flow/shape</text><rect x="16" y="350" width="328" height="130" rx="8" fill="white" stroke="#d6eae5"/><text x="30" y="378" font-size="18" text-anchor="start">Thermal conductivity</text><text x="30" y="403" font-size="13" text-anchor="start">Same geometry and gradient</text><text x="30" y="432" font-size="15" text-anchor="start">Water → greater conduction</text><text x="30" y="458" font-size="13" text-anchor="start">Insulation limits heat transfer</text><rect x="16" y="493" width="328" height="130" rx="8" fill="white" stroke="#d6eae5"/><text x="30" y="521" font-size="18" text-anchor="start">Specific heat capacity</text><text x="30" y="546" font-size="13" text-anchor="start">Equal mass and energy; no phase change</text><text x="30" y="575" font-size="15" text-anchor="start">Water → smaller temperature rise</text><text x="30" y="601" font-size="13" text-anchor="start">ΔT = Q/(mc)</text></g></svg>