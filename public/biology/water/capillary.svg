<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Adhesion, cohesion and finite capillary rise</title><desc id="desc">Original teaching schematic. Refer to the accompanying written description and source notes. Not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287868"/></marker></defs><rect width="720" height="350" rx="16" fill="#f1f7f6"/><g font-family="Arial, sans-serif" fill="#203a39" font-size="16"><text x="30" y="36" font-size="22" text-anchor="start">Water meets a wettable surface</text><rect x="70" y="210" width="315" height="75" fill="#d6eae5"/><path d="M70 170V285H385V170" fill="none" stroke="#385e61" stroke-width="3"/><path d="M150 80V270M180 80V270M270 80V270M330 80V270" stroke="#385e61" stroke-width="4"/><path d="M152 110Q165 130 178 110V280H152Z M272 160Q300 182 328 160V280H272Z" fill="#92cbbc"/><path d="M70 210H385" stroke="#287868" stroke-dasharray="5 5"/><text x="165" y="70" font-size="14" text-anchor="middle">Narrow</text><text x="300" y="70" font-size="14" text-anchor="middle">Wider</text><text x="420" y="110" font-size="16" text-anchor="start">Adhesion → wall attraction</text><text x="420" y="150" font-size="16" text-anchor="start">Cohesion → water attraction</text><text x="420" y="200" font-size="16" text-anchor="start">Gravity opposes the rise.</text><text x="420" y="240" font-size="16" text-anchor="start">Rise stops at equilibrium.</text><text x="360" y="325" font-size="16" text-anchor="middle">Biological settings: soil pores and plant cell walls</text></g></svg>