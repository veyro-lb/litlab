<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Asteroidal contribution and retention</title><desc id="desc">Original teaching schematic. Refer to the accompanying written description and source notes. Not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287868"/></marker></defs><rect width="720" height="350" rx="16" fill="#f1f7f6"/><g font-family="Arial, sans-serif" fill="#203a39" font-size="16"><text x="30" y="36" font-size="21" text-anchor="start">A possible contribution, not a complete origin story</text><path d="M60 140L90 90L138 115L145 160L100 182Z" fill="#d6c7b6" stroke="#805c36" stroke-width="3"/><text x="30" y="225" font-size="15" text-anchor="start">Water-bearing material</text><text x="30" y="250" font-size="15" text-anchor="start">in asteroids</text><path d="M160 140H300" stroke="#287868" stroke-width="3" marker-end="url(#arrow)"/><circle cx="370" cy="150" r="55" fill="#b7dcd2" stroke="#287868" stroke-width="3"/><text x="370" y="155" font-size="16" text-anchor="middle">Early Earth</text><text x="480" y="110" font-size="16" text-anchor="start">Gravity helps retention.</text><text x="480" y="155" font-size="16" text-anchor="start">Cooling permits</text><text x="480" y="183" font-size="16" text-anchor="start">condensation.</text><text x="360" y="310" font-size="15" text-anchor="middle">Water availability over billions of years supports life’s evolution.</text></g></svg>