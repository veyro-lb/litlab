<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">Finite capillary rise in wettable spaces</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="590" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="19" text-anchor="start">Adhesion: water ↔ surface</text><text x="22" y="70" font-size="15" text-anchor="start">Wettable capillaries: a simple model</text><path d="M45 105V300M75 105V300M160 105V300M225 105V300" stroke="#385e61" stroke-width="3"/><path d="M47 140Q60 160 73 140V300H47Z M162 205Q192 225 223 205V300H162Z" fill="#92cbbc"/><line x1="22" y1="275" x2="320" y2="275" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><text x="60" y="330" font-size="15" text-anchor="middle">Narrow</text><text x="192" y="330" font-size="15" text-anchor="middle">Wider</text><text x="22" y="373" font-size="15" text-anchor="start">Walls attract water: adhesion.</text><text x="22" y="401" font-size="15" text-anchor="start">Water attracts water: cohesion.</text><text x="22" y="429" font-size="15" text-anchor="start">Gravity limits the equilibrium rise.</text><text x="22" y="475" font-size="16" text-anchor="start">Biological settings:</text><text x="22" y="502" font-size="15" text-anchor="start">soil pores and plant cell walls.</text><text x="22" y="542" font-size="15" text-anchor="start">Capillarity alone cannot account</text><text x="22" y="567" font-size="15" text-anchor="start">for water reaching a tall tree’s top.</text></g></svg>