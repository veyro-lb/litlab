<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 615" role="img" aria-labelledby="title desc"><title id="title">Hydration orientation around separate sodium and chloride ions</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="615" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="20" text-anchor="start">Hydration: ions and water</text><circle cx="90" cy="155" r="24" fill="#f2e3c6" stroke="#966125"/><text x="90" y="161" font-size="18" text-anchor="middle">Na⁺</text><g transform="translate(205 155) rotate(0)"><line x1="0" y1="0" x2="-12" y2="-46" stroke="#385e61" stroke-width="2.5"/><line x1="0" y1="0" x2="47" y2="0" stroke="#385e61" stroke-width="2.5"/><circle r="16" fill="#d6eae5" stroke="#287868"/><text x="0" y="5" font-size="15" text-anchor="middle">O</text><circle cx="-12" cy="-46" r="12" fill="white" stroke="#287868"/><text x="-12" y="-41" font-size="13" text-anchor="middle">H</text><circle cx="47" cy="0" r="12" fill="white" stroke="#287868"/><text x="47" y="5" font-size="13" text-anchor="middle">H</text></g><line x1="116" y1="155" x2="187" y2="155" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><text x="22" y="225" font-size="15" text-anchor="start">Oxygen ends face the positive ion.</text><circle cx="90" cy="405" r="24" fill="#f2e3c6" stroke="#966125"/><text x="90" y="411" font-size="18" text-anchor="middle">Cl⁻</text><g transform="translate(245 405) rotate(180)"><line x1="0" y1="0" x2="-12" y2="-46" stroke="#385e61" stroke-width="2.5"/><line x1="0" y1="0" x2="47" y2="0" stroke="#385e61" stroke-width="2.5"/><circle r="16" fill="#d6eae5" stroke="#287868"/><text x="0" y="5" font-size="15" text-anchor="middle">O</text><circle cx="-12" cy="-46" r="12" fill="white" stroke="#287868"/><text x="-12" y="-41" font-size="13" text-anchor="middle">H</text><circle cx="47" cy="0" r="12" fill="white" stroke="#287868"/><text x="47" y="5" font-size="13" text-anchor="middle">H</text></g><line x1="117" y1="405" x2="184" y2="405" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><text x="22" y="490" font-size="15" text-anchor="start">Hydrogen ends face the negative ion.</text><text x="22" y="270" font-size="15" text-anchor="start">Water remains molecular H₂O.</text><text x="22" y="533" font-size="15" text-anchor="start">Ion–dipole attraction, not a</text><text x="22" y="558" font-size="15" text-anchor="start">new covalent bond to the ion.</text><text x="22" y="593" font-size="14" text-anchor="start">Selected orientations; shells rearrange.</text></g></svg>