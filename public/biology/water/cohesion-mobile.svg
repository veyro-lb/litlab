<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 525" role="img" aria-labelledby="title desc"><title id="title">Xylem cohesion and surface tension</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="525" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="20" text-anchor="start">Cohesion: water ↔ water</text><text x="22" y="70" font-size="15" text-anchor="start">Xylem: a continuous liquid column</text><rect x="35" y="96" width="75" height="175" fill="#d6eae5" stroke="#385e61" stroke-width="2"/><circle cx="72" cy="120" r="11" fill="white" stroke="#287868"/><circle cx="72" cy="163" r="11" fill="white" stroke="#287868"/><circle cx="72" cy="206" r="11" fill="white" stroke="#287868"/><circle cx="72" cy="249" r="11" fill="white" stroke="#287868"/><line x1="72" y1="133" x2="72" y2="149" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="72" y1="176" x2="72" y2="192" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="72" y1="219" x2="72" y2="235" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><text x="136" y="120" font-size="15" text-anchor="start">Leaf evaporation</text><text x="136" y="146" font-size="15" text-anchor="start">generates tension.</text><text x="136" y="192" font-size="15" text-anchor="start">Cohesion supports</text><text x="136" y="218" font-size="15" text-anchor="start">column continuity.</text><text x="136" y="260" font-size="14" text-anchor="start">Flow ↑ towards leaves</text><text x="22" y="318" font-size="17" text-anchor="start">At a water–air surface</text><path d="M22 390Q80 380 120 395Q145 415 170 395Q240 380 338 390" fill="none" stroke="#287868" stroke-width="3"/><path d="M127 346L116 391M155 346L173 391M127 346L155 346" fill="none" stroke="#385e61" stroke-width="3"/><text x="22" y="450" font-size="15" text-anchor="start">Legs deform the interface.</text><text x="22" y="478" font-size="15" text-anchor="start">Surface tension can support a</text><text x="22" y="502" font-size="15" text-anchor="start">small insect. No solid skin forms.</text></g></svg>