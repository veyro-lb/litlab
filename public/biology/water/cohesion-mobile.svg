<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 860" role="img" aria-labelledby="title desc"><title id="title">Cohesion: a continuous column and a deformable interface</title><desc id="desc">Original not-to-scale xylem and water-strider schematic. Evaporation generates xylem tension; cohesion helps transmit the pull along a continuous liquid column. Water-repellent legs deform an air-water interface supported by surface tension. No individual molecule count, measured force or anatomical scale is represented.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287868"/></marker></defs><rect width="100%" height="100%" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="25" y="38" font-size="23">Two effects of cohesion</text><text x="25" y="83" font-size="23" data-recall-label="true">In a xylem vessel</text><path d="M120 135 V365 M190 135 V365" fill="none" stroke="#456f68" stroke-width="7"/><path d="M124 136 H186 V365 H124 Z" fill="#a8d6df"/><path d="M155 311 L155 176" fill="none" stroke="#287868" stroke-width="4" marker-end="url(#tip)"/><path d="M123 135 Q80 83 152 105 Q206 85 190 135" fill="#bdddc9" stroke="#456f68" stroke-width="3"/><path d="M154 104 L154 66" fill="none" stroke="#287868" stroke-width="4" marker-end="url(#tip)"/><text x="222" y="157" font-size="18" data-recall-label="true">Evaporation</text><text x="222" y="184" font-size="18" data-recall-label="true">at leaves</text><text x="222" y="246" font-size="18" data-recall-label="true">Tension is</text><text x="222" y="273" font-size="18" data-recall-label="true">transmitted</text><text x="222" y="300" font-size="18" data-recall-label="true">through the</text><text x="222" y="327" font-size="18" data-recall-label="true">liquid column</text><text x="25" y="405" font-size="18" data-recall-label="true">Root water replaces water lost at the leaf.</text><text x="25" y="458" font-size="23" data-recall-label="true">At a water–air interface</text><path d="M25 657 Q65 650 94 658 Q117 685 143 658 Q213 647 286 658 Q309 685 335 658 Q375 650 425 657 L425 740 H25 Z" fill="#b5dce4" stroke="#287868" stroke-width="3"/><ellipse cx="215" cy="548" rx="39" ry="14" fill="#56685c"/><path d="M185 551 L117 656 M245 551 L309 656 M199 542 L174 510 M228 542 L254 510" fill="none" stroke="#456f68" stroke-width="4"/><text x="25" y="590" font-size="18" data-recall-label="true">Air</text><text x="25" y="724" font-size="18" data-recall-label="true">Water</text><text x="25" y="783" font-size="18" data-recall-label="true">Water-repellent legs depress the interface.</text><text x="25" y="815" font-size="18" data-recall-label="true">Surface tension supports a small insect.</text><text x="25" y="846" font-size="14">Conceptual section · not to scale · no fixed lattice or solid surface skin</text></g></svg>