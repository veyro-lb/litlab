<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Compare water with air</title><desc id="desc">Original teaching schematic. Refer to the accompanying written description and source notes. Not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287868"/></marker></defs><rect width="720" height="350" rx="16" fill="#f1f7f6"/><g font-family="Arial, sans-serif" fill="#203a39" font-size="16"><text x="30" y="36" font-size="22" text-anchor="start">Same animal. Different physical demands.</text><rect x="30" y="73" width="660" height="52" rx="7" fill="#fff"/><text x="45" y="95" font-size="16" text-anchor="start">Buoyant support</text><text x="335" y="95" font-size="15" text-anchor="start">Greater in water for equal displaced volume</text><rect x="30" y="133" width="660" height="52" rx="7" fill="#e2efeb"/><text x="45" y="155" font-size="16" text-anchor="start">Dynamic viscosity</text><text x="335" y="155" font-size="15" text-anchor="start">Higher in water → more flow resistance</text><rect x="30" y="193" width="660" height="52" rx="7" fill="#fff"/><text x="45" y="215" font-size="16" text-anchor="start">Thermal conductivity</text><text x="335" y="215" font-size="15" text-anchor="start">Higher in water → cooling challenge</text><rect x="30" y="253" width="660" height="52" rx="7" fill="#e2efeb"/><text x="45" y="275" font-size="16" text-anchor="start">Specific heat capacity</text><text x="335" y="275" font-size="15" text-anchor="start">Higher in water → smaller ΔT for equal Q/m</text><text x="360" y="330" font-size="13" text-anchor="middle">Qualitative comparison at ordinary conditions; no measured scale</text></g></svg>