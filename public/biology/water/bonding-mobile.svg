<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 405" role="img" aria-labelledby="title desc"><title id="title">Polar water molecules and hydrogen bonding</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="405" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="19" text-anchor="start">Within and between molecules</text><g transform="translate(85 145) rotate(0)"><line x1="0" y1="0" x2="-12" y2="-46" stroke="#385e61" stroke-width="2.5"/><line x1="0" y1="0" x2="47" y2="0" stroke="#385e61" stroke-width="2.5"/><circle r="16" fill="#d6eae5" stroke="#287868"/><text x="0" y="5" font-size="15" text-anchor="middle">O</text><circle cx="-12" cy="-46" r="12" fill="white" stroke="#287868"/><text x="-12" y="-41" font-size="13" text-anchor="middle">H</text><circle cx="47" cy="0" r="12" fill="white" stroke="#287868"/><text x="47" y="5" font-size="13" text-anchor="middle">H</text><text x="-28" y="24" font-size="14" text-anchor="start">δ−</text><text x="-25" y="-64" font-size="14" text-anchor="start">δ+</text><text x="49" y="-17" font-size="14" text-anchor="start">δ+</text></g><g transform="translate(230 145) rotate(0)"><line x1="0" y1="0" x2="-12" y2="-46" stroke="#385e61" stroke-width="2.5"/><line x1="0" y1="0" x2="47" y2="0" stroke="#385e61" stroke-width="2.5"/><circle r="16" fill="#d6eae5" stroke="#287868"/><text x="0" y="5" font-size="15" text-anchor="middle">O</text><circle cx="-12" cy="-46" r="12" fill="white" stroke="#287868"/><text x="-12" y="-41" font-size="13" text-anchor="middle">H</text><circle cx="47" cy="0" r="12" fill="white" stroke="#287868"/><text x="47" y="5" font-size="13" text-anchor="middle">H</text><text x="-28" y="24" font-size="14" text-anchor="start">δ−</text><text x="-25" y="-64" font-size="14" text-anchor="start">δ+</text><text x="49" y="-17" font-size="14" text-anchor="start">δ+</text></g><line x1="146" y1="145" x2="212" y2="145" stroke="#966125" stroke-width="2.5" stroke-dasharray="5 5"/><text x="22" y="225" font-size="16" text-anchor="start">Solid O–H: polar covalent</text><text x="22" y="255" font-size="16" text-anchor="start">Dashed H···O: hydrogen bond</text><text x="22" y="292" font-size="16" text-anchor="start">H–O–H angle ≈104.5°</text><text x="22" y="323" font-size="15" text-anchor="start">δ: partial charge; total charge: zero</text><text x="22" y="357" font-size="15" text-anchor="start">The dashed link joins different</text><text x="22" y="380" font-size="15" text-anchor="start">molecules. Schematic, not to scale.</text></g></svg>