<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" role="img" aria-labelledby="title desc"><title id="title">Possible asteroidal delivery and retention of water</title><desc id="desc">Original responsive schematic. The adjacent written description explains the mechanism. Not to scale.</desc><rect width="360" height="535" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="22" y="32" font-size="21" text-anchor="start">A source hypothesis</text><path d="M40 95L70 66L120 90L110 135L63 145Z" fill="#d6c7b6" stroke="#805c36" stroke-width="2"/><text x="145" y="95" font-size="16" text-anchor="start">Water-bearing</text><text x="145" y="121" font-size="16" text-anchor="start">asteroid material</text><text x="22" y="188" font-size="18" text-anchor="start">May contribute water</text><text x="22" y="220" font-size="14" text-anchor="start">↓ delivery is plausible, not exclusive</text><circle cx="180" cy="307" r="48" fill="#b7dcd2" stroke="#287868"/><text x="180" y="312" font-size="18" text-anchor="middle">Earth</text><text x="22" y="395" font-size="16" text-anchor="start">Gravity → helps retention</text><text x="22" y="429" font-size="16" text-anchor="start">Cooling → allows condensation</text><text x="22" y="474" font-size="14" text-anchor="start">Appropriate pressure is also needed.</text><text x="22" y="512" font-size="14" text-anchor="start">Schematic, not a measured timeline.</text></g></svg>