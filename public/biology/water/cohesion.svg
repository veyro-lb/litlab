<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Cohesion: a continuous column and a deformable interface</title><desc id="desc">Original not-to-scale xylem and water-strider schematic. Evaporation generates xylem tension; cohesion helps transmit the pull along a continuous liquid column. Water-repellent legs deform an air-water interface supported by surface tension. No individual molecule count, measured force or anatomical scale is represented.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#287868"/></marker></defs><rect width="100%" height="100%" fill="#f1f7f6"/><g font-family="Arial,sans-serif" fill="#203a39"><text x="25" y="38" font-size="23">A pull through water; support at a surface</text><text x="30" y="92" font-size="22" data-recall-label="true">Xylem: evaporation generates tension</text><path d="M150 160 V432 M228 160 V432" fill="none" stroke="#456f68" stroke-width="8"/><path d="M154 160 H224 V432 H154 Z" fill="#a8d6df"/><path d="M189 385 L189 205" fill="none" stroke="#287868" stroke-width="4" marker-end="url(#tip)"/><path d="M154 160 Q94 92 188 119 Q267 91 224 160" fill="#bdddc9" stroke="#456f68" stroke-width="3"/><path d="M188 118 L188 68" fill="none" stroke="#287868" stroke-width="4" marker-end="url(#tip)"/><text x="265" y="220" font-size="20" data-recall-label="true">Cohesion helps</text><text x="265" y="250" font-size="20" data-recall-label="true">maintain a</text><text x="265" y="280" font-size="20" data-recall-label="true">continuous</text><text x="265" y="310" font-size="20" data-recall-label="true">water column.</text><text x="38" y="478" font-size="20" data-recall-label="true">Water moves from roots toward leaves.</text><text x="480" y="92" font-size="22" data-recall-label="true">Surface tension: a small habitat</text><path d="M475 345 Q508 336 540 345 Q563 371 586 345 Q652 334 718 345 Q741 371 764 345 Q818 337 870 345 L870 438 H475 Z" fill="#b5dce4" stroke="#287868" stroke-width="3"/><ellipse cx="653" cy="211" rx="42" ry="15" fill="#56685c"/><path d="M616 216 L563 344 M687 216 L741 344 M637 202 L607 166 M672 202 L701 166" fill="none" stroke="#456f68" stroke-width="4"/><text x="485" y="286" font-size="18" data-recall-label="true">Air</text><text x="485" y="415" font-size="18" data-recall-label="true">Water</text><text x="480" y="479" font-size="19" data-recall-label="true">Water-repellent legs deform the interface.</text><text x="25" y="546" font-size="14">Conceptual section · not to scale · no fixed lattice or solid surface skin</text></g></svg>