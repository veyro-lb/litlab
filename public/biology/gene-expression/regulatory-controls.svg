<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="ttl desc"><title id="ttl">Gene expression can be regulated at transcription and RNA degradation</title><desc id="desc">An enhancer and promoter are DNA sequences; a transcription factor binds the enhancer and influences transcription machinery at the promoter, producing RNA. A separate nuclease degradation pathway reduces available mRNA. Translation uses remaining mRNA to produce protein. DNA sequence stays unchanged.</desc><rect width="1040" height="420" fill="#f6fbfe"/><text x="34" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#193956">Two control points from one unchanged DNA sequence</text><rect x="30" y="96" width="238" height="76" rx="13" fill="#dbe9f7" stroke="#6286ad"/><text x="50" y="125" font-size="19" font-family="sans-serif">Enhancer DNA</text><text x="50" y="154" font-size="17" font-family="sans-serif">TF binds → regulatory signal</text><rect x="322" y="96" width="235" height="76" rx="13" fill="#dbe9f7" stroke="#6286ad"/><text x="345" y="125" font-size="19" font-family="sans-serif">Promoter DNA</text><text x="345" y="154" font-size="17" font-family="sans-serif">RNA polymerase initiation</text><rect x="624" y="96" width="190" height="76" rx="13" fill="#d8efe8" stroke="#44957f"/><text x="650" y="126" font-size="21" font-family="sans-serif">mRNA</text><text x="650" y="155" font-size="17" font-family="sans-serif">Available transcripts</text><rect x="837" y="96" width="174" height="76" rx="13" fill="#ece0f3" stroke="#9574b3"/><text x="863" y="126" font-size="21" font-family="sans-serif">Protein</text><text x="854" y="155" font-size="17" font-family="sans-serif">Translation product</text><g stroke="#365d79" stroke-width="3" fill="none"><path d="M268 132 H316"/><path d="M307 123 L318 132 L307 141"/><path d="M557 132 H616"/><path d="M607 123 L618 132 L607 141"/><path d="M814 132 H832"/><path d="M823 123 L834 132 L823 141"/></g><path d="M716 172 V243 H602" stroke="#b76e43" stroke-width="4" fill="none"/><path d="M614 233 L599 243 L614 253" stroke="#b76e43" stroke-width="4" fill="none"/><rect x="345" y="249" width="263" height="67" rx="12" fill="#ffe9d8" stroke="#cb9068"/><text x="368" y="278" font-family="sans-serif" font-size="19">Nuclease-mediated decay</text><text x="368" y="301" font-family="sans-serif" font-size="16">Fewer mRNAs for translation</text><text x="35" y="376" font-family="sans-serif" font-size="19" fill="#35506c">Promoter / enhancer = DNA. Transcription factors = proteins. mRNA decay = post-transcriptional.</text></svg>