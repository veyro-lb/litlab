<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img"><title>Four choices at every site</title><desc>2 bases: 4² = 16; 4 bases: 4⁴ = 256; 8 bases: 4⁸ = 65,536; original conceptual model, not atomically to scale.</desc><rect width="960" height="435" fill="#fff"/><rect x="0" y="0" width="960" height="72" rx="12" fill="#114766"/><text x="28" y="45" font-size="28" font-family="Arial,sans-serif" fill="#ffffff">Four choices at every site</text><rect x="88" y="112" width="752" height="68" rx="12" fill="#e4f1f7" stroke="#abcbdc"/><text x="115" y="155" font-size="22" font-family="Arial,sans-serif" fill="#173e57">2 bases: 4² = 16</text><rect x="88" y="203" width="752" height="68" rx="12" fill="#eff5fa" stroke="#abcbdc"/><text x="115" y="246" font-size="22" font-family="Arial,sans-serif" fill="#173e57">4 bases: 4⁴ = 256</text><rect x="88" y="294" width="752" height="68" rx="12" fill="#e4f1f7" stroke="#abcbdc"/><text x="115" y="337" font-size="22" font-family="Arial,sans-serif" fill="#173e57">8 bases: 4⁸ = 65,536</text><text x="30" y="409" font-size="16" font-family="Arial,sans-serif" fill="#173e57">LitLab original schematic · conceptual, not atomically to scale · scientific review pending</text></svg>