<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="n-title n-desc">
<title id="n-title">DNA wraps around a histone octamer; H1 is a separate linker histone</title>
<desc id="n-desc">Conceptual, not to scale. Two blue parallel curves show a DNA duplex wrapped around eight colored histones: two H2A, two H2B, two H3 and two H4. H1 is separately labelled at linker DNA outside the octamer. This is not an atom-level reconstruction.</desc>
<rect width="920" height="430" rx="24" fill="#f7fafc"/>
<text x="34" y="41" font-family="Arial, sans-serif" fill="#16344a" font-weight="700" font-size="25">Nucleosome: DNA around eight core histones</text>
<text x="34" y="74" font-family="Arial, sans-serif" fill="#38566b" font-size="18">Conceptual topology · not to scale</text>
<g stroke="#d8e3ed" stroke-width="1.5"><rect x="275" y="129" width="370" height="205" rx="78" fill="#e9eef7"/></g>
<g font-family="Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle" fill="#193244">
<circle cx="338" cy="192" r="40" fill="#ffd8b5" stroke="#a85824" stroke-width="2"/><text x="338" y="199">H2A</text>
<circle cx="426" cy="192" r="40" fill="#c8ecda" stroke="#4d8a6a" stroke-width="2"/><text x="426" y="199">H2B</text>
<circle cx="514" cy="192" r="40" fill="#d5d9ff" stroke="#686fac" stroke-width="2"/><text x="514" y="199">H3</text>
<circle cx="602" cy="192" r="40" fill="#ffdaf1" stroke="#a75c92" stroke-width="2"/><text x="602" y="199">H4</text>
<circle cx="338" cy="278" r="40" fill="#ffd8b5" stroke="#a85824" stroke-width="2"/><text x="338" y="285">H2A</text>
<circle cx="426" cy="278" r="40" fill="#c8ecda" stroke="#4d8a6a" stroke-width="2"/><text x="426" y="285">H2B</text>
<circle cx="514" cy="278" r="40" fill="#d5d9ff" stroke="#686fac" stroke-width="2"/><text x="514" y="285">H3</text>
<circle cx="602" cy="278" r="40" fill="#ffdaf1" stroke="#a75c92" stroke-width="2"/><text x="602" y="285">H4</text>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M 85 280 L 184 280 C 219 280 216 116 455 111 C 710 106 755 349 468 361 C 231 370 216 210 340 161" stroke="#076fbb" stroke-width="13"/>
<path d="M 85 297 L 197 297 C 239 297 230 131 455 126 C 690 121 736 333 468 346 C 256 353 229 223 343 178" stroke="#6ebee5" stroke-width="9"/>
</g>
<g font-family="Arial, sans-serif" fill="#203d51" font-size="21">
<text x="32" y="251">Linker DNA</text>
<text x="700" y="94">Wrapped DNA</text>
<path d="M 741 104 L 693 144" fill="none" stroke="#38566b" stroke-width="2"/>
<text x="295" y="407">Core: 2 × (H2A + H2B + H3 + H4)</text>
</g>
<circle cx="785" cy="289" r="43" fill="#ffcb80" stroke="#a76324" stroke-width="3"/>
<text x="785" y="298" fill="#402600" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">H1</text>
<path d="M 760 328 L 736 351" stroke="#a76324" stroke-width="2" stroke-dasharray="6 5"/>
<text x="690" y="392" fill="#6e431c" font-family="Arial, sans-serif" font-size="20">H1: linker histone</text>
</svg>