<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img"><title>DNA and RNA base recognition</title><desc>Purines: A + G (two rings); Pyrimidines: C + T + U (one ring); DNA T ↔ RNA U; original conceptual model, not atomically to scale.</desc><rect width="960" height="435" fill="#fff"/><rect x="0" y="0" width="960" height="72" rx="12" fill="#114766"/><text x="28" y="45" font-size="28" font-family="Arial,sans-serif" fill="#ffffff">DNA and RNA base recognition</text><circle cx="250" cy="208" r="78" fill="#cce5ef" stroke="#127494" stroke-width="3"/><circle cx="345" cy="208" r="78" fill="#cce5ef" stroke="#127494" stroke-width="3"/><circle cx="660" cy="208" r="78" fill="#eadcfa" stroke="#8956a4" stroke-width="3"/><text x="200" y="325" font-size="24" font-family="Arial,sans-serif" fill="#173e57">Two rings: A, G</text><text x="565" y="325" font-size="24" font-family="Arial,sans-serif" fill="#173e57">One ring: C, T, U</text><text x="30" y="409" font-size="16" font-family="Arial,sans-serif" fill="#173e57">LitLab original schematic · conceptual, not atomically to scale · scientific review pending</text></svg>