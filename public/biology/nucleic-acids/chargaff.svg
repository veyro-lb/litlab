<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 540"><title>Illustrative Chargaff composition</title><desc>Illustrative Chargaff composition; original scientifically simplified structural/mechanism model. Recall version removes explanatory labels but keeps geometric relationships.</desc><rect width="960" height="540" fill="#fff"/><rect width="960" height="68" rx="12" fill="#104968"/><text x="27" y="43" font-family="Arial,sans-serif" font-size="27" fill="#fff">Illustrative Chargaff composition</text><rect x="35" y="98" width="895" height="353" rx="16" fill="#f1f7fa" stroke="#9bbfd2" stroke-width="2"/><text x="50" y="128" font-family="Arial,sans-serif" font-size="19" fill="#183a56">Invented double-stranded DNA base percentages</text><text x="75" y="176" font-family="Arial,sans-serif" font-size="22" fill="#183a56">A</text><rect x="126" y="152" width="570" height="34" rx="6" fill="#4e84b1"/><text x="750" y="176" font-family="Arial,sans-serif" font-size="20" fill="#183a56">30%</text><text x="75" y="242" font-family="Arial,sans-serif" font-size="22" fill="#183a56">T</text><rect x="126" y="218" width="570" height="34" rx="6" fill="#4e84b1"/><text x="750" y="242" font-family="Arial,sans-serif" font-size="20" fill="#183a56">30%</text><text x="75" y="308" font-family="Arial,sans-serif" font-size="22" fill="#183a56">G</text><rect x="126" y="284" width="380" height="34" rx="6" fill="#9f7dbb"/><text x="750" y="308" font-family="Arial,sans-serif" font-size="20" fill="#183a56">20%</text><text x="75" y="374" font-family="Arial,sans-serif" font-size="22" fill="#183a56">C</text><rect x="126" y="350" width="380" height="34" rx="6" fill="#9f7dbb"/><text x="750" y="374" font-family="Arial,sans-serif" font-size="20" fill="#183a56">20%</text><text x="548" y="438" font-family="Arial,sans-serif" font-size="20" fill="#183a56">A=T, G=C; not all four are 25%</text><text x="24" y="523" font-family="Arial,sans-serif" font-size="15" fill="#425f75">Original LitLab instructional