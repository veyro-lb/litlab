<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 723" role="img" aria-labelledby="title desc"><title id="title">RNA: sugars, phosphates and bases</title><desc id="desc">Single-stranded illustrative RNA 5 prime A U G 3 prime. Phosphate circles and ribose pentagons form a continuous covalent sugar-phosphate backbone; bases attach to sugars and point sideways. Ribose bears 2 prime OH. Free 3 prime OH at bottom. Conventional symbols, not atom-resolved bonds or a transcript for a named gene.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="723" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">RNA: sugars, phosphates and bases</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Illustrative sequence · a single nucleotide strand</text><text x="104" y="113" font-size="21" fill="#316aaf" text-anchor="start" font-weight="400">5′ end</text><path d="M180 147V204" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="153" r="19" fill="#cfe4ee"/><text x="180" y="160" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">P</text><polygon points="150,216 180,196 210,216 199,251 161,251" fill="#f3dca7" stroke="#a87013" stroke-width="2"/><text x="180" y="230" font-size="15" fill="#163d48" text-anchor="middle" font-weight="400">Ribose</text><path d="M211 221H357" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="363" y="191" width="153" height="66" rx="12" fill="#e8e0f0" stroke="#86ada8" stroke-width="2"/><text x="439.5" y="222" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">A</text><path d="M180 252V278" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 292V349" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="298" r="19" fill="#cfe4ee"/><text x="180" y="305" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">P</text><polygon points="150,361 180,341 210,361 199,396 161,396" fill="#f3dca7" stroke="#a87013" stroke-width="2"/><text x="180" y="375" font-size="15" fill="#163d48" text-anchor="middle" font-weight="400">Ribose</text><path d="M211 366H357" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="363" y="336" width="153" height="66" rx="12" fill="#e8e0f0" stroke="#86ada8" stroke-width="2"/><text x="439.5" y="367" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">U</text><path d="M180 397V423" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 437V494" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="443" r="19" fill="#cfe4ee"/><text x="180" y="450" font-size="20" fill="#316aaf" text-anchor="middle" font-weight="400">P</text><polygon points="150,506 180,486 210,506 199,541 161,541" fill="#f3dca7" stroke="#a87013" stroke-width="2"/><text x="180" y="520" font-size="15" fill="#163d48" text-anchor="middle" font-weight="400">Ribose</text><path d="M211 511H357" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="363" y="481" width="153" height="66" rx="12" fill="#e8e0f0" stroke="#86ada8" stroke-width="2"/><text x="439.5" y="512" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">G</text><text x="102" y="587" font-size="22" fill="#316aaf" text-anchor="start" font-weight="400">3′ end: free –OH</text><path d="M180 543V560" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="652" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">P = phosphate. U = uracil. Each ribose has 2′–OH.</text><text x="30" y="686" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Sugar–phosphate bonds form the covalent backbone.</text></g></svg>