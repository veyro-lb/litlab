<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" role="img" aria-labelledby="t d"><title id="t">Forest plant light strategies</title><desc id="d">Conceptual tropical forest profile with tall canopy tree, an epiphyte located on branch, a climbing liana, and broad-leaved shade understory plants.</desc><rect width="900" height="475" rx="17" fill="#f8fbfc"/><g font-family="Arial,sans-serif" fill="#173a45"><text x="29" y="36" font-size="24">Plant strategies for harvesting forest light</text><rect x="20" y="419" width="857" height="23" rx="8" fill="#987a5c"/><path d="M340 417 V135 M340 235 L195 181 M340 205 L514 160" stroke="#936d50" stroke-width="31" fill="none" stroke-linecap="round"/><g fill="#69af6d" stroke="#438854" stroke-width="3"><ellipse cx="326" cy="112" rx="151" ry="70"/><ellipse cx="188" cy="166" rx="103" ry="49"/><ellipse cx="491" cy="145" rx="108" ry="59"/></g><path d="M638 419 Q543 330 572 235 Q613 165 521 113" fill="none" stroke="#9b814b" stroke-width="13"/><path d="M639 410 Q578 320 618 241 Q653 192 594 145" fill="none" stroke="#487d4e" stroke-width="5"/><g fill="#80c77e" stroke="#438854"><ellipse cx="467" cy="171" rx="41" ry="20"/><ellipse cx="465" cy="190" rx="25" ry="16"/></g><g fill="#a2ce91" stroke="#628e6a"><ellipse cx="110" cy="399" rx="64" ry="29"/><ellipse cx="240" cy="400" rx="74" ry="23"/><ellipse cx="733" cy="404" rx="70" ry="25"/></g><g font-size="17"><text x="351" y="77">Canopy</text><text x="624" y="173">Liana</text><text x="16" y="240">Epiphyte</text><path d="M116 236 L431 185" stroke="#45835b" stroke-width="3"/><text x="33" y="369">Understory herbs</text><text x="600" y="386">Shade-tolerant shrubs</text></g><text x="28" y="462" font-size="13">Schematic profile, not to scale; epiphytes use trees for support rather than necessarily parasitizing them.</text></g></svg>