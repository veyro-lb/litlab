<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 475" role="img" aria-labelledby="t d"><title id="t">Fundamental and realized niche: conceptual model</title><desc id="d">A broad unfilled fundamental tolerance interval and a narrower filled realized occupancy interval against resource condition, illustrating competitive restriction. This is a conceptual model, not field data.</desc><rect width="900" height="475" rx="17" fill="#f9fbfc"/><g font-family="Arial,sans-serif" fill="#183847"><text x="31" y="38" font-size="24">Potential vs realized niche — one ecological dimension</text><path d="M105 79 V384 H777" fill="none" stroke="#244d63" stroke-width="3"/><text x="301" y="436" font-size="17">Abiotic condition or resource gradient</text><text x="27" y="72" font-size="15">Potential use</text><path d="M118 377 C217 372 270 167 418 130 C553 145 608 371 739 378" fill="none" stroke="#5288ad" stroke-width="6" stroke-dasharray="12 9"/><path d="M244 379 C288 327 333 202 421 183 C474 202 520 322 547 378 L244 378" fill="#a3d9c0" fill-opacity=".8" stroke="#2f916e" stroke-width="5"/><g font-size="17"><path d="M578 158 H629" stroke="#5288ad" stroke-width="5" stroke-dasharray="9 7"/><text x="641" y="165">Fundamental</text><rect x="574" y="195" width="49" height="16" fill="#a3d9c0" stroke="#2f916e"/><text x="641" y="210">Realized</text></g><text x="24" y="462" font-size="13">One-dimensional illustrative slice; true ecological niches involve many interacting variables.</text></g></svg>