<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Sodium-driven glucose uptake in epithelium</title><desc id="desc">Apical SGLT moves Na+ and glucose from the intestinal lumen into cytosol in the same direction. On the basolateral membrane, Na+/K+ ATPase moves 3 Na+ outward, 2 K+ inward, using ATP. GLUT can move glucose to blood by facilitated diffusion when the glucose gradient favors it; no universal SGLT sodium-to-glucose ratio is asserted.</desc><rect width="900" height="440" rx="16" fill="#f7fafc"/><text x="28" y="45" font-family="Arial,sans-serif" fill="#15364c" font-size="27" font-weight="700">Sodium-driven glucose uptake in epithelium</text><text x="50" y="105" font-family="Arial,sans-serif" font-size="22" fill="#173b53" text-anchor="middle"><tspan x="130">Intestinal</tspan><tspan x="130" dy="26">lumen</tspan></text><text x="435" y="105" font-family="Arial,sans-serif" font-size="22" fill="#173b53" text-anchor="middle">Epithelial cell cytosol</text><text x="773" y="105" font-family="Arial,sans-serif" font-size="22" fill="#173b53" text-anchor="middle">Blood-facing fluid</text><rect x="263" y="141" width="30" height="228" fill="#f4d78b"/><rect x="618" y="141" width="30" height="228" fill="#f4d78b"/><rect x="240" y="173" width="75" height="86" rx="21" fill="#a7d6ee" stroke="#37739a" stroke-width="3"/><text x="277" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#15364c" font-weight="700">SGLT</text><text x="277" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#15364c">symport</text><rect x="595" y="167" width="77" height="97" rx="21" fill="#a7d6ee" stroke="#37739a" stroke-width="3"/><text x="634" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#15364c" font-weight="700">Na/K</text><text x="634" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#15364c">pump</text><text x="634" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#15364c">ATP</text><rect x="595" y="304" width="77" height="56" rx="18" fill="#c5e8cf" stroke="#4f8664" stroke-width="3"/><text x="633" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#214634" font-weight="700">GLUT</text><g stroke="#167baa" stroke-width="7" fill="none" stroke-linecap="round"><path d="M 115 283 H 405"/><path d="M 115 323 H 405"/><path d="M 493 182 H 757"/><path d="M 757 251 H 490"/><path d="M 505 330 H 763"/></g><g stroke="#167baa" stroke-width="6" fill="none" stroke-linecap="round"><path d="M 389 269 l 18 14 -18 14 M 389 309 l 18 14 -18 14 M 742 169 l 18 13 -18 13 M 507 237 l -18 14 18 14 M 745 316 l 18 14 -18 14"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#165373" font-weight="700"><text x="154" y="274">Na⁺ downhill</text><text x="145" y="314">Glucose uptake</text><text x="686" y="170">3 Na⁺ out</text><text x="682" y="273">2 K⁺ in</text><text x="688" y="322">Glucose out</text></g><text x="279" y="392" fill="#705321" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Apical</text><text x="632" y="392" fill="#705321" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Basolateral</text><text x="30" y="417" fill="#506575" font-family="Arial,sans-serif" font-size="17">Original schematic · not a molecular structure or observation</text></svg>