<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Na⁺/K⁺-ATPase: directions and net charge</title><desc id="desc">Across the plasma membrane, each ATP-driven alternating-access cycle moves three Na+ out of the cytosol and two K+ into the cytosol. One net positive charge exits. Blue arrows are net transport directions, not a continuously open channel.</desc><rect width="900" height="440" rx="16" fill="#f7fafc"/><text x="28" y="45" font-family="Arial,sans-serif" fill="#15364c" font-size="27" font-weight="700">Na⁺/K⁺-ATPase: directions and net charge</text><text x="36" y="86" font-family="Arial,sans-serif" font-size="19" fill="#31536b">Outside cell / extracellular fluid</text><rect x="45" y="169" width="810" height="97" rx="20" fill="#f8e2ae" stroke="#aa842e" stroke-width="2"/><text x="36" y="338" font-family="Arial,sans-serif" font-size="19" fill="#31536b">Cytosol / inside cell</text><rect x="353" y="159" width="194" height="118" rx="47" fill="#a6d8f0" stroke="#286787" stroke-width="5"/><text x="450" y="200" font-family="Arial,sans-serif" font-size="23" fill="#123c53" text-anchor="middle" font-weight="700">Na⁺/K⁺</text><text x="450" y="231" font-family="Arial,sans-serif" font-size="23" fill="#123c53" text-anchor="middle" font-weight="700">ATPase</text><text x="450" y="256" font-family="Arial,sans-serif" font-size="15" fill="#123c53" text-anchor="middle">alternating access</text><path d="M 270 301 V 125 M 630 126 V 306" stroke="#1774ab" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M 251 142 L 270 119 L 289 142 M 611 288 L 630 311 L 649 288" stroke="#1774ab" stroke-width="9" fill="none" stroke-linecap="round"/><text x="268" y="111" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#115d88" font-weight="700">3 Na⁺ OUT</text><text x="628" y="360" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#115d88" font-weight="700">2 K⁺ IN</text><text x="450" y="372" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#613f13">1 ATP → ADP + Pi per cycle</text><text x="730" y="110" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#365367">Net +1 charge</text><text x="730" y="132" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#365367">moves out</text><text x="30" y="417" fill="#506575" font-family="Arial,sans-serif" font-size="17">Original schematic · not a molecular structure or observation</text></svg>