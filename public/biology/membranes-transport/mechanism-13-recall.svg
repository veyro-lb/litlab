<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 777" role="img" aria-labelledby="title desc"><title id="title">Endocytosis and exocytosis</title><desc id="desc">Original membrane-topology model. Endocytosis: plasma membrane invaginates around extracellular cargo and closes to form an internal vesicle. Exocytosis: cytosolic vesicle fuses with the plasma membrane and exposes cargo to the exterior. Different successive states separated by arrows; not a channel.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="777" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><path d="M30 208H190Q228 208 228 245Q228 296 271 296Q315 296 315 245Q315 208 353 208H570" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="254" r="12" fill="#a87013"/><path d="M357 256H401" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><circle cx="461" cy="292" r="39" fill="#dceef1"/><circle cx="461" cy="292" r="12" fill="#a87013"/><circle cx="131" cy="565" r="38" fill="#dceef1"/><circle cx="131" cy="565" r="12" fill="#a87013"/><path d="M188 552H228" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><path d="M30 493H321Q351 493 351 530Q351 570 397 570Q443 570 443 530Q443 493 478 493H570" fill="none" stroke="#147d83" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="397" cy="520" r="12" fill="#a87013"/><path d="M397 505V463" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><circle cx="397" cy="447" r="10" fill="#a87013"/><text x="28" y="40" font-size="23" fill="#163d48">Recall the structures and mechanism</text></g></svg>