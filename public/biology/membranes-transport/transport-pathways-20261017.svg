<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Membrane transport mechanisms compared</title><desc id="desc">Six-route comparison table. Simple diffusion of oxygen uses lipid bilayer downhill without ATP. Osmosis moves water down water-potential gradient through bilayer or aquaporins without ATP. Ion channels allow downhill electrochemical diffusion without ATP. GLUT carriers permit downhill facilitated diffusion without ATP. Sodium-potassium ATPase pumps ions against gradients using direct ATP hydrolysis. Sodium–glucose symport couples downhill sodium entry to uphill glucose transport and depends on the sodium gradient maintained by ATP-dependent pumps.</desc><rect width="1120" height="650" rx="16" fill="#fbfdfb"/><text x="30" y="45" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#193c45" font-weight="700">How substances cross a membrane</text><text x="30" y="73" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#193c45">Compare pathway, direction of net movement and ATP coupling</text><rect x="24" y="94" width="1072" height="50" rx="8" fill="#deebed"/><text x="40" y="127" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Process / example</text><text x="332" y="127" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Route through membrane</text><text x="622" y="127" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Net driving force</text><text x="868" y="127" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">ATP at transporter</text><rect x="24" y="145" width="1072" height="72" fill="#f3f8f7" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Simple diffusion · O₂</text><text x="332" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Lipid bilayer</text><text x="622" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Down concentration gradient</text><text x="868" y="188" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">None</text><rect x="24" y="217" width="1072" height="72" fill="#fff" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="260" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Osmosis · H₂O</text><text x="332" y="260" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Bilayer / aquaporin</text><text x="622" y="260" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Down water-potential gradient</text><text x="868" y="260" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">None</text><rect x="24" y="289" width="1072" height="72" fill="#f3f8f7" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Channel diffusion · K⁺</text><text x="332" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Selective ion channel</text><text x="622" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Down electrochemical gradient</text><text x="868" y="332" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">None</text><rect x="24" y="361" width="1072" height="72" fill="#fff" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="404" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Carrier diffusion · glucose</text><text x="332" y="404" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Facilitated carrier (GLUT)</text><text x="622" y="404" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Down concentration gradient</text><text x="868" y="404" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">None</text><rect x="24" y="433" width="1072" height="72" fill="#f3f8f7" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="476" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Primary active · Na⁺/K⁺</text><text x="332" y="476" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">ATP-driven exchange pump</text><text x="622" y="476" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Against ion gradients</text><text x="868" y="476" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Direct: ATP hydrolysis</text><rect x="24" y="505" width="1072" height="72" fill="#fff" stroke="#d4e3e2" stroke-width="1"/><text x="40" y="548" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#193c45" font-weight="700">Secondary active · glucose</text><text x="332" y="548" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Na⁺–glucose symporter</text><text x="622" y="548" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Glucose uphill; Na⁺ downhill</text><text x="868" y="548" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Indirect: Na⁺ gradient</text><text x="34" y="619" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#193c45">Downhill = passive; a cotransporter can move one solute uphill by coupling it to another solute downhill.</text></svg>
