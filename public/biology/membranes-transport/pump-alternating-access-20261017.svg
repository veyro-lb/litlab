<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">An ATP-driven pump alternates access</title><desc id="desc">The binding pocket opens to one side, becomes occluded, then opens to the opposite side. An ATP-coupled conformational cycle can move a particle uphill; no always-open pore traverses the bilayer.</desc><rect width="900" height="440" rx="16" fill="#f7fafc"/><text x="28" y="45" font-family="Arial,sans-serif" fill="#15364c" font-size="27" font-weight="700">An ATP-driven pump alternates access</text><rect x="24" y="98" width="266" height="285" rx="12" fill="#fff" stroke="#d0dbe4" stroke-width="2"/><text x="157" y="128" fill="#193a50" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">1 · Bind inside</text><rect x="310" y="98" width="266" height="285" rx="12" fill="#fff" stroke="#d0dbe4" stroke-width="2"/><text x="443" y="128" fill="#193a50" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">2 · ATP-coupled change</text><rect x="596" y="98" width="266" height="285" rx="12" fill="#fff" stroke="#d0dbe4" stroke-width="2"/><text x="729" y="128" fill="#193a50" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">3 · Release outside</text><rect x="55" y="211" width="204" height="53" rx="12" fill="#f6dc9e"/><path d="M 55 212 h 204 M 55 264 h 204" stroke="#a8741f" stroke-width="4" fill="none"/><rect x="113" y="194" width="88" height="88" rx="36" fill="#a8d7f0" stroke="#306a8c" stroke-width="4"/><path d="M 141 283 v -44 Q 157 224 173 239" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><text x="157" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Extracellular</text><text x="157" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Cytosol</text><rect x="341" y="211" width="204" height="53" rx="12" fill="#f6dc9e"/><path d="M 341 212 h 204 M 341 264 h 204" stroke="#a8741f" stroke-width="4" fill="none"/><rect x="399" y="194" width="88" height="88" rx="36" fill="#a8d7f0" stroke="#306a8c" stroke-width="4"/><path d="M 427 235 q 16 -16 32 0" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><text x="443" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Extracellular</text><text x="443" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Cytosol</text><rect x="627" y="211" width="204" height="53" rx="12" fill="#f6dc9e"/><path d="M 627 212 h 204 M 627 264 h 204" stroke="#a8741f" stroke-width="4" fill="none"/><rect x="685" y="194" width="88" height="88" rx="36" fill="#a8d7f0" stroke="#306a8c" stroke-width="4"/><path d="M 713 193 v 44 Q 729 252 745 237" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/><text x="729" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Extracellular</text><text x="729" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#365367">Cytosol</text><circle cx="157" cy="316" r="10" fill="#eb785a"/><text x="157" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244d64">Substrate binds</text><text x="443" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244d64">No continuous pore</text><circle cx="729" cy="182" r="10" fill="#eb785a"/><text x="729" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#244d64">Substrate released</text><text x="30" y="417" fill="#506575" font-family="Arial,sans-serif" font-size="17">Original schematic · not a molecular structure or observation</text></svg>