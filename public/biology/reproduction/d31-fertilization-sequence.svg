<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-label="Human fertilization: chromosome and membrane events"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#317a75"/></marker></defs><rect width="1160" height="500" fill="#fff" rx="20"/><text x="36" y="55" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#173c3a">Human fertilization: chromosome and membrane events</text><rect x="31" y="145" width="207" height="198" rx="14" fill="#e4f3ed" stroke="#a7c9c2" stroke-width="1.5"/><text x="42" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Acrosome reaction</text><text x="42" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">helps sperm penetrate</text><path d="M 241 244 L 250 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="255" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="266" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Sperm and egg</text><text x="266" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">membranes fuse</text><path d="M 465 244 L 474 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="479" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="490" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Sperm nucleus enters;</text><text x="490" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">tail / mitochondria</text><text x="490" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">are degraded</text><path d="M 689 244 L 698 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="703" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="714" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">Nuclear envelopes</text><text x="714" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">break down</text><path d="M 913 244 L 922 244" stroke="#317a75" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="927" y="145" width="207" height="198" rx="14" fill="#f3f8f7" stroke="#a7c9c2" stroke-width="1.5"/><text x="938" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173c3a">First shared mitosis</text><text x="938" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">forms two diploid</text><text x="938" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">daughter nuclei</text><text x="34" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#173c3a">Do not draw permanent fusion of two intact nuclei.</text><text x="34" y="461" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#173c3a">Original BioLab explanatory diagram · conceptual, not measured data</text></svg>