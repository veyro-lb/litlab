<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
<title id="title">Endocrine control of the ovarian and uterine cycles</title>
<desc id="desc">FSH supports follicle growth and oestradiol release. Sustained high oestradiol produces positive feedback and the LH surge triggering ovulation. The corpus luteum secretes progesterone, supporting the uterine lining and applying negative feedback. Corpus luteum regression reduces progesterone and leads to menstruation when pregnancy does not occur.</desc>
