<g font-family="Arial,sans-serif" font-size="17" fill="#143b62"><text x="624" y="43">Sustained high oestradiol:</text><text x="660" y="62">positive feedback → LH surge</text><text x="398" y="348">Progesterone: negative feedback</text><text x="397" y="375">on LH / FSH; cycle-dependent</text></g>
