<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 450" role="img" aria-labelledby="t d"><title id="t">Population separation and possible speciation</title><desc id="d">An ancestral population at top branches into separate environments through reduced gene flow, with different inherited variants becoming common. This illustrates a potential path to reproductive isolation, not inevitable progression.</desc><rect width="870" height="450" rx="20" fill="#f3fafc"/><g fill="#e0eff5" stroke="#12566e" stroke-width="2"><rect x="278" y="38" width="315" height="77" rx="18"/><rect x="74" y="237" width="320" height="100" rx="18"/><rect x="476" y="237" width="320" height="100" rx="18"/></g><g font-family="Arial" font-size="21" fill="#123647" text-anchor="middle"><text x="435" y="71">Ancestral population</text><text x="435" y="96" font-size="16">Alleles shared; gene flow</text><text x="235" y="268">Population A</text><text x="235" y="297" font-size="17">Local selection + drift</text><text x="635" y="268">Population B</text><text x="635" y="297" font-size="17">Other local pressures</text><text x="435" y="172">Barrier reduces gene flow</text><text x="435" y="375" font-size="18">Accumulating divergence may lead to reproductive isolation</text><text x="435" y="409" font-size="16">Conceptual pathway · no experimental timescale · speciation not guaranteed</text></g><g stroke="#25859c" stroke-width="5" fill="none" stroke-linecap="round"><path d="M435 116 V139 H235 V224"/><path d="M435 139 H635 V224"/></g><g stroke="#25859c" stroke-width="3" fill="none"><path d="M228 217 L235 228 L242 217"/><path d="M628 217 L635 228 L642 217"/></g></svg>