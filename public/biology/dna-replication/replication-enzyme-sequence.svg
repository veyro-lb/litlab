<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-labelledby="title desc">
<title id="title">Four enzyme roles during prokaryotic DNA replication</title>
<desc id="desc">Primase lays an RNA primer, DNA polymerase III extends DNA from its 3-prime end, DNA polymerase I replaces the RNA with DNA, and ligase seals the remaining nick. Each newly made DNA segment extends five-prime to three-prime.</desc>
<rect width="1000" height="356" rx="18" fill="#f8fafc"/>
<text x="30" y="38" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Lagging-strand fragment: four distinct enzyme jobs</text>
<text x="30" y="61" font-family="system-ui,sans-serif" font-size="14" fill="#475569">IB D1.1.8 · prokaryotic model · conceptual sequence (not drawn to scale)</text>
<g font-family="system-ui,sans-serif">
<rect x="24" y="82" width="222" height="220" rx="15" fill="#eaf2ff" stroke="#c0d7ff"/>
<rect x="267" y="82" width="222" height="220" rx="15" fill="#eaf7f2" stroke="#bbe6d4"/>
<rect x="510" y="82" width="222" height="220" rx="15" fill="#fff6e6" stroke="#f5daa3"/>
<rect x="753" y="82" width="222" height="220" rx="15" fill="#f1edff" stroke="#d5c8fa"/>
<g fill="#0f172a" font-size="16" font-weight="700">
<text x="40" y="113">1 · Primase</text><text x="283" y="113">2 · DNA polymerase III</text><text x="526" y="113">3 · DNA polymerase I</text><text x="769" y="113">4 · DNA ligase</text>
</g>
<g fill="#334155" font-size="13.5">
<text x="40" y="140">Makes a short RNA primer</text><text x="40" y="158">with a free 3′ end.</text>
<text x="283" y="140">Adds DNA nucleotides to</text><text x="283" y="158">the primer's 3′ end.</text>
<text x="526" y="140">Removes RNA primer and</text><text x="526" y="158">replaces it with DNA.</text>
<text x="769" y="140">Seals the remaining nick</text><text x="769" y="158">in the DNA backbone.</text>
</g>
<g stroke-linecap="round" stroke-width="8" fill="none">
<path d="M43 214H117" stroke="#2563eb"/><path d="M117 214H221" stroke="#f97316"/>
<path d="M286 214H320" stroke="#2563eb"/><path d="M320 214H461" stroke="#168a6e"/>
<path d="M529 214H705" stroke="#168a6e"/>
<path d="M771 214H946" stroke="#168a6e"/>
</g>
<g stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"><path d="M117 201V227"/><path d="M802 201V227"/></g>
<g fill="#475569" font-size="12"><text x="42" y="247">RNA (blue) + template</text><text x="285" y="247">New DNA (green)</text><text x="527" y="247">RNA now replaced</text><text x="769" y="247">Continuous DNA strand</text></g>
<g fill="#64748b" font-size="26" font-weight="700"><text x="245" y="214">›</text><text x="488" y="214">›</text><text x="731" y="214">›</text></g>
<text x="29" y="330" font-size="15" fill="#0f172a" font-weight="600">All DNA polymerization is 5′ → 3′. A fresh primer starts each Okazaki fragment.</text>
</g></svg>