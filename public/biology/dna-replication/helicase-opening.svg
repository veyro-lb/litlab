<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 624" role="img" aria-labelledby="title desc"><title id="title">Helicase separates the DNA strands</title><desc id="desc">DNA duplex to the right of helicase opens into two strands to its left as the enzyme advances right. Solid blue rails are intact covalent sugar-phosphate backbones. Short vertical coloured bars denote bases, with dashed hydrogen-bond contacts between paired bases. Helicase uses ATP; no cutting of the backbone is shown. Simplified model, not to scale.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="624" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Helicase separates the DNA strands</text><text x="28" y="77" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Unwound DNA behind · paired DNA ahead</text><path d="M50 150Q200 145 350 228H570" fill="none" stroke="#316aaf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 410Q200 415 350 332H570" fill="none" stroke="#316aaf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 232V270" fill="none" stroke="#147d83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 294V328" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 272V292" fill="none" stroke="#b84c6f" stroke-width="2" stroke-dasharray="3 3"/><path d="M450 232V270" fill="none" stroke="#147d83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 294V328" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 272V292" fill="none" stroke="#b84c6f" stroke-width="2" stroke-dasharray="3 3"/><path d="M490 232V270" fill="none" stroke="#147d83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 294V328" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 272V292" fill="none" stroke="#b84c6f" stroke-width="2" stroke-dasharray="3 3"/><path d="M530 232V270" fill="none" stroke="#147d83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 294V328" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 272V292" fill="none" stroke="#b84c6f" stroke-width="2" stroke-dasharray="3 3"/><path d="M565 232V270" fill="none" stroke="#147d83" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 294V328" fill="none" stroke="#a87013" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 272V292" fill="none" stroke="#b84c6f" stroke-width="2" stroke-dasharray="3 3"/><circle cx="339" cy="280" r="46" fill="#f0d5b4"/><text x="339" y="286" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">Helicase</text><path d="M355 141H540" fill="none" stroke="#147d83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="432" y="122" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">Movement</text><text x="28" y="234" font-size="21" fill="#316aaf" text-anchor="start" font-weight="400">Separated strands</text><text x="28" y="335" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">Covalent backbones</text><text x="28" y="363" font-size="20" fill="#316aaf" text-anchor="start" font-weight="400">remain intact</text><text x="391" y="388" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Paired bases</text><path d="M474 373L488 293" fill="none" stroke="#147d83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="478" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Helicase uses energy from ATP to separate</text><text x="30" y="506" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">the two strands, disrupting hydrogen bonds</text><text x="30" y="534" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">between complementary bases.</text><text x="30" y="591" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Schematic opening fork; enzyme shape is symbolic.</text></g></svg>