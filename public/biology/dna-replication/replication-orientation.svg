<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Opposite strand polarities at a right-moving replication fork</title><desc id="d">Leading template is 3 prime to 5 prime from left to right and the new leading strand grows 5 prime to 3 prime toward the fork. Lagging template is 5 prime to 3 prime from left to right. Each daughter Okazaki fragment grows 5 prime to 3 prime toward the left, away from the fork.</desc><rect width="960" height="500" fill="#f7fbff"/><text x="50" y="46" font-family="sans-serif" font-size="24" fill="#12385a" font-weight="700">One fork moving right →</text><text x="52" y="101" font-family="sans-serif" font-size="21" fill="#12385a">LEADING · continuous</text><text x="50" y="143" font-family="sans-serif" font-size="19">parental template 3′</text><line x1="280" y1="137" x2="830" y2="137" stroke="#204c7d" stroke-width="8" stroke-linecap="round"/><text x="849" y="145" font-size="22" font-family="sans-serif">5′</text><text x="50" y="188" font-family="sans-serif" font-size="19">new strand 5′</text><line x1="280" y1="182" x2="810" y2="182" stroke="#1a9a86" stroke-width="8"/><path d="M810 169 L836 182 L810 195" fill="none" stroke="#1a9a86" stroke-width="7"/><text x="849" y="190" font-size="22" font-family="sans-serif">3′</text><text x="52" y="269" font-family="sans-serif" font-size="21" fill="#12385a">LAGGING · discontinuous</text><text x="50" y="318" font-family="sans-serif" font-size="19">parental template 5′</text><line x1="280" y1="311" x2="830" y2="311" stroke="#204c7d" stroke-width="8" stroke-linecap="round"/><text x="849" y="320" font-size="22" font-family="sans-serif">3′</text><text x="50" y="373" font-family="sans-serif" font-size="19">new fragments</text><line x1="300" y1="367" x2="485" y2="367" stroke="#b65b89" stroke-width="8"/><path d="M300 354 L276 367 L300 380" stroke="#b65b89" stroke-width="7" fill="none"/><line x1="580" y1="367" x2="790" y2="367" stroke="#b65b89" stroke-width="8"/><path d="M580 354 L556 367 L580 380" stroke="#b65b89" stroke-width="7" fill="none"/><text x="265" y="407" font-size="18" font-family="sans-serif">3′</text><text x="470" y="407" font-size="18" font-family="sans-serif">5′</text><text x="543" y="407" font-size="18" font-family="sans-serif">3′</text><text x="774" y="407" font-size="18" font-family="sans-serif">5′</text><text x="50" y="468" font-family="sans-serif" font-size="18" fill="#385169">Arrows on new strands show 5′→3′ elongation; schematic orientation model, not to scale.</text></svg>