<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Replication enzymes divide the work</title><desc id="desc">Prokaryotic model: primase lays RNA primer; DNA polymerase III extends DNA 5 prime to 3 prime; DNA polymerase I replaces primer with DNA; ligase seals phosphodiester backbone nicks. Each horizontal strip is a successive state of one fragment, not a replication fork.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="740" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Replication enzymes divide the work</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Bacterial lagging strand · one fragment at a time</text><text x="30" y="124" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">1 · Primase</text><text x="30" y="154" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">makes an RNA primer</text><path d="M80 191H180" fill="none" stroke="#b84c6f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="199" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">5′</text><text x="200" y="199" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3′</text><path d="M300 208V228" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="30" y="261" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">2 · DNA polymerase III</text><text x="30" y="291" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">adds DNA to the primer’s 3′ end</text><path d="M80 328H180" fill="none" stroke="#b84c6f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 328H502" fill="none" stroke="#147d83" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="336" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">5′</text><text x="529" y="336" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3′</text><path d="M300 345V365" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="30" y="398" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">3 · DNA polymerase I</text><text x="30" y="428" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">replaces RNA primer with DNA</text><path d="M80 465H285" fill="none" stroke="#147d83" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M299 465H502" fill="none" stroke="#147d83" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="473" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">5′</text><text x="529" y="473" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3′</text><path d="M300 482V502" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="30" y="535" font-size="23" fill="#163d48" text-anchor="start" font-weight="600">4 · DNA ligase</text><text x="30" y="565" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">seals the remaining backbone nick</text><path d="M80 602H502" fill="none" stroke="#147d83" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="610" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">5′</text><text x="529" y="610" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">3′</text><text x="30" y="682" font-size="21" fill="#b84c6f" text-anchor="start" font-weight="400">RNA primer</text><text x="220" y="682" font-size="21" fill="#147d83" text-anchor="start" font-weight="400">New DNA</text><text x="30" y="716" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">All DNA extension is 5′ → 3′. Stages are simplified.</text></g></svg>