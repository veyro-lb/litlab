<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 500" role="img" aria-labelledby="title desc"><title id="title">Rooted simplified vertebrate cladogram</title><desc id="desc">Lancelet outgroup, shark, ray-finned fish, frog and mouse shown on branching tree. Frog and mouse are sister groups. Node circles identify hypothetical ancestors. Trait ticks mark nested derived features. Branch lengths are not time or molecular distances.</desc><rect width="990" height="500" rx="16" fill="#f4fafb"/><g fill="none" stroke="#125c74" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M55 434 H148 V85 H720"/><path d="M148 434 H282 V166 H720"/><path d="M282 434 H417 V247 H720"/><path d="M417 434 H555 V329 H720"/><path d="M555 434 H720"/></g><g fill="#1389a6" stroke="#ffffff" stroke-width="3"><circle cx="148" cy="434" r="8"/><circle cx="282" cy="434" r="8"/><circle cx="417" cy="434" r="8"/><circle cx="555" cy="434" r="8"/></g><g font-size="24" font-family="Arial,sans-serif" fill="#133647"><text x="737" y="92">Lancelet (outgroup)</text><text x="737" y="174">Shark</text><text x="737" y="256">Ray-finned fish</text><text x="737" y="337">Frog</text><text x="737" y="442">Mouse</text></g><g stroke="#d2772d" stroke-width="5"><path d="M171 420 V449 M229 420 V449 M348 420 V449 M491 420 V449 M619 420 V449"/></g><g font-size="17" font-family="Arial,sans-serif" fill="#985310"><text x="147" y="478">Cranium</text><text x="219" y="407">Jaws</text><text x="296" y="478">Bony skeleton</text><text x="456" y="407">Four limbs</text><text x="618" y="478">Amnion (mouse)</text></g><g font-size="18" font-family="Arial" fill="#34505b"><text x="42" y="456">Root side</text><text x="35" y="40">Rooted schematic · nodes denote hypothetical common ancestors · not scaled to time</text></g></svg>