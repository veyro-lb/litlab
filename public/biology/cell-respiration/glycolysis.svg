<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="35" y="42" font-size="25" font-weight="600">Glycolysis — cytosol</text><rect x="38" y="94" width="150" height="70" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="52" y="129" font-size="19" font-weight="600">Glucose 6C</text><path d="M192 125 L305 125" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="307" y="94" width="235" height="70" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="321" y="129" font-size="19" font-weight="600">Phosphorylate → split</text><path d="M548 125 L665 125" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="669" y="94" width="155" height="70" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="683" y="129" font-size="19" font-weight="600">2 pyruvate 3C</text><text x="80" y="248" font-size="20" font-weight="600">Invest: 2 ATP</text><text x="345" y="248" font-size="20" font-weight="600">Form: 4 ATP</text><text x="600" y="248" font-size="20" font-weight="600">Net: 2 ATP</text><text x="120" y="312" font-size="21" font-weight="600">2 NAD⁺ → 2 NADH; each step is enzyme-catalysed.</text></g></svg>
