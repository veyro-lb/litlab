<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="50" y="45" font-size="24" font-weight="600">ATP cycling couples energy transfer to cellular work</text><rect x="85" y="100" width="230" height="80" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="99" y="135" font-size="19" font-weight="600">ATP + H₂O</text><path d="M315 140 L535 140" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="545" y="100" width="235" height="80" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="559" y="135" font-size="19" font-weight="600">ADP + Pi</text><text x="325" y="115" font-size="17" font-weight="600">hydrolysis → work</text><path d="M650 210 L215 210" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="260" y="245" font-size="19" font-weight="600">regeneration requires energy</text><text x="50" y="315" font-size="19" font-weight="600">Energy is conserved; ATP is continually regenerated.</text></g></svg>
