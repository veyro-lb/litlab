<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="38" y="42" font-size="25" font-weight="600">Carbohydrate and lipid entry points</text><rect x="36" y="102" width="220" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="50" y="137" font-size="19" font-weight="600">Glucose</text><path d="M258 132 L370 132" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="376" y="102" width="198" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="390" y="137" font-size="19" font-weight="600">Glycolysis</text><path d="M570 173 L622 238" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="37" y="250" width="260" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="51" y="285" font-size="19" font-weight="600">Fatty acids</text><path d="M290 283 L440 283" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="449" y="250" width="340" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="463" y="285" font-size="19" font-weight="600">β-oxidation → acetyl-CoA</text><text x="68" y="359" font-size="19" font-weight="600">Fatty acids do not enter glycolysis or lactate fermentation.</text></g></svg>
