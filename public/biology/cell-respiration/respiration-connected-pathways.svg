<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1110" role="img" aria-label="Original schematic · per glucose · not an ATP-yield-to-scale graph"><rect width="760" height="1110" fill="#ffffff"/><text x="36" y="45" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#10263b">Cell respiration: connected pathways</text><text x="36" y="76" font-size="16" font-family="Arial,sans-serif" fill="#475569">Original schematic · per glucose · not an ATP-yield-to-scale graph</text><rect x="40" y="102" width="680" height="110" rx="14" fill="#e8f4f7" stroke="#cad5df" stroke-width="1.5"/><text x="66" y="133" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#17324d">CYTOSOL — glycolysis</text><text x="66" y="167" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Glucose (6C) → 2 pyruvate (3C each)</text><text x="66" y="195" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Net: 2 ATP + 2 reduced NAD (NADH)</text><path d="M380 216 V239" fill="none" stroke="#155e75" stroke-width="3"/><path d="M371 228 L380 239 L389 228" fill="none" stroke="#155e75" stroke-width="3"/><rect x="40" y="243" width="680" height="116" rx="14" fill="#eff6ff" stroke="#cad5df" stroke-width="1.5"/><text x="66" y="274" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#17324d">MITOCHONDRIAL MATRIX — link reaction</text><text x="66" y="308" font-size="19" font-family="Arial,sans-serif" fill="#10263b">2 pyruvate → 2 acetyl-CoA (2C each)</text><text x="66" y="336" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Outputs: 2 CO₂ + 2 reduced NAD</text><path d="M380 364 V390" fill="none" stroke="#155e75" stroke-width="3"/><path d="M371 379 L380 390 L389 379" fill="none" stroke="#155e75" stroke-width="3"/><rect x="40" y="394" width="680" height="145" rx="14" fill="#eff6ff" stroke="#cad5df" stroke-width="1.5"/><text x="66" y="425" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#17324d">MITOCHONDRIAL MATRIX — Krebs cycle</text><text x="66" y="459" font-size="19" font-family="Arial,sans-serif" fill="#10263b">2 acetyl-CoA enter; oxaloacetate is regenerated</text><text x="66" y="487" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Outputs per glucose: 4 CO₂ + 2 ATP equivalents</text><text x="66" y="515" font-size="19" font-family="Arial,sans-serif" fill="#10263b">6 reduced NAD + 2 reduced FAD (FADH₂)</text><path d="M380 544 V570" fill="none" stroke="#155e75" stroke-width="3"/><path d="M371 559 L380 570 L389 559" fill="none" stroke="#155e75" stroke-width="3"/><rect x="40" y="574" width="680" height="141" rx="14" fill="#f3f5fa" stroke="#cad5df" stroke-width="1.5"/><text x="66" y="605" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#17324d">INNER MEMBRANE — electron transport</text><text x="66" y="639" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Reduced carriers donate electrons; NAD⁺ is recycled</text><text x="66" y="667" font-size="19" font-family="Arial,sans-serif" fill="#10263b">Electron transfers pump H⁺: matrix → intermembrane space</text><text x="66" y="695" font-size="19" font-family="Arial,sans-serif" fill="#10263b">O₂ accepts electrons and H⁺ → metabolic H₂O</text><path d="M380 720 V747" fill="none" stroke="#155e75" stroke-width="3"/><path d="M371 736 L380 747 L389 736" fill="none" stroke="#155e75" stroke-width="3"/><rect x="40" y="751" width="680" height="128" rx="14" fill="#ecfdf5" stroke="#cad5df" stroke-width="1.5"/><text x="66" y="782" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#17324d">ATP SYNTHASE — chemiosmosis</text><text x="66" y="816" font-size="19" font-family="Arial,sans-serif" fill="#10263b">H⁺ returns: intermembrane space → matrix</text><text x="66" y="844" font-size="19" font-family="Arial,sans-serif" fill="#10263b">ATP synthase couples H⁺ flow to ADP + Pi → ATP</text><rect x="40" y="901" width="680" height="138" rx="14" fill="#f8fafc" stroke="#d2dce5"/><text x="62" y="936" font-size="19" font-weight="700" font-family="Arial,sans-serif" fill="#10263b">Important distinctions</text><text x="62" y="970" font-size="18" font-family="Arial,sans-serif" fill="#334155">• Cytosolic NADH reducing equivalents use shuttles to reach the chain.</text><text x="62" y="998" font-size="18" font-family="Arial,sans-serif" fill="#334155">• ATP from glycolysis and the Krebs cycle is formed directly.</text><text x="62" y="1026" font-size="18" font-family="Arial,sans-serif" fill="#334155">• Most aerobic ATP production is coupled to the proton gradient.</text><text x="40" y="1080" font-size="15" font-family="Arial,sans-serif" fill="#475569">Mechanistic orientation is shown; no fixed total ATP yield is asserted.</text></svg>