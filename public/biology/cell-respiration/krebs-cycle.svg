<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" role="img" aria-labelledby="title desc"><title id="title">Krebs cycle: carbon returns to 4C</title><desc id="desc">Acetyl 2C joins oxaloacetate 4C to make citrate 6C. Two decarboxylations form 4C intermediates; oxidation regenerates oxaloacetate. Per turn: two CO2, three NADH, one FADH2 and one ATP equivalent. Intermediate steps grouped; not to scale.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="730" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Krebs cycle: carbon returns to 4C</text><text x="28" y="76" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Mitochondrial matrix · one acetyl group per turn</text><rect x="50" y="126" width="220" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="160.0" y="157" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Oxaloacetate</text><text x="160.0" y="186" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">4C</text><rect x="334" y="126" width="220" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="444.0" y="157" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Citrate</text><text x="444.0" y="186" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">6C</text><path d="M272 163H329" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="301" y="111" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">+ acetyl 2C</text><path d="M444 208V278" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="334" y="286" width="220" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="444.0" y="317" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">5C intermediate</text><text x="306" y="244" font-size="22" fill="#b84c6f" text-anchor="end" font-weight="400">CO₂</text><text x="306" y="273" font-size="21" fill="#316aaf" text-anchor="end" font-weight="400">NADH</text><path d="M444 368V438" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="334" y="446" width="220" height="77" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="444.0" y="477" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">4C intermediates</text><text x="306" y="403" font-size="22" fill="#b84c6f" text-anchor="end" font-weight="400">CO₂</text><text x="306" y="432" font-size="21" fill="#316aaf" text-anchor="end" font-weight="400">NADH</text><path d="M330 485H159V209" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><text x="145" y="371" font-size="20" fill="#163d48" text-anchor="middle" font-weight="400">Regeneration</text><text x="170" y="552" font-size="21" fill="#316aaf" text-anchor="start" font-weight="400">ATP + NADH + FADH₂</text><rect x="28" y="585" width="544" height="117" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="48" y="618" font-size="22" fill="#163d48" text-anchor="start" font-weight="600">Per turn: 2 CO₂, 3 NADH, 1 FADH₂</text><text x="48" y="650" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">and 1 ATP equivalent. Four oxidations.</text><text x="48" y="681" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">Two turns per glucose. CoA recycled.</text></g></svg>