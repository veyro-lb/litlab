<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="40" y="42" font-size="24" font-weight="600">Krebs cycle carbon balance — matrix</text><rect x="33" y="110" width="165" height="68" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="47" y="145" font-size="19" font-weight="600">Acetyl 2C</text><rect x="35" y="235" width="245" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="49" y="270" font-size="19" font-weight="600">Oxaloacetate 4C</text><path d="M202 146 L382 184" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M282 255 L385 205" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="400" y="159" width="220" height="70" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="414" y="194" font-size="19" font-weight="600">Citrate 6C</text><path d="M625 190 L770 245" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="498" y="300" font-size="21" font-weight="600">2 CO₂ per turn</text><text x="36" y="347" font-size="17" font-weight="600">Oxaloacetate is regenerated; each turn includes four oxidations.</text></g></svg>
