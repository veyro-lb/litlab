<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">NADH transfers electrons into the mitochondrial electron transport chain</title>
<desc id="desc">In the mitochondrial matrix, reduced NAD from glycolysis, the link reaction and Krebs cycle gives an electron pair to the first electron carrier of the inner-membrane chain, becoming NAD plus. Electron movement along the chain supplies energy to pump protons toward the intermembrane space. ATP synthesis occurs later by proton return through ATP synthase, not by direct conversion of NADH into ATP.</desc>
<rect width="960" height="300" rx="18" fill="#f8fafc"/>
<text x="30" y="35" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">How reduced NAD transfers energy</text>
<text x="30" y="64" font-family="Arial,sans-serif" font-size="14" fill="#334155">Mitochondrial matrix</text>
<rect x="26" y="80" width="274" height="130" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="43" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#075985">Reduced NAD (NADH)</text>
<text x="43" y="139" font-family="Arial,sans-serif" font-size="15" fill="#075985">Made during glycolysis,</text>
<text x="43" y="161" font-family="Arial,sans-serif" font-size="15" fill="#075985">link reaction and Krebs cycle</text>
<text x="43" y="189" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#075985">Donates 2 electrons → NAD⁺</text>
<path d="M310 146 H363" stroke="#0f766e" stroke-width="4" fill="none"/>
<path d="M353 137 L368 146 L353 155" fill="none" stroke="#0f766e" stroke-width="4"/>
<text x="316" y="129" font-family="Arial,sans-serif" font-size="14" fill="#0f766e">2 e⁻</text>
<rect x="379" y="80" width="286" height="130" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="398" y="112" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#115e59">Electron transport chain</text>
<text x="398" y="139" font-family="Arial,sans-serif" font-size="15" fill="#115e59">Carriers in the inner membrane</text>
<text x="398" y="164" font-family="Arial,sans-serif" font-size="15" fill="#115e59">pass electrons onward</text>
<text x="398" y="189" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#115e59">Energy released in steps</text>
<path d="M675 146 H729" stroke="#7c3aed" stroke-width="4" fill="none"/>
<path d="M719 137 L734 146 L719 155" fill="none" stroke="#7c3aed" stroke-width="4"/>
<rect x="744" y="80" width="190" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="760" y="112" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Proton pumping</text>
<text x="760" y="139" font-family="Arial,sans-serif" font-size="14" fill="#5b21b6">H⁺ moved from matrix</text>
<text x="760" y="159" font-family="Arial,sans-serif" font-size="14" fill="#5b21b6">to intermembrane space</text>
<text x="760" y="189" font-family="Arial,sans-serif" font-size="14" fill="#5b21b6">Builds H⁺ gradient</text>
<rect x="30" y="226" width="900" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="48" y="247" font-family="Arial,sans-serif" font-size="15" fill="#334155">Next: the proton gradient drives ATP synthase as H⁺ returns to the matrix.</text>
<text x="48" y="267" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#9a3412">NADH does not turn directly into ATP; electron energy is transferred through the chain.</text>
</svg>