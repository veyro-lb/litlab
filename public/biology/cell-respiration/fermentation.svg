<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="34" y="42" font-size="24" font-weight="600">Two routes regenerate NAD⁺ without oxygen</text><rect x="318" y="72" width="230" height="66" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="332" y="107" font-size="19" font-weight="600">2 pyruvate (3C)</text><path d="M348 145 L170 209" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M542 145 L680 209" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="42" y="212" width="322" height="77" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="56" y="247" font-size="19" font-weight="600">Human: 2 lactate (3C)</text><rect x="456" y="212" width="357" height="77" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="470" y="247" font-size="19" font-weight="600">Yeast: 2 ethanol (2C)</text><text x="65" y="329" font-size="17" font-weight="600">NADH → NAD⁺; no CO₂ at lactate step</text><text x="480" y="329" font-size="17" font-weight="600">2 CO₂ released before ethanol forms</text></g></svg>
