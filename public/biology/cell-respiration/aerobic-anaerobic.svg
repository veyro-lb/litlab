<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="360" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><text x="45" y="45" font-size="25" font-weight="600">Human glucose metabolism</text><rect x="45" y="100" width="230" height="65" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="59" y="135" font-size="19" font-weight="600">Glucose (6C)</text><path d="M275 133 L398 133" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="402" y="100" width="260" height="65" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="416" y="135" font-size="19" font-weight="600">Glycolysis → pyruvate</text><path d="M530 165 L530 205" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="80" y="245" width="320" height="76" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="94" y="280" font-size="19" font-weight="600">O₂ limited: lactate + NAD⁺</text><rect x="456" y="245" width="350" height="76" rx="12" fill="#e1f3f1" stroke="#78b5b2"/><text x="470" y="280" font-size="19" font-weight="600">O₂ available: CO₂ + H₂O</text><path d="M500 203 L270 243" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M560 203 L634 244" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="54" y="351" font-size="16" font-weight="600">Glycolysis occurs in cytosol; aerobic later stages involve mitochondria.</text></g></svg>
