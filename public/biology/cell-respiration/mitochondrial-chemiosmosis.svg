<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="title desc"><title id="title">Chemiosmosis in mitochondria</title><desc id="desc">Original model: H⁺ pumped from matrix to intermembrane space; H⁺ returns to matrix through ATP synthase. Electrons supplied by NADH pass to oxygen, which forms water. Proton and electron pathways shown separately; membrane complexes grouped.</desc><defs><marker id="147d83" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#147d83"/></marker><marker id="316aaf" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#316aaf"/></marker><marker id="b84c6f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b84c6f"/></marker><marker id="a87013" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a87013"/></marker><marker id="4c8759" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c8759"/></marker></defs><rect width="600" height="780" rx="12" fill="#fbfdfb"/><g font-family="Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#163d48" text-anchor="start" font-weight="700">Chemiosmosis in mitochondria</text><text x="28" y="77" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">INTERMEMBRANE SPACE · higher H⁺ concentration</text><rect x="28" y="92" width="544" height="122" rx="12" fill="#e2edf8" stroke="#86ada8" stroke-width="2"/><text x="48" y="128" font-size="25" fill="#316aaf" text-anchor="start" font-weight="400">H⁺   H⁺   H⁺   H⁺   H⁺   H⁺</text><rect x="28" y="214" width="544" height="90" rx="12" fill="#c9ddd6" stroke="#86ada8" stroke-width="2"/><text x="235" y="350" font-size="20" fill="#163d48" text-anchor="start" font-weight="400">MATRIX · lower H⁺</text><rect x="90" y="192" width="120" height="133" rx="12" fill="#bedfe3" stroke="#86ada8" stroke-width="2"/><text x="150" y="244" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">Chain</text><text x="150" y="273" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">carriers</text><path d="M112 371V151" fill="none" stroke="#316aaf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#316aaf)"/><text x="42" y="174" font-size="22" fill="#316aaf" text-anchor="start" font-weight="400">H⁺</text><rect x="378" y="192" width="150" height="133" rx="12" fill="#f0d5b4" stroke="#86ada8" stroke-width="2"/><text x="453" y="244" font-size="22" fill="#163d48" text-anchor="middle" font-weight="400">ATP</text><text x="453" y="273" font-size="21" fill="#163d48" text-anchor="middle" font-weight="400">synthase</text><path d="M500 150V374" fill="none" stroke="#a87013" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="517" y="177" font-size="22" fill="#a87013" text-anchor="start" font-weight="400">H⁺</text><path d="M416 349V397" fill="none" stroke="#a87013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a87013)"/><text x="453" y="427" font-size="24" fill="#a87013" text-anchor="middle" font-weight="400">ATP</text><text x="363" y="375" font-size="20" fill="#a87013" text-anchor="end" font-weight="400">ADP + Pi</text><text x="35" y="452" font-size="22" fill="#163d48" text-anchor="start" font-weight="600">Electron flow (not proton movement):</text><rect x="30" y="473" width="156" height="70" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="108.0" y="504" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">NADH → NAD⁺</text><path d="M191 508H223" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="232" y="473" width="145" height="70" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="304.5" y="504" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">Carriers</text><path d="M382 508H414" fill="none" stroke="#147d83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#147d83)"/><rect x="424" y="473" width="146" height="70" rx="12" fill="#e5f3ef" stroke="#86ada8" stroke-width="2"/><text x="497.0" y="504" font-size="22" fill="#163d48" text-anchor="middle" font-weight="600">O₂ → H₂O</text><text x="30" y="584" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Electron transfer releases energy for</text><text x="30" y="612" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">proton pumping from matrix to</text><text x="30" y="640" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">intermembrane space.</text><text x="30" y="680" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">Proton return through ATP synthase drives</text><text x="30" y="708" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">phosphorylation. No fixed ATP-per-NADH</text><text x="30" y="736" font-size="21" fill="#163d48" text-anchor="start" font-weight="400">yield.</text></g></svg>