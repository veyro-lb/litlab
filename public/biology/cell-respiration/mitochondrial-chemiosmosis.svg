<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="t d"><title id="t">Biological process illustration</title><desc id="d">Author-created explanatory mechanism; see accompanying lesson for detailed description.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#165e78"/></marker></defs><rect width="860" height="390" rx="18" fill="#fafdfb"/><g font-family="Arial, sans-serif" fill="#153b46"><rect x="37" y="100" width="784" height="76" fill="#d7eaf2" stroke="#165e78" stroke-width="2"/><rect x="37" y="176" width="784" height="43" fill="#b3d7df" stroke="#165e78" stroke-width="2"/><rect x="37" y="219" width="784" height="95" fill="#f1f8f4" stroke="#165e78" stroke-width="2"/><text x="45" y="34" font-size="24" font-weight="600">Mitochondrial inner-membrane chemiosmosis</text><text x="51" y="89" font-size="19" font-weight="600">INTERMEMBRANE SPACE: more H⁺</text><text x="52" y="341" font-size="19" font-weight="600">MATRIX: NADH donates electrons; ADP + Pi → ATP</text><rect x="230" y="157" width="140" height="74" rx="8" fill="#74acc0" stroke="#18556a"/><rect x="595" y="157" width="135" height="74" rx="8" fill="#74acc0" stroke="#18556a"/><text x="241" y="200" font-size="16" font-weight="600">Electron chain</text><text x="607" y="200" font-size="15" font-weight="600">ATP synthase</text><path d="M283 271 L283 109" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M661 110 L661 272" stroke="#165e78" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="310" y="268" font-size="16" font-weight="600">NADH → NAD⁺</text><text x="713" y="267" font-size="18" font-weight="600">ATP</text><text x="386" y="145" font-size="17" font-weight="600">H⁺ pumped ↑</text><text x="691" y="145" font-size="16" font-weight="600">H⁺ returns ↓</text><text x="42" y="371" font-size="17" font-weight="600">Electron flow to O₂ → H₂O; proton movement through ATP synthase makes ATP.</text></g></svg>
