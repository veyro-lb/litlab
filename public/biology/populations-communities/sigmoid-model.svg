<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">Hypothetical sigmoid population growth model approaching carrying capacity</title>
<desc id="desc">Model values at times 0, 1, 2, 3, 4 and 5 are 10, 18, 31, 45, 53 and 55 individuals, approaching a hypothetical carrying capacity of approximately 60 individuals. Not observed laboratory data.</desc>
<rect width="880" height="500" rx="20" fill="#f9fbfa"/><text x="56" y="52" fill="#183f39" font-family="Arial,sans-serif" font-size="25" font-weight="700">Sigmoid population model</text><text x="56" y="81" fill="#526d67" font-family="Arial,sans-serif" font-size="16">Constructed numerical model — not measured yeast or duckweed data</text>
<g stroke="#b3cbc4" stroke-width="1.5"><path d="M134 375H800"/><path d="M134 318H800" stroke-dasharray="3 6"/><path d="M134 261H800" stroke-dasharray="3 6"/><path d="M134 204H800" stroke-dasharray="3 6"/><path d="M134 147H800" stroke-dasharray="3 6"/><path d="M134 90H800" stroke-dasharray="3 6"/></g>
<path d="M134 90V375H800" stroke="#244d46" fill="none" stroke-width="3"/>
<path d="M134 90H800" stroke="#d78d47" stroke-width="3" stroke-dasharray="10 8"/><text x="800" y="115" fill="#936126" font-family="Arial,sans-serif" font-size="15" text-anchor="end">Model carrying capacity ≈ 60</text>
<polyline points="134,327.5 267.2,289.5 400.4,227.75 533.6,161.25 666.8,123.25 800,113.75" fill="none" stroke="#167b6c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#167b6c" stroke="#fff" stroke-width="3"><circle cx="134" cy="327.5" r="7"/><circle cx="267.2" cy="289.5" r="7"/><circle cx="400.4" cy="227.75" r="7"/><circle cx="533.6" cy="161.25" r="7"/><circle cx="666.8" cy="123.25" r="7"/><circle cx="800" cy="113.75" r="7"/></g>
<g fill="#345750" font-family="Arial,sans-serif" font-size="16" text-anchor="end"><text x="118" y="381">0</text><text x="118" y="324">12</text><text x="118" y="267">24</text><text x="118" y="210">36</text><text x="118" y="153">48</text><text x="118" y="96">60</text></g>
<g fill="#345750" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="134" y="405">0</text><text x="267.2" y="405">1</text><text x="400.4" y="405">2</text><text x="533.6" y="405">3</text><text x="666.8" y="405">4</text><text x="800" y="405">5</text></g>
<text x="470" y="451" fill="#24574c" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Elapsed time (arbitrary units)</text><text x="46" y="240" fill="#24574c" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" transform="rotate(-90 46 240)">Population (individuals)</text>
</svg>