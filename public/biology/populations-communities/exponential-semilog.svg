<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc">
<title id="title">An exponential growth model on a semi-logarithmic graph</title>
<desc id="desc">Constructed counts 10, 20, 40 and 80 individuals at successive equally spaced times appear on a straight rising line because the vertical population axis uses a logarithmic scale with equal positions for each doubling; horizontal time axis is linear. These are not observations.</desc>
<rect width="880" height="470" rx="20" fill="#f8fbfa"/>
<text x="50" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183f39">Recognizing exponential growth</text>
<text x="50" y="77" font-family="Arial,sans-serif" font-size="16" fill="#526d67">Constructed population model — no organism was sampled</text>
<g stroke="#c9d8d3" stroke-width="1.5" stroke-dasharray="4 5">
<path d="M152 332H782"/><path d="M152 252H782"/><path d="M152 172H782"/><path d="M152 92H782"/>
</g>
<path d="M152 92V332H782" stroke="#234940" stroke-width="3" fill="none"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#345750" text-anchor="end">
<text x="134" y="338">10</text><text x="134" y="258">20</text><text x="134" y="178">40</text><text x="134" y="98">80</text>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#345750" text-anchor="middle">
<text x="152" y="363">0</text><text x="362" y="363">1</text><text x="572" y="363">2</text><text x="782" y="363">3</text>
</g>
<path d="M152 332L362 252L572 172L782 92" fill="none" stroke="#17786b" stroke-width="5" stroke-linecap="round"/>
<g fill="#17786b" stroke="#ffffff" stroke-width="3">
<circle cx="152" cy="332" r="7"/><circle cx="362" cy="252" r="7"/><circle cx="572" cy="172" r="7"/><circle cx="782" cy="92" r="7"/>
</g>
<text x="467" y="403" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#24574c">Elapsed time (arbitrary units; linear scale)</text>
<text x="49" y="214" transform="rotate(-90 49 214)" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#24574c">Population size (individuals; log scale)</text>
<text x="465" y="441" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#526d67">Equal vertical gaps represent a ×2 increase, not equal additions.</text>
</svg>
