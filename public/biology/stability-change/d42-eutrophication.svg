<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="350" viewBox="0 0 1020 350" role="img"><rect width="1020" height="350" rx="20" fill="#f7fbfa"/><style>text{font:17px system-ui;fill:#18505a}.head{font-weight:700;font-size:24px}.sub{font-size:14px;fill:#50777d}</style><text x="25" y="37" class="head">Eutrophication: an oxygen-demand cascade</text><rect x="25" y="110" width="176" height="82" rx="13" fill="#dff2ef" stroke="#7db5ad"/><text x="37" y="142">Fertilizer N + P</text><path d="M201 149H223" stroke="#1a8791" stroke-width="3"/><path d="M214 144 L223 149 L214 154" fill="none" stroke="#1a8791" stroke-width="2"/><rect x="232" y="110" width="176" height="82" rx="13" fill="#dff2ef" stroke="#7db5ad"/><text x="244" y="142">Algal growth</text><path d="M408 149H428" stroke="#1a8791" stroke-width="3"/><path d="M419 144 L428 149 L419 154" fill="none" stroke="#1a8791" stroke-width="2"/><rect x="437" y="110" width="176" height="82" rx="13" fill="#dff2ef" stroke="#7db5ad"/><text x="449" y="142">Decomposition</text><path d="M613 149H634" stroke="#1a8791" stroke-width="3"/><path d="M625 144 L634 149 L625 154" fill="none" stroke="#1a8791" stroke-width="2"/><rect x="643" y="110" width="176" height="82" rx="13" fill="#dff2ef" stroke="#7db5ad"/><text x="655" y="142">BOD increases</text><path d="M819 149H833" stroke="#1a8791" stroke-width="3"/><path d="M824 144 L833 149 L824 154" fill="none" stroke="#1a8791" stroke-width="2"/><rect x="842" y="110" width="160" height="82" rx="13" fill="#dff2ef" stroke="#7db5ad"/><text x="854" y="142">Oxygen falls</text><text x="28" y="264">Consequences: hypoxia → reduced fish and invertebrate survival</text><text x="28" y="311" class="sub">BOD = oxygen required by microbes to break down degradable organic material</text></svg>