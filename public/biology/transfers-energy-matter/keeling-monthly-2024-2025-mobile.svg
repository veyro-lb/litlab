<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 474" role="img" aria-labelledby="title desc">
<title id="title">Observed monthly carbon dioxide at Mauna Loa, 2024 and 2025</title>
<desc id="desc">Original line chart from NOAA Global Monitoring Laboratory observed monthly average concentrations in ppm, compared month-for-month for 2024 and 2025. Both series peak in late spring or early summer and fall into early autumn; 2025 levels are generally higher. NOAA August 2026 values were rechecked unchanged against the 9 October 2026 source snapshot. No interpolated, smoothed or invented points.</desc>
