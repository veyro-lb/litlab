<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Meadow food web: direction of biomass and chemical energy transfer</title>
<desc id="desc">Arrows point from food to consumer. Grass feeds grasshoppers and rabbits; grasshoppers feed insect-eating songbirds; songbirds and rabbits feed foxes. This is a constructed conceptual meadow food web, not a census of a particular site.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#136f67"/></marker></defs>
<rect width="960" height="500" rx="22" fill="#f8fbf9"/><text x="45" y="57" font-family="Arial,sans-serif" fill="#153a35" font-size="28" font-weight="700">A meadow food web</text><text x="45" y="89" font-family="Arial,sans-serif" fill="#4a6761" font-size="17">Arrows show movement of biomass and stored chemical energy →</text>
<g fill="none" stroke="#136f67" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"><path d="M224 218L301 156"/><path d="M224 266L301 330"/><path d="M470 154L542 154"/><path d="M710 156L762 224"/><path d="M470 331L762 266"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700">
<rect x="54" y="204" width="170" height="96" rx="18" fill="#e1f4d6" stroke="#74a35c" stroke-width="2"/><text x="139" y="243" fill="#255023">Grass</text><text x="139" y="273" fill="#476b41" font-size="15" font-weight="400">Producer</text>
<rect x="301" y="114" width="169" height="82" rx="18" fill="#e5f5f0" stroke="#83b8aa" stroke-width="2"/><text x="386" y="148" fill="#20534c">Grasshopper</text><text x="386" y="175" fill="#476b68" font-size="14" font-weight="400">Primary consumer</text>
<rect x="301" y="292" width="169" height="82" rx="18" fill="#e5f5f0" stroke="#83b8aa" stroke-width="2"/><text x="386" y="328" fill="#20534c">Rabbit</text><text x="386" y="352" fill="#476b68" font-size="14" font-weight="400">Primary consumer</text>
<rect x="542" y="114" width="168" height="82" rx="18" fill="#e7eef9" stroke="#87a0ca" stroke-width="2"/><text x="626" y="148" fill="#284466">Songbird</text><text x="626" y="175" fill="#536d89" font-size="14" font-weight="400">Secondary consumer</text>
<rect x="762" y="205" width="164" height="100" rx="18" fill="#fbeedb" stroke="#c7a36c" stroke-width="2"/><text x="844" y="247" fill="#644c26">Fox</text><text x="844" y="274" fill="#88704c" font-size="14" font-weight="400">Consumer</text>
</g>
<path d="M45 410H915" stroke="#c7dcd6"/><text x="45" y="443" font-family="Arial,sans-serif" font-size="17" fill="#365d57">Conceptual food web: organisms may have additional foods and consumers.</text><text x="45" y="470" font-family="Arial,sans-serif" font-size="15" fill="#58736d">Dead biomass and waste also supply decomposers (not shown in these grazing links).</text>
</svg>