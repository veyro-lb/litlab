<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 356"><title id="title">Lateral light produces differential shoot elongation</title><desc id="desc">Light arrows enter from the left, toward a young shoot bent toward the light. The shoot's shaded right side is labelled greater auxin-related elongation and the lit side lower elongation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#266b8b"/></marker></defs><rect x="0" y="0" width="920" height="356" rx="18" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18354a"><path d="M85 65L211 65M85 104L211 104M85 143L211 143" stroke="#d39013" stroke-width="6" marker-end="url(#arrow)"/><text x="40" y="33">Lateral light</text><path d="M278 310C281 247 303 220 279 150C261 115 242 108 205 108" fill="none" stroke="#4e9970" stroke-width="65" stroke-linecap="round"/><path d="M278 310C281 247 303 220 279 150C261 115 242 108 205 108" fill="none" stroke="#c6eed1" stroke-width="42" stroke-linecap="round"/><path d="M300 300C310 240 320 198 295 154" fill="none" stroke="#266a49" stroke-width="9" stroke-dasharray="12 11"/><text x="401" y="103">Shaded side</text><text x="401" y="129">greater auxin-associated elongation</text><path d="M393 137L310 175" stroke="#266a49" stroke-width="2"/><text x="401" y="220">Lit side</text><text x="401" y="246">less elongation</text><path d="M390 232L264 197" stroke="#d39013" stroke-width="2"/><text x="401" y="308">Differential growth bends shoot</text><text x="401" y="332">toward the light</text></g></svg>
