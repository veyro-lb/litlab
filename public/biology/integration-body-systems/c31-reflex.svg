<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 356"><title id="title">Spinal withdrawal reflex: direction of neural information</title><desc id="desc">A pain receptor in the hand sends an afferent signal through a dorsal-root sensory neuron, into the spinal grey matter interneuron, then out through a ventral-root motor neuron to a flexor muscle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#266b8b"/></marker></defs><rect x="0" y="0" width="920" height="356" rx="18" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18354a"><rect x="24" y="92" width="150" height="92" rx="15" fill="#eaf5fb" stroke="#18658a"/><text x="99" y="122" text-anchor="middle">Free pain ending</text><text x="99" y="146" text-anchor="middle">in hand</text><rect x="244" y="92" width="147" height="92" rx="15" fill="#f2f8ff" stroke="#18658a"/><text x="317" y="121" text-anchor="middle">Sensory neuron</text><text x="317" y="145" text-anchor="middle">dorsal-root ganglion</text><rect x="462" y="70" width="154" height="134" rx="18" fill="#f6efff" stroke="#6b3d9a"/><text x="539" y="100" text-anchor="middle">Spinal grey matter</text><text x="539" y="126" text-anchor="middle">ONE interneuron</text><text x="539" y="153" text-anchor="middle">integrates input</text><rect x="675" y="92" width="160" height="92" rx="15" fill="#eef8ee" stroke="#2c7d4d"/><text x="755" y="119" text-anchor="middle">Motor neuron</text><text x="755" y="143" text-anchor="middle">ventral-root output</text><path d="M174 137H242 M391 137H460 M616 137H674" stroke="#15657e" stroke-width="3" marker-end="url(#arrow)"/><rect x="341" y="250" width="245" height="65" rx="14" fill="#fff6e6" stroke="#be8424"/><text x="464" y="277" text-anchor="middle">Flexor skeletal muscle</text><text x="464" y="298" text-anchor="middle">withdraws the hand</text><path d="M755 185V283H590" stroke="#216a43" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="539" y="39" text-anchor="middle" font-weight="bold">Spinal cord</text><text x="85" y="62">Stimulus</text><text x="694" y="62">Efferent</text></g></svg>
