<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 356"><title id="title">Arterial pressure: a negative-feedback control loop</title><desc id="desc">Arterial blood pressure change is sensed by carotid sinus and aortic arch baroreceptors, relayed to the medulla, which adjusts autonomic signals to heart rate and stroke volume to oppose the original change.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#266b8b"/></marker></defs><rect x="0" y="0" width="920" height="356" rx="18" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#18354a"><rect x="25" y="85" width="182" height="85" rx="14" stroke="#266b8b" fill="#eef7fa"/><text x="116" y="123" text-anchor="middle">Pressure change</text><rect x="236" y="85" width="205" height="85" rx="14" stroke="#266b8b" fill="#eef7fa"/><text x="338" y="123" text-anchor="middle">Pressure sensors</text><text x="338" y="145" text-anchor="middle">carotid sinus / aortic arch</text><rect x="474" y="85" width="182" height="85" rx="14" stroke="#266b8b" fill="#f5efff"/><text x="565" y="123" text-anchor="middle">Medulla integration</text><rect x="682" y="85" width="215" height="85" rx="14" stroke="#266b8b" fill="#eef7fa"/><text x="789" y="123" text-anchor="middle">Cardiac response</text><text x="789" y="145" text-anchor="middle">rate and stroke volume</text><path d="M207 127H235 M441 127H473 M656 127H681" stroke="#266b8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M791 172V245H111V173" stroke="#377853" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="445" y="270" text-anchor="middle">Corrective response tends to oppose pressure deviation</text></g></svg>
